<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JN Wonderland - Character Creation</title>
    <style>
        /* ========== GLOBAL PIXEL STYLE ========== */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
        }

        /* ========== MAIN GAME CONTAINER ========== */
        .game-container {
            background: #1a1a2e;
            border: 6px solid #4a4a6a;
            padding: 30px;
            max-width: 900px;
            width: 100%;
            box-shadow: 0 0 40px rgba(100, 50, 200, 0.3);
            position: relative;
        }

        /* ========== HEADER ========== */
        .game-title {
            text-align: center;
            color: #ff6b6b;
            font-size: 20px;
            letter-spacing: 4px;
            text-shadow: 4px 4px 0 #2d2d4a;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 4px solid #4a4a6a;
        }

        .game-title span {
            color: #ffd93d;
        }

        /* ========== MAIN LAYOUT ========== */
        .stat-layout {
            display: flex;
            flex-direction: row;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ========== LEFT: CHARACTER DISPLAY ========== */
        .character-display {
            flex: 1;
            min-width: 200px;
            text-align: center;
            background: #12121f;
            border: 4px solid #3a3a5a;
            padding: 20px;
        }

        .character-pixel {
            width: 160px;
            height: 200px;
            margin: 0 auto 15px;
            background: #1a1a2e;
            border: 3px solid #4a4a6a;
            position: relative;
            image-rendering: pixelated;
        }

        /* ========== PIXEL CHARACTER SPRITE ========== */
        /* Base body - changes with customization */
        .pixel-sprite {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            grid-template-rows: repeat(15, 1fr);
            gap: 1px;
            padding: 4px;
        }

        .pixel {
            width: 100%;
            height: 100%;
            background: transparent;
        }

        /* Skin tones */
        .skin-light { background: #f5d0b8; }
        .skin-medium { background: #d4a574; }
        .skin-dark { background: #8d6b4b; }
        .skin-olive { background: #c4a882; }

        /* Hair colors */
        .hair-blonde { background: #f5d742; }
        .hair-brown { background: #8b6b4a; }
        .hair-black { background: #2a2a2a; }
        .hair-red { background: #c0392b; }
        .hair-pink { background: #ff6b9d; }

        /* Outfit colors */
        .outfit-hoodie { background: #4a7a9c; }
        .outfit-sweater { background: #8b5a2b; }
        .outfit-jacket { background: #2d3d4a; }
        .outfit-tshirt { background: #c0392b; }

        /* Eyes (fixed) */
        .eye-white { background: #f0f0f0; }
        .eye-pupil { background: #1a1a2e; }

        /* Mouth (fixed) */
        .mouth { background: #8b6b4a; }

        /* ========== CHARACTER NAME ========== */
        .character-name {
            color: #d4d4f0;
            font-size: 12px;
            margin-top: 10px;
            background: #0a0a15;
            padding: 8px;
            border: 2px solid #3a3a5a;
        }

        .character-name input {
            background: transparent;
            border: none;
            color: #ffd93d;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            text-align: center;
            width: 120px;
            outline: none;
        }

        .character-name input::placeholder {
            color: #4a4a6a;
        }

        /* ========== RIGHT: STATS ========== */
        .stats-panel {
            flex: 1;
            min-width: 250px;
            background: #12121f;
            border: 4px solid #3a3a5a;
            padding: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 2px solid #1a1a2e;
            color: #c8c8e8;
            font-size: 11px;
        }

        .stat-row .label {
            color: #8888aa;
        }

        .stat-row .value {
            color: #ffd93d;
        }

        .stat-row .value.hp {
            color: #ff6b6b;
        }
        .stat-row .value.wonder {
            color: #a29bfe;
        }

        /* ========== CUSTOMIZATION CONTROLS ========== */
        .customization {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 4px solid #2a2a4a;
        }

        .custom-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 6px 0;
            color: #8888aa;
            font-size: 9px;
        }

        .custom-row .controls {
            display: flex;
            gap: 8px;
        }

        .custom-row .controls button {
            background: #2a2a4a;
            border: 2px solid #4a4a6a;
            color: #d4d4f0;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            padding: 4px 12px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .custom-row .controls button:hover {
            background: #4a4a7a;
            border-color: #ffd93d;
        }

        .custom-row .controls button:active {
            transform: scale(0.95);
        }

        .custom-row .current-value {
            color: #ffd93d;
            font-size: 9px;
            min-width: 60px;
            text-align: center;
        }

        /* ========== START BUTTON ========== */
        .start-button {
            display: block;
            width: 100%;
            margin-top: 20px;
            padding: 16px;
            background: #2a2a4a;
            border: 4px solid #4a4a6a;
            color: #ffd93d;
            font-family: 'Press Start 2P', monospace;
            font-size: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            text-shadow: 2px 2px 0 #1a1a2e;
            letter-spacing: 2px;
        }

        .start-button:hover {
            background: #4a4a7a;
            border-color: #ffd93d;
            box-shadow: 0 0 30px rgba(255, 217, 61, 0.2);
        }

        .start-button:active {
            transform: scale(0.98);
        }

        /* ========== WONDERLAND CORRUPTION EFFECT ========== */
        .glitch-text {
            animation: glitch 3s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { opacity: 1; transform: translate(0); }
            92% { opacity: 0.8; transform: translate(-2px, 1px); }
            94% { opacity: 1; transform: translate(2px, -1px); }
            96% { opacity: 0.9; transform: translate(-1px, 2px); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 700px) {
            .game-container { padding: 15px; }
            .stat-layout { flex-direction: column; align-items: center; }
            .character-display, .stats-panel { width: 100%; }
            .game-title { font-size: 14px; }
        }
    </style>
</head>
<body>

    <div class="game-container">
        <!-- ===== TITLE ===== -->
        <div class="game-title">
            ⚠️ JOHN <span>NEUMAIER</span> WONDERLAND ⚠️
            <div style="font-size: 9px; color: #6666aa; margin-top: 6px; letter-spacing: 0;">
                ✦ room 303 is waiting ✦
            </div>
        </div>

        <!-- ===== MAIN LAYOUT ===== -->
        <div class="stat-layout">

            <!-- ===== LEFT: CHARACTER ===== -->
            <div class="character-display">
                <div class="character-pixel" id="characterSprite">
                    <!-- Sprite built by JavaScript -->
                </div>

                <div class="character-name">
                    ▶ NAME: 
                    <input type="text" id="playerName" placeholder="PROTAGONIST" maxlength="12">
                </div>

                <!-- Customization Controls -->
                <div class="customization">
                    <div class="custom-row">
                        <span>HAIR</span>
                        <div class="controls">
                            <button onclick="changeHair(-1)">◀</button>
                            <span class="current-value" id="hairLabel">BLONDE</span>
                            <button onclick="changeHair(1)">▶</button>
                        </div>
                    </div>
                    <div class="custom-row">
                        <span>SKIN</span>
                        <div class="controls">
                            <button onclick="changeSkin(-1)">◀</button>
                            <span class="current-value" id="skinLabel">LIGHT</span>
                            <button onclick="changeSkin(1)">▶</button>
                        </div>
                    </div>
                    <div class="custom-row">
                        <span>OUTFIT</span>
                        <div class="controls">
                            <button onclick="changeOutfit(-1)">◀</button>
                            <span class="current-value" id="outfitLabel">HOODIE</span>
                            <button onclick="changeOutfit(1)">▶</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ===== RIGHT: STATS ===== -->
            <div class="stats-panel">
                <div class="stat-row">
                    <span class="label">❤️ HP</span>
                    <span class="value hp" id="hpStat">20 / 20</span>
                </div>
                <div class="stat-row">
                    <span class="label">⚔️ ATK</span>
                    <span class="value" id="atkStat">5</span>
                </div>
                <div class="stat-row">
                    <span class="label">🛡️ DEF</span>
                    <span class="value" id="defStat">3</span>
                </div>
                <div class="stat-row">
                    <span class="label">⭐ LVL</span>
                    <span class="value" id="lvlStat">1</span>
                </div>
                <div class="stat-row">
                    <span class="label">✨ EXP</span>
                    <span class="value" id="expStat">0</span>
                </div>
                <div class="stat-row">
                    <span class="label">🌀 WONDER</span>
                    <span class="value wonder" id="wonderStat">0%</span>
                </div>

                <!-- Subtitle / Flavor Text -->
                <div style="margin-top: 20px; font-size: 8px; color: #555577; text-align: center; line-height: 1.8; border-top: 2px solid #1a1a2e; padding-top: 15px;">
                    <span class="glitch-text">✦ the walls are breathing ✦</span><br>
                    <span style="color: #3a3a5a;">third floor • room 303 • JN hall</span>
                </div>
            </div>
        </div>

        <!-- ===== START BUTTON ===== -->
        <button class="start-button" id="startGameBtn">
            ▶ ENTER ROOM 303 ◀
        </button>
    </div>

    <script>
        // ============================================================
        //  CHARACTER CUSTOMIZATION SYSTEM
        // ============================================================

        // Data
        const hairOptions = ['blonde', 'brown', 'black', 'red', 'pink'];
        const hairLabels = ['BLONDE', 'BROWN', 'BLACK', 'RED', 'PINK'];
        const skinOptions = ['light', 'medium', 'dark', 'olive'];
        const skinLabels = ['LIGHT', 'MEDIUM', 'DARK', 'OLIVE'];
        const outfitOptions = ['hoodie', 'sweater', 'jacket', 'tshirt'];
        const outfitLabels = ['HOODIE', 'SWEATER', 'JACKET', 'T-SHIRT'];

        let hairIndex = 0;
        let skinIndex = 0;
        let outfitIndex = 0;

        // ============================================================
        //  PIXEL SPRITE BUILDER
        // ============================================================

        function buildPixelSprite(hair, skin, outfit) {
            // 12 columns x 15 rows pixel art character
            // This is a simplified Undertale-style sprite
            const rows = 15;
            const cols = 12;
            
            // Define which cells get which class
            // 0 = empty, 1 = skin, 2 = hair, 3 = outfit, 4 = eye-white, 5 = pupil, 6 = mouth
            
            // Simplified character map (12x15 grid)
            // Row 0-1: Hair top
            // Row 2: Hair + forehead
            // Row 3-4: Eyes
            // Row 5-8: Body (outfit)
            // Row 9-11: Legs (outfit)
            // Row 12-14: Feet (outfit)
            
            const map = [
                // r0: top hair
                [0,0,0,2,2,2,2,2,2,0,0,0],
                // r1: hair sides
                [0,0,2,2,2,2,2,2,2,2,0,0],
                // r2: hair + forehead
                [0,2,2,1,1,1,1,1,1,2,2,0],
                // r3: eyes row 1
                [2,2,1,4,5,1,1,4,5,1,2,2],
                // r4: eyes row 2 + mouth
                [2,2,1,4,5,1,1,4,5,1,2,2],
                // r5: upper body start
                [0,0,3,3,3,3,3,3,3,3,0,0],
                // r6: body
                [0,3,3,3,3,3,3,3,3,3,3,0],
                // r7: body
                [0,3,3,3,3,3,3,3,3,3,3,0],
                // r8: body
                [0,3,3,3,3,3,3,3,3,3,3,0],
                // r9: legs start
                [0,0,3,3,3,3,3,3,3,3,0,0],
                // r10: legs
                [0,0,3,3,3,3,3,3,3,3,0,0],
                // r11: legs
                [0,0,3,3,3,3,3,3,3,3,0,0],
                // r12: feet
                [0,0,0,3,3,3,3,3,3,0,0,0],
                // r13: feet
                [0,0,0,3,3,3,3,3,3,0,0,0],
                // r14: feet bottom
                [0,0,0,3,3,3,3,3,3,0,0,0]
            ];

            // Build the HTML
            let html = '<div class="pixel-sprite">';
            
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const cell = map[r][c];
                    let classes = 'pixel';
                    
                    if (cell === 1) classes += ` skin-${skin}`;
                    else if (cell === 2) classes += ` hair-${hair}`;
                    else if (cell === 3) classes += ` outfit-${outfit}`;
                    else if (cell === 4) classes += ' eye-white';
                    else if (cell === 5) classes += ' eye-pupil';
                    else if (cell === 6) classes += ' mouth';
                    
                    html += `<div class="${classes}"></div>`;
                }
            }
            
            html += '</div>';
            return html;
        }

        // ============================================================
        //  UPDATE FUNCTIONS
        // ============================================================

        function updateCharacter() {
            const hair = hairOptions[hairIndex];
            const skin = skinOptions[skinIndex];
            const outfit = outfitOptions[outfitIndex];
            
            document.getElementById('characterSprite').innerHTML = buildPixelSprite(hair, skin, outfit);
            
            // Update labels
            document.getElementById('hairLabel').textContent = hairLabels[hairIndex];
            document.getElementById('skinLabel').textContent = skinLabels[skinIndex];
            document.getElementById('outfitLabel').textContent = outfitLabels[outfitIndex];
        }

        function changeHair(delta) {
            hairIndex = (hairIndex + delta + hairOptions.length) % hairOptions.length;
            updateCharacter();
        }

        function changeSkin(delta) {
            skinIndex = (skinIndex + delta + skinOptions.length) % skinOptions.length;
            updateCharacter();
        }

        function changeOutfit(delta) {
            outfitIndex = (outfitIndex + delta + outfitOptions.length) % outfitOptions.length;
            updateCharacter();
        }

        // ============================================================
        //  SAVE / LOAD STATE
        // ============================================================

        function getPlayerState() {
            return {
                name: document.getElementById('playerName').value || 'PROTAGONIST',
                hair: hairOptions[hairIndex],
                skin: skinOptions[skinIndex],
                outfit: outfitOptions[outfitIndex],
                hp: 20,
                maxHp: 20,
                atk: 5,
                def: 3,
                lvl: 1,
                exp: 0,
                wonder: 0
            };
        }

        // ============================================================
        //  START GAME
        // ============================================================

        document.getElementById('startGameBtn').addEventListener('click', function() {
            const state = getPlayerState();
            
            // Save to localStorage so we can use it on the next page
            localStorage.setItem('jnPlayerState', JSON.stringify(state));
            
            // For now, alert the player info
            alert(`
╔═══════════════════════════════╗
║   🚪 ENTERING ROOM 303...    ║
╠═══════════════════════════════╣
║ NAME: ${state.name.padEnd(12)} ║
║ HAIR: ${state.hair.toUpperCase().padEnd(8)} ║
║ SKIN: ${state.skin.toUpperCase().padEnd(8)} ║
║ OUTFIT: ${state.outfit.toUpperCase().padEnd(8)} ║
║                               ║
║  ⚠️ THE CLOSET IS GLOWING ⚠️  ║
╚═══════════════════════════════╝

🔮 You hear screaming from Room 303...
   The door is slightly ajar...

   ✦ Welcome to John Neumaier Wonderland ✦
            `);
            
            // In the next phase, we'll transition to the actual game scene
            // For now, we'll display the opening scene in the console
            console.log('=== JN WONDERLAND ===');
            console.log('Player:', state.name);
            console.log('Entering Room 303...');
            console.log('The closet is glowing...');
            console.log('You step through into a twisted version of JN Hall.');
            console.log('The walls are breathing. The hallways go on forever.');
        });

        // ============================================================
        //  INIT
        // ============================================================

        // Check if there's saved state
        const saved = localStorage.getItem('jnPlayerState');
        if (saved) {
            try {
                const data = JSON.parse(saved);
                hairIndex = hairOptions.indexOf(data.hair) || 0;
                skinIndex = skinOptions.indexOf(data.skin) || 0;
                outfitIndex = outfitOptions.indexOf(data.outfit) || 0;
                document.getElementById('playerName').value = data.name;
            } catch(e) { /* ignore */ }
        }

        updateCharacter();

        // Also update stats display with some random variation for flavor
        // (In a real game, these would change based on gameplay)
        console.log('%c✦ JN WONDERLAND - CHARACTER CREATION ✦', 'font-size:16px; color:#ffd93d;');
        console.log('%cRoom 303 is waiting for you...', 'color:#8888aa;');
    </script>

</body>
</html>
