<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Neumaier Hall - The Adventure Begins</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #1a0a2e;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.5);
        }
        
        .game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #00ffff;
            padding: 20px;
            color: #fff;
            font-size: 12px;
            line-height: 1.6;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .dialogue-box.active {
            display: block;
            animation: dialogue-appear 0.5s ease-out;
        }
        
        @keyframes dialogue-appear {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ff00ff;
            padding: 30px;
            color: #fff;
            text-align: center;
            display: none;
            z-index: 200;
            min-width: 300px;
        }
        
        .menu.active {
            display: block;
        }
        
        .menu h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .menu button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .menu button:hover {
            background: #ff00ff;
            border-color: #fff;
            transform: scale(1.05);
        }
        
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 10px;
            z-index: 50;
            pointer-events: none;
        }
        
        .hud-left, .hud-right {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 2px solid #00ffff;
        }
        
        .hud-left {
            text-align: left;
        }
        
        .hud-right {
            text-align: right;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        
        .loading-text {
            color: #ff00ff;
            font-size: 24px;
            animation: loading-pulse 1s infinite;
        }
        
        @keyframes loading-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-screen" id="gameScreen">
            <!-- HUD -->
            <div class="hud">
                <div class="hud-left">
                    <div id="hudName">PLAYER</div>
                    <div>LV: <span id="hudLevel">1</span></div>
                    <div>HP: <span id="hudHP">30/30</span></div>
                    <div>PP: <span id="hudPP">10/10</span></div>
                </div>
                <div class="hud-right">
                    <div>EXP: <span id="hudEXP">0</span></div>
                    <div>MONEY: $<span id="hudMoney">0</span></div>
                    <div>LOCATION: <span id="hudLocation">Room 303</span></div>
                </div>
            </div>
            
            <!-- Dialogue Box -->
            <div class="dialogue-box" id="dialogueBox">
                <p id="dialogueText"></p>
                <p style="text-align: center; margin-top: 10px; color: #00ffff; font-size: 10px;">
                    [PRESS SPACE TO CONTINUE]
                </p>
            </div>
            
            <!-- Game Menu -->
            <div class="menu" id="gameMenu">
                <h2>MENU</h2>
                <button onclick="toggleMenu()">RESUME</button>
                <button onclick="showInventory()">INVENTORY</button>
                <button onclick="showStatus()">STATUS</button>
                <button onclick="saveGame()">SAVE</button>
                <button onclick="returnToTitle()">TITLE SCREEN</button>
            </div>
            
            <!-- Loading Screen -->
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-text">LOADING...</div>
            </div>
        </div>
    </div>
    
    <script>
        // Game state
        let gameState = {
            character: null,
            currentArea: 'room303',
            gameTime: 0,
            paused: false,
            inDialogue: false,
            dialogueQueue: []
        };
        
        // Initialize game
        function initGame() {
            // Load character from localStorage
            const characterData = localStorage.getItem('johnNeumaierCharacter');
            
            if (!characterData) {
                // No character found, return to title
                window.location.href = 'index.html';
                return;
            }
            
            gameState.character = JSON.parse(characterData);
            
            // Update HUD
            updateHUD();
            
            // Start opening scene
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                startOpeningScene();
            }, 2000);
        }
        
        // Update HUD elements
        function updateHUD() {
            const char = gameState.character;
            document.getElementById('hudName').textContent = char.name;
            document.getElementById('hudLevel').textContent = char.level;
            document.getElementById('hudHP').textContent = `${char.hp}/${char.maxHp}`;
            document.getElementById('hudPP').textContent = `${char.pp}/${char.maxPp}`;
            document.getElementById('hudEXP').textContent = char.exp;
            document.getElementById('hudMoney').textContent = char.money;
            document.getElementById('hudLocation').textContent = getLocationName(gameState.currentArea);
        }
        
        // Get location name
        function getLocationName(areaId) {
            const locations = {
                'room303': 'Room 303',
                'closet': 'The Closet',
                'darkForest': 'Dark Wonderland Forest',
                'graveyard': 'The Graveyard',
                'village': 'The Village',
                'upperVillage': 'Upper Village',
                'castleWalls': 'Castle Walls',
                'castle': 'The Castle'
            };
            return locations[areaId] || 'Unknown';
        }
        
        // Dialogue system
        function showDialogue(text) {
            gameState.inDialogue = true;
            document.getElementById('dialogueText').textContent = text;
            document.getElementById('dialogueBox').classList.add('active');
        }
        
        function closeDialogue() {
            gameState.inDialogue = false;
            document.getElementById('dialogueBox').classList.remove('active');
            
            if (gameState.dialogueQueue.length > 0) {
                const nextDialogue = gameState.dialogueQueue.shift();
                setTimeout(() => showDialogue(nextDialogue), 500);
            }
        }
        
        // Opening scene
        function startOpeningScene() {
            const char = gameState.character;
            
            gameState.dialogueQueue = [
                `${char.name}, you're in your dorm room at John Neumaier Hall.`,
                "It's a quiet evening... or so you thought.",
                "Suddenly, you hear a violent crash from room 303.",
                "IZZY SCREAMS!",
                "Something is terribly wrong..."
            ];
            
            showDialogue(gameState.dialogueQueue.shift());
        }
        
        // Menu functions
        function toggleMenu() {
            const menu = document.getElementById('gameMenu');
            menu.classList.toggle('active');
            gameState.paused = menu.classList.contains('active');
        }
        
        function showInventory() {
            // TODO: Implement inventory system
            console.log('Inventory system coming soon!');
        }
        
        function showStatus() {
            // TODO: Implement status screen
            console.log('Status screen coming soon!');
        }
        
        function saveGame() {
            localStorage.setItem('johnNeumaierSave', JSON.stringify(gameState));
            console.log('Game saved!');
        }
        
        function returnToTitle() {
            if (confirm('Return to title screen?')) {
                window.location.href = 'index.html';
            }
        }
        
        // Event listeners
        document.addEventListener('keydown', (e) => {
            if (e.key === ' ' && gameState.inDialogue) {
                e.preventDefault();
                if (gameState.dialogueQueue.length > 0) {
                    showDialogue(gameState.dialogueQueue.shift());
                } else {
                    closeDialogue();
                }
            }
            
            if (e.key === 'Escape' && !gameState.inDialogue) {
                toggleMenu();
            }
        });
        
        // Start the game
        initGame();
    </script>
</body>
</html>
