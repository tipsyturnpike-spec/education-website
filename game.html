urrentTime+i*.1);gn.gain.exponentialRampToValueAtTime(.01,this.audioContext.currentTime+i*.1+.1);os.start(this.audioContext.currentTime+i*.1);os.stop(this.audioContext.currentTime+i*.1+.1);});break;case'phone':[440,550].forEach((f,i)=>{const os=this.audioContext.createOscillator(),gn=this.audioContext.createGain();os.connect(gn);gn.connect(this.audioContext.destination);os.frequency.setValueAtTime(f,this.audioContext.currentTime+i*.15);gn.gain.setValueAtTime(.4,this.audioContext.currentTime+i*.15);gn.gain.exponentialRampToValueAtTime(.01,this.audioContext.currentTime+i*.15+.15);os.start(this.audioContext.currentTime+i*.15);os.stop(this.audioContext.currentTime+i*.15+.15);});break;}}};

// ============ ROOM 303 ============
function generateRoom303() {
    const m = maps.room303;
    m.collisionMap = Array(m.height).fill().map(() => Array(m.width).fill(0));
    
    // Boundaries
    for (let x = 0; x < m.width; x++) {
        m.collisionMap[0][x] = 1;
        m.collisionMap[m.height - 1][x] = 1;
    }
    for (let y = 0; y < m.height; y++) {
        m.collisionMap[y][0] = 1;
        m.collisionMap[y][m.width - 1] = 1;
    }
    
    // Door to closet (right wall at y=8,9)
    m.collisionMap[8][m.width - 1] = 0;
    m.collisionMap[9][m.width - 1] = 0;
    m.collisionMap[8][m.width - 2] = 0;
    m.collisionMap[9][m.width - 2] = 0;
    
    // Furniture - Bed (top left)
    for (let y = 5; y < 10; y++) {
        for (let x = 5; x < 12; x++) m.collisionMap[y][x] = 1;
    }
    
    // Furniture - Desk (middle)
    for (let y = 15; y < 18; y++) {
        for (let x = 25; x < 32; x++) m.collisionMap[y][x] = 1;
    }
    
    // Furniture - Bookshelf (right side)
    for (let y = 5; y < 12; y++) {
        for (let x = 30; x < 33; x++) m.collisionMap[y][x] = 1;
    }

    // ============ ENEMY SPAWNING ============
function spawnEnemies() {
    const m = maps[gameState.currentArea];
    gameState.visibleEnemies = [];
    
    if (!m.enemies || m.enemies.length === 0) return;
    
    const numEnemies = 2 + Math.floor(Math.random() * 2);
    
    for (let i = 0; i < numEnemies; i++) {
        const enemyType = m.enemies[Math.floor(Math.random() * m.enemies.length)];
        let x, y;
        let attempts = 0;
        
        do {
            x = Math.floor(Math.random() * (m.width - 6)) + 3;
            y = Math.floor(Math.random() * (m.height - 6)) + 3;
            attempts++;
        } while (m.collisionMap[y][x] !== 0 && attempts < 50);
        
        if (m.collisionMap[y][x] === 0) {
            gameState.visibleEnemies.push({
                id: i,
                type: enemyType,
                x: x,
                y: y,
                direction: 'down',
                moveTimer: 0,
                moveInterval: 60 + Math.floor(Math.random() * 120)
            });
        }
    }
}

function updateVisibleEnemies() {
    const m = maps[gameState.currentArea];
    
    gameState.visibleEnemies.forEach(enemy => {
        enemy.moveTimer++;
        
        if (enemy.moveTimer >= enemy.moveInterval) {
            enemy.moveTimer = 0;
            enemy.moveInterval = 60 + Math.floor(Math.random() * 120);
            
            const directions = ['up', 'down', 'left', 'right'];
            const direction = directions[Math.floor(Math.random() * directions.length)];
            
            let newX = enemy.x;
            let newY = enemy.y;
            
            switch (direction) {
                case 'up': newY--; break;
                case 'down': newY++; break;
                case 'left': newX--; break;
                case 'right': newX++; break;
            }
            
            if (newX > 0 && newX < m.width - 1 && newY > 0 && newY < m.height - 1 && m.collisionMap[newY][newX] === 0) {
                enemy.x = newX;
                enemy.y = newY;
                enemy.direction = direction;
            }
        }
    });
}

function checkEnemyCollision() {
    const m = maps[gameState.currentArea];
    const playerTileX = Math.floor(gameState.player.x / m.tileSize);
    const playerTileY = Math.floor(gameState.player.y / m.tileSize);
    
    gameState.visibleEnemies = gameState.visibleEnemies.filter(enemy => {
        const distance = Math.abs(enemy.x - playerTileX) + Math.abs(enemy.y - playerTileY);
        
        if (distance <= 1) {
            startCombat(enemy.type);
            return false;
        }
        return true;
    });
}

// ============ DRAWING FUNCTIONS ============
function drawFloorTile(ctx, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
    ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
    ctx.fillRect(x + 4, y + 4, size - 8, size - 8);
}

function drawWallTile(ctx, x, y, size, color) {
    ctx.fillStyle = color;
    ctx.fillRect(x, y, size, size);
    ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.lineWidth = 1;
    ctx.strokeRect(x, y, size, size);
    ctx.beginPath();
    ctx.moveTo(x, y + size / 2);
    ctx.lineTo(x + size, y + size / 2);
    ctx.stroke();
}

function drawTreeTile(ctx, x, y, size) {
    ctx.fillStyle = '#0a2a0a';
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = '#1a4a1a';
    ctx.beginPath();
    ctx.arc(x + size / 2, y + size / 2, size / 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#0a3a0a';
    ctx.beginPath();
    ctx.arc(x + size / 2, y + size / 2, size / 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#2a5a2a';
    ctx.beginPath();
    ctx.arc(x + size / 2 - 2, y + size / 2 - 2, size / 6, 0, Math.PI * 2);
    ctx.fill();
}

function drawTombstoneTile(ctx, x, y, size) {
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = '#808080';
    ctx.fillRect(x + 4, y + 2, size - 8, size - 4);
    ctx.fillStyle = '#666666';
    ctx.fillRect(x + 6, y + 6, size - 12, size - 12);
    ctx.fillStyle = '#999999';
    ctx.fillRect(x + size / 2 - 1, y + 3, 2, size - 6);
}

function drawBuildingTile(ctx, x, y, size) {
    ctx.fillStyle = '#4a3a2a';
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = '#5a4a3a';
    ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(x + size / 4, y + size / 4, size / 2, size / 2);
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(x + size / 4 + 1, y + size / 4 + 1, size / 2 - 2, size / 2 - 2);
}

function drawCastleWallTile(ctx, x, y, size) {
    ctx.fillStyle = '#3a3a4a';
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = '#4a4a5a';
    ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
    ctx.fillStyle = '#5a5a6a';
    ctx.fillRect(x + 4, y + 4, size - 8, size - 8);
    ctx.strokeStyle = '#2a2a3a';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 2, y + 2, size - 4, size - 4);
}

function drawCastleTile(ctx, x, y, size) {
    ctx.fillStyle = '#2a0a2a';
    ctx.fillRect(x, y, size, size);
    ctx.fillStyle = '#3a1a3a';
    ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
    ctx.fillStyle = '#4a2a4a';
    ctx.fillRect(x + 4, y + 4, size - 8, size - 8);
    ctx.fillStyle = '#FFD700';
    ctx.fillRect(x + size / 4, y + size / 4, 2, 2);
    ctx.fillRect(x + 3 * size / 4, y + size / 4, 2, 2);
    ctx.fillRect(x + size / 4, y + 3 * size / 4, 2, 2);
    ctx.fillRect(x + 3 * size / 4, y + 3 * size / 4, 2, 2);
}

function drawObject(ctx, obj, tileSize) {
    const x = obj.x * tileSize;
    const y = obj.y * tileSize;
    
    switch (obj.type) {
        case 'bed':
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x, y, tileSize * 3, tileSize * 2);
            ctx.fillStyle = '#4169E1';
            ctx.fillRect(x + 2, y + 2, tileSize * 3 - 4, tileSize * 2 - 4);
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(x + 5, y + 5, tileSize * 2, tileSize);
            ctx.fillStyle = '#FF69B4';
            ctx.fillRect(x + 8, y + tileSize, tileSize, tileSize / 2);
            break;
            
        case 'desk':
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(x, y, tileSize * 2, tileSize);
            ctx.fillStyle = '#654321';
            ctx.fillRect(x, y + tileSize, tileSize * 2, tileSize / 2);
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(x + 5, y + 3, 8, 3);
            ctx.fillRect(x + 8, y + 6, 3, 4);
            break;
            
        case 'bookshelf':
            ctx.fillStyle = '#654321';
            ctx.fillRect(x, y, tileSize, tileSize * 3);
            for (let i = 0; i < 3; i++) {
                ctx.fillStyle = ['#FF0000', '#00FF00', '#0000FF'][i];
                ctx.fillRect(x + 2, y + i * tileSize + 2, tileSize - 4, tileSize - 4);
            }
            break;
            
        case 'clothes':
            ctx.fillStyle = '#FF69B4';
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = '#FF1493';
            ctx.fillRect(x + 5, y + 5, tileSize - 10, tileSize - 10);
            break;
            
        case 'boxes':
            ctx.fillStyle = '#8B7355';
            ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
            ctx.strokeStyle = '#654321';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, tileSize * 2, tileSize * 2);
            ctx.fillStyle = '#A0825A';
            ctx.fillRect(x + 5, y + 5, tileSize - 5, tileSize - 5);
            break;
            
        case 'portal':
            const time = Date.now() / 1000;
            const pulse = Math.sin(time * 3) * 0.3 + 0.7;
            ctx.fillStyle = `rgba(255, 0, 255, ${pulse * 0.5})`;
            ctx.fillRect(x - 5, y - 5, tileSize * 2 + 10, tileSize * 2 + 10);
            ctx.fillStyle = `rgba(255, 0, 255, ${pulse})`;
            ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
            ctx.fillStyle = `rgba(0, 255, 255, ${pulse * 0.5})`;
            ctx.fillRect(x + 4, y + 4, tileSize * 2 - 8, tileSize * 2 - 8);
            ctx.fillStyle = `rgba(255, 255, 255, ${pulse * 0.7})`;
            ctx.fillRect(x + 8, y + 8, tileSize * 2 - 16, tileSize * 2 - 16);
            break;
            
        case 'key':
            // GOLDEN KEY WITH STRONG GLOW - HIGHLY VISIBLE
            ctx.fillStyle = 'rgba(255, 215, 0, 0.5)';
            ctx.beginPath();
            ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize / 2 + 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = 'rgba(255, 215, 0, 0.3)';
            ctx.beginPath();
            ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(x + tileSize / 2, y + tileSize / 3, tileSize / 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(x + tileSize / 2, y + tileSize / 3, tileSize / 3, tileSize / 5);
            ctx.fillRect(x + tileSize / 2 + tileSize / 3 - 3, y + tileSize / 3 + tileSize / 5, 3, tileSize / 5);
            ctx.fillStyle = '#FFF8DC';
            ctx.fillRect(x + tileSize / 2 + 2, y + tileSize / 3 + 2, tileSize / 6, 2);
            break;
            
        case 'gate':
            ctx.fillStyle = '#654321';
            ctx.fillRect(x, y, tileSize * 3, tileSize * 2);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 2;
            for (let i = 0; i < 3; i++) {
                ctx.beginPath();
                ctx.moveTo(x + i * tileSize, y);
                ctx.lineTo(x + i * tileSize, y + tileSize * 2);
                ctx.stroke();
            }
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(x + tileSize - 4, y + tileSize / 2, 8, 8);
            break;
            
        case 'note':
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.strokeStyle = '#000000';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, tileSize, tileSize);
            ctx.fillStyle = '#0000FF';
            ctx.fillRect(x + 3, y + 3, tileSize - 6, 3);
            ctx.fillRect(x + 3, y + 8, tileSize - 6, 3);
            break;
            
        case 'mushroom':
            ctx.fillStyle = '#8B008B';
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = '#FF69B4';
            ctx.beginPath();
            ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize / 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(x + tileSize / 4, y + tileSize / 3, 2, 2);
            ctx.fillRect(x + 3 * tileSize / 4, y + tileSize / 3, 2, 2);
            break;
            
        case 'tombstone':
            ctx.fillStyle = '#808080';
            ctx.fillRect(x, y, tileSize, tileSize);
            ctx.fillStyle = '#666666';
            ctx.fillRect(x + 5, y + 5, tileSize - 10, tileSize - 10);
            break;
    }
}

function drawNPC(ctx, npc, tileSize) {
    const x = npc.x * tileSize;
    const y = npc.y * tileSize;
    
    if (npc.sprite === 'ian') {
        ctx.fillStyle = '#8B0000';
        ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
        ctx.fillStyle = '#A00000';
        ctx.fillRect(x + 5, y - 5, tileSize * 2 - 10, 10);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x + 8, y - 10, tileSize * 2 - 16, 8);
        ctx.fillStyle = '#C0C0C0';
        ctx.fillRect(x + 10, y + 25, 5, 15);
        ctx.fillRect(x + 35, y + 25, 5, 15);
        ctx.fillStyle = '#000000';
        ctx.fillRect(x + 15, y + 15, 5, 5);
        ctx.fillRect(x + 30, y + 15, 5, 5);
    } else if (npc.sprite === 'rylee') {
        ctx.fillStyle = '#FF00FF';
        ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
        ctx.fillStyle = '#FF69B4';
        ctx.fillRect(x + 5, y - 5, tileSize * 2 - 10, 10);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x + 5, y - 12, 5, 5);
        ctx.fillRect(x + 15, y - 15, 5, 8);
        ctx.fillRect(x + 25, y - 12, 5, 5);
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(x + 15, y + 15, 5, 5);
        ctx.fillRect(x + 30, y + 15, 5, 5);
        ctx.fillStyle = '#8B0000';
        ctx.fillRect(x + 45, y + 50, 10, 10);
    } else if (npc.sprite === 'bekah') {
        ctx.fillStyle = '#FF69B4';
        ctx.fillRect(x, y, tileSize, tileSize * 0.8);
        ctx.fillStyle = '#FFC0CB';
        ctx.fillRect(x + 3, y - 3, tileSize - 6, tileSize - 6);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x + 3, y - 6, tileSize - 6, 5);
    } else if (npc.sprite === 'ghost') {
        ctx.fillStyle = '#E0E0E0';
        ctx.beginPath();
        ctx.arc(x + tileSize / 2, y + tileSize / 2, tileSize / 2, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillRect(x, y + tileSize / 2, tileSize, tileSize / 2);
    } else if (npc.sprite === 'merchant') {
        ctx.fillStyle = '#2F4F4F';
        ctx.fillRect(x, y, tileSize, tileSize);
        ctx.fillStyle = '#FFD700';
        ctx.fillRect(x + 5, y + 3, 10, 5);
    } else if (npc.sprite === 'healer') {
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y, tileSize, tileSize);
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(x + 5, y + 5, 10, 10);
    } else if (npc.sprite === 'elder') {
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x, y, tileSize, tileSize);
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(x, y, tileSize, tileSize / 3);
    } else {
        ctx.fillStyle = '#FFC0CB';
        ctx.fillRect(x, y, tileSize, tileSize);
        ctx.fillStyle = '#8B4513';
        ctx.fillRect(x, y, tileSize, tileSize / 3);
    }
    
    // Eyes for all NPCs
    ctx.fillStyle = '#000000';
    ctx.fillRect(x + 5, y + 8, 3, 3);
    ctx.fillRect(x + 12, y + 8, 3, 3);
}

function drawPlayer(ctx) {
    const player = gameState.player;
    const tileSize = maps[gameState.currentArea].tileSize;
    const partyLeader = gameState.party[0];
    
    // Shadow
    ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
    ctx.fillRect(player.x + 2, player.y + tileSize + 2, tileSize - 4, 3);
    
    // Body
    ctx.fillStyle = partyLeader.shirtColor;
    ctx.fillRect(player.x, player.y, tileSize, tileSize);
    
    // Head
    ctx.fillStyle = partyLeader.skinTone;
    ctx.fillRect(player.x + 3, player.y - 5, tileSize - 6, tileSize - 6);
    
    // Hair
    ctx.fillStyle = partyLeader.hairColor;
    ctx.fillRect(player.x + 3, player.y - 8, tileSize - 6, 5);
    
    // Eyes
    ctx.fillStyle = '#000000';
    if (player.direction === 'down') {
        ctx.fillRect(player.x + 5, player.y + 3, 3, 3);
        ctx.fillRect(player.x + 12, player.y + 3, 3, 3);
    } else {
        ctx.fillRect(player.x + 5, player.y + 2, 3, 3);
        ctx.fillRect(player.x + 12, player.y + 2, 3, 3);
    }
    
    // Pants
    ctx.fillStyle = partyLeader.pantsColor;
    ctx.fillRect(player.x + 3, player.y + tileSize - 5, 5, 5);
    ctx.fillRect(player.x + 12, player.y + tileSize - 5, 5, 5);
}

function drawVisibleEnemies(ctx) {
    const map = maps[gameState.currentArea];
    const tileSize = map.tileSize;
    
    gameState.visibleEnemies.forEach(enemy => {
        const x = enemy.x * tileSize;
        const y = enemy.y * tileSize;
        const enemyData = enemies[enemy.type];
        
        ctx.fillStyle = enemyData.color;
        ctx.fillRect(x, y, tileSize, tileSize);
        ctx.fillStyle = '#FF0000';
        ctx.fillRect(x + 5, y + 5, 5, 5);
        ctx.fillRect(x + 12, y + 5, 5, 5);
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 1;
        ctx.strokeRect(x, y, tileSize, tileSize);
    });
}

function renderGame() {
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const map = maps[gameState.currentArea];
    
    // Background
    ctx.fillStyle = map.backgroundColor;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    
    // Floor tiles
    for (let y = 0; y < map.height; y++) {
        for (let x = 0; x < map.width; x++) {
            if (map.collisionMap[y][x] === 0) {
                drawFloorTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize, map.floorColor);
            }
        }
    }
    
    // Wall/obstacle tiles
    for (let y = 0; y < map.height; y++) {
        for (let x = 0; x < map.width; x++) {
            if (map.collisionMap[y][x] === 1) {
                if (gameState.currentArea === 'darkForest') {
                    drawTreeTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                } else if (gameState.currentArea === 'graveyard') {
                    drawTombstoneTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                } else if (gameState.currentArea === 'village' || gameState.currentArea === 'upperVillage') {
                    drawBuildingTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                } else if (gameState.currentArea === 'castleWalls') {
                    drawCastleWallTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                } else if (gameState.currentArea === 'castle') {
                    drawCastleTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                } else {
                    drawWallTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize, map.wallColor);
                }
            }
        }
    }
    
    // Objects (including VISIBLE keys)
    map.objects.forEach(obj => {
        if (!obj.hidden) {
            drawObject(ctx, obj, map.tileSize);
        }
    });
    
    // Visible enemies
    drawVisibleEnemies(ctx);
    
    // NPCs
    map.npcs.forEach(npc => {
        drawNPC(ctx, npc, map.tileSize);
    });
    
    // Player
    drawPlayer(ctx);
}

// ============ GAME LOOP ============
function gameLoop() {
    if (!gameState.paused && !gameState.inDialogue && !gameState.combat.active) {
        updatePlayer();
        updateVisibleEnemies();
        checkEnemyCollision();
        checkInteractions();
        renderGame();
    }
    requestAnimationFrame(gameLoop);
}

function updatePlayer() {
    const map = maps[gameState.currentArea];
    const player = gameState.player;
    
    let dx = 0;
    let dy = 0;
    
    if (gameState.keys.up) { dy = -player.speed; player.direction = 'up'; }
    if (gameState.keys.down) { dy = player.speed; player.direction = 'down'; }
    if (gameState.keys.left) { dx = -player.speed; player.direction = 'left'; }
    if (gameState.keys.right) { dx = player.speed; player.direction = 'right'; }
    
    player.moving = dx !== 0 || dy !== 0;
    
    if (dx !== 0 && canMove(player.x + dx, player.y, map)) player.x += dx;
    if (dy !== 0 && canMove(player.x, player.y + dy, map)) player.y += dy;
    
    checkAreaTransition();
}

function canMove(x, y, map) {
    const tileX = Math.floor(x / map.tileSize);
    const tileY = Math.floor(y / map.tileSize);
    
    if (tileX < 0 || tileX >= map.width || tileY < 0 || tileY >= map.height) return false;
    
    return map.collisionMap[tileY][tileX] === 0;
}

function checkAreaTransition() {
    const map = maps[gameState.currentArea];
    const player = gameState.player;
    
    map.exits.forEach(exit => {
        const exitTileX = exit.x * map.tileSize;
        const exitTileY = exit.y * map.tileSize;
        
        if (Math.abs(player.x - exitTileX) < map.tileSize / 2 &&
            Math.abs(player.y - exitTileY) < map.tileSize / 2) {
            
            // Check gate requirements
            if (exit.targetArea === 'graveyard' && !gameState.flags.openedForestGate) {
                if (!hasItem('forestKey')) {
                    showDialogue('The gate is locked. You need the Forest Key...');
                    gameState.inDialogue = true;
                    return;
                } else {
                    gameState.flags.openedForestGate = true;
                }
            }
            
            if (exit.targetArea === 'village' && !gameState.flags.openedVillageGate) {
                if (!hasItem('graveyardKey')) {
                    showDialogue('Locked. Need Graveyard Key...');
                    gameState.inDialogue = true;
                    return;
                } else {
                    gameState.flags.openedVillageGate = true;
                }
            }
            
            if (exit.targetArea === 'upperVillage' && !gameState.flags.openedUpperVillageGate) {
                if (!hasItem('villageKey')) {
                    showDialogue('Locked. Need Village Key...');
                    gameState.inDialogue = true;
                    return;
                } else {
                    gameState.flags.openedUpperVillageGate = true;
                }
            }
            
            if (exit.targetArea === 'castleWalls' && !gameState.flags.openedCastleWallsGate) {
                if (!hasItem('castleKey')) {
                    showDialogue('Locked. Need Castle Key...');
                    gameState.inDialogue = true;
                    return;
                } else {
                    gameState.flags.openedCastleWallsGate = true;
                }
            }
            
            if (exit.targetArea === 'castle' && !gameState.flags.defeatedIan) {
                showDialogue('IAN blocks the gate!');
                gameState.inDialogue = true;
                return;
            }
            
            // Transition
            if (exit.transitionText) {
                gameState.inDialogue = true;
                gameState.dialogueQueue = [exit.transitionText, null];
                showDialogue(gameState.dialogueQueue.shift());
                gameState.pendingExit = exit;
            } else {
                transitionArea(exit.targetArea, exit.targetX, exit.targetY);
            }
        }
    });
}

function transitionArea(areaId, targetX, targetY) {
    gameState.currentArea = areaId;
    gameState.player.x = targetX * maps[areaId].tileSize;
    gameState.player.y = targetY * maps[areaId].tileSize;
    spawnEnemies();
    updateHUD();
}

function checkInteractions() {
    const map = maps[gameState.currentArea];
    const player = gameState.player;
    const interactRange = 40;
    
    let nearInteraction = false;
    
    map.npcs.forEach(npc => {
        const npcX = npc.x * map.tileSize;
        const npcY = npc.y * map.tileSize;
        
        if (Math.abs(player.x - npcX) < interactRange &&
            Math.abs(player.y - npcY) < interactRange) {
            nearInteraction = true;
            if (gameState.keys.interact) interactWithNPC(npc);
        }
    });
    
    map.objects.forEach(obj => {
        if (obj.hidden) return;
        
        const objX = obj.x * map.tileSize;
        const objY = obj.y * map.tileSize;
        
        if (Math.abs(player.x - objX) < interactRange &&
            Math.abs(player.y - objY) < interactRange) {
            nearInteraction = true;
            if (gameState.keys.interact) interactWithObject(obj);
        }
    });
    
    const prompt = document.getElementById('interactionPrompt');
    if (nearInteraction && !gameState.inDialogue) {
        prompt.classList.add('active');
    } else {
        prompt.classList.remove('active');
    }
}

function interactWithNPC(npc) {
    gameState.keys.interact = false;
    soundSystem.playSound('interact');
    
    if (npc.interactionType === 'izzy') {
        showDialogue(npc.dialogue[0]);
    } else if (npc.interactionType === 'izzyRescue') {
        if (gameState.flags.defeatedRylee) {
            gameState.flags.rescuedIzzy = true;
            gameState.dialogueQueue = ['IZZY: You saved me!', 'Thank you for playing!'];
            showDialogue(gameState.dialogueQueue.shift());
        } else {
            showDialogue('IZZY: Help!');
        }
    } else if (npc.interactionType === 'bekah') {
        if (!gameState.flags.metBekah) {
            gameState.flags.metBekah = true;
            gameState.party.push({ ...bekahStats });
            showDialogue('BEKAH joins your party!');
        } else {
            showDialogue('BEKAH: Let\'s go!');
        }
    } else if (npc.interactionType === 'ghost') {
        showDialogue(npc.dialogue[0]);
    } else if (npc.interactionType === 'merchant') {
        openShop('shadyMerchant');
    } else if (npc.interactionType === 'upperMerchant') {
        openShop('upperMerchant');
    } else if (npc.interactionType === 'healer') {
        openShop('villageHealer');
    } else if (npc.interactionType === 'elder') {
        showDialogue(npc.dialogue ? npc.dialogue[0] : '...');
    } else if (npc.interactionType === 'ianBoss') {
        if (!gameState.flags.defeatedIan) {
            gameState.dialogueQueue = npc.dialogue;
            gameState.dialogueQueue.push(null);
            gameState.pendingBoss = 'ian';
            showDialogue(gameState.dialogueQueue.shift());
        } else {
            showDialogue('IAN: You defeated me...');
        }
    } else if (npc.interactionType === 'ryleeBoss') {
        if (!gameState.flags.defeatedRylee) {
            gameState.dialogueQueue = npc.dialogue;
            gameState.dialogueQueue.push(null);
            gameState.pendingBoss = 'rylee';
            showDialogue(gameState.dialogueQueue.shift());
        } else {
            showDialogue('RYLEE: How...');
        }
    }
}

function interactWithObject(obj) {
    gameState.keys.interact = false;
    soundSystem.playSound('interact');
    
    // Portals
    if (obj.interactionType === 'portal') {
        gameState.pendingExit = { targetArea: 'darkForest', targetX: 25, targetY: 38 };
        showDialogue('You step through the portal...');
    } else if (obj.interactionType === 'returnPortal') {
        gameState.pendingExit = { targetArea: 'closet', targetX: 14, targetY: 14 };
        showDialogue('Back to closet...');
    } else if (obj.interactionType === 'returnToForest') {
        gameState.pendingExit = { targetArea: 'darkForest', targetX: 25, targetY: 3 };
        showDialogue('Back to forest...');
    } else if (obj.interactionType === 'returnToUpperVillage') {
        gameState.pendingExit = { targetArea: 'upperVillage', targetX: 20, targetY: 2 };
        showDialogue('Back to Upper Village...');
    } else if (obj.interactionType === 'returnToCastleWalls') {
        gameState.pendingExit = { targetArea: 'castleWalls', targetX: 25, targetY: 3 };
        showDialogue('Back to Castle Walls...');
    }
    // Ancient Tree
    else if (obj.interactionType === 'ancientTree') {
        gameState.dialogueQueue = [
            'You examine the ancient tree...',
            'There is a huge knot in the trunk...',
            'You push the knot...',
            'A golden key is on the ground near the glowing mushrooms to the EAST!',
            'Walk to the mushrooms and look around!'
        ];
        showDialogue(gameState.dialogueQueue.shift());
    }
    // Key Collection
    else if (obj.interactionType === 'forestKey') {
        if (!hasItem('forestKey')) {
            addItem('forestKey');
            gameState.flags.foundForestKey = true;
            gameState.dialogueQueue = [
                'You found the Forest Key!',
                'Now walk to the TOP of the forest to open the gate!'
            ];
            showDialogue(gameState.dialogueQueue.shift());
        } else {
            showDialogue('Already have Forest Key.');
        }
    } else if (obj.interactionType === 'graveyardKey') {
        if (!hasItem('graveyardKey')) {
            addItem('graveyardKey');
            gameState.flags.foundGraveyardKey = true;
            showDialogue('You found the Graveyard Key! Walk to the top!');
        } else {
            showDialogue('Already have Graveyard Key.');
        }
    } else if (obj.interactionType === 'villageKey') {
        if (!hasItem('villageKey')) {
            addItem('villageKey');
            gameState.flags.foundVillageKey = true;
            showDialogue('You found the Village Key! Walk to the top!');
        } else {
            showDialogue('Already have Village Key.');
        }
    } else if (obj.interactionType === 'castleKey') {
        if (!hasItem('castleKey')) {
            addItem('castleKey');
            gameState.flags.foundCastleKey = true;
            showDialogue('You found the Castle Key! Walk to the top!');
        } else {
            showDialogue('Already have Castle Key.');
        }
    }
    // Gate interactions
    else if (obj.interactionType === 'gate') {
        if (hasItem('forestKey')) {
            gameState.flags.openedForestGate = true;
            showDialogue('You use the Forest Key... The gate opens! Walk through!');
        } else {
            showDialogue('The gate is locked. You need the Forest Key.');
        }
    }
    // Item drops
    else if (obj.itemDrop) {
        if (!hasItem(obj.itemDrop)) {
            addItem(obj.itemDrop);
            showDialogue('Found: ' + items[obj.itemDrop].name + '!');
        } else {
            showDialogue(obj.description || obj.name);
        }
    }
    // Other
    else if (obj.interactionType === 'throne') {
        showDialogue('The Desk of Power...');
    } else if (obj.interactionType === 'note') {
        showDialogue(obj.description);
    } else if (obj.interactionType === 'merchant') {
        openShop('shadyMerchant');
    } else if (obj.interactionType === 'upperMerchant') {
        openShop('upperMerchant');
    } else if (obj.interactionType === 'healer') {
        openShop('villageHealer');
    } else {
        showDialogue(obj.description || obj.name);
    }
}
    // ============ COMBAT SYSTEM ============
function startCombat(type) {
    gameState.combat.active = true;
    gameState.combat.turn = 'player';
    gameState.combat.playerDefending = false;
    
    if (type === 'ian') {
        gameState.combat.enemy = { ...ianBoss };
    } else if (type === 'rylee') {
        gameState.combat.enemy = { ...ryleeBoss };
    } else {
        gameState.combat.enemy = { ...enemies[type] };
    }
    
    gameState.combat.activePartyMember = 0;
    
    document.getElementById('combatScreen').classList.add('active');
    document.getElementById('combatMenu').style.display = 'flex';
    document.getElementById('psiMenu').classList.remove('active');
    document.getElementById('itemMenu').classList.remove('active');
    
    drawCombatEnemy();
    updateCombatPartyDisplay();
    soundSystem.playSound('combat');
    showCombatMessage(gameState.combat.enemy.name + ' attacks!');
}

function updateCombatPartyDisplay() {
    const partyArea = document.getElementById('combatPartyArea');
    partyArea.innerHTML = '';
    
    gameState.party.forEach((member, index) => {
        if (member.hp <= 0) return;
        
        const memberElement = document.createElement('div');
        memberElement.className = 'combat-party-member';
        if (index === gameState.combat.activePartyMember) memberElement.classList.add('active');
        
        memberElement.innerHTML = `
            <div style="width:50px;height:50px;background:${member.shirtColor};border-radius:5px;"></div>
            <div class="combat-stats">
                <div>${member.name}</div>
                <div>HP: ${member.hp}/${member.maxHp}</div>
                <div>PP: ${member.pp}/${member.maxPp}</div>
            </div>
        `;
        
        memberElement.onclick = () => {
            gameState.combat.activePartyMember = index;
            updateCombatPartyDisplay();
        };
        
        partyArea.appendChild(memberElement);
    });
}

function drawCombatEnemy() {
    const canvas = document.getElementById('combatEnemyCanvas');
    const ctx = canvas.getContext('2d');
    const enemy = gameState.combat.enemy;
    
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = enemy.color;
    ctx.fillRect(20, 20, 60, 60);
    ctx.fillStyle = '#FF0000';
    ctx.fillRect(40, 40, 10, 10);
    ctx.fillRect(55, 40, 10, 10);
}

function showCombatMessage(message) {
    const messageDiv = document.getElementById('combatMessage');
    document.getElementById('combatMessageText').textContent = message;
    messageDiv.classList.add('active');
    setTimeout(() => messageDiv.classList.remove('active'), 1500);
}

function showPSIMenu() {
    document.getElementById('combatMenu').style.display = 'none';
    document.getElementById('psiMenu').classList.add('active');
}

function hidePSIMenu() {
    document.getElementById('combatMenu').style.display = 'flex';
    document.getElementById('psiMenu').classList.remove('active');
}

function playerAttack() {
    if (gameState.combat.turn !== 'player') return;
    
    const member = gameState.party[gameState.combat.activePartyMember];
    const enemy = gameState.combat.enemy;
    
    let damage = Math.max(1, member.attack - enemy.defense + Math.floor(Math.random() * 3));
    
    if (gameState.combat.playerDefending) {
        damage = Math.floor(damage * 0.5);
        gameState.combat.playerDefending = false;
    }
    
    enemy.hp -= damage;
    showCombatMessage(`${member.name} attacks! ${damage} damage!`);
    
    if (enemy.hp <= 0) {
        endCombat(true);
    } else {
        gameState.combat.turn = 'enemy';
        setTimeout(enemyTurn, 1500);
    }
}

function useCoffeeBreak() {
    if (gameState.combat.turn !== 'player') return;
    
    const member = gameState.party[gameState.combat.activePartyMember];
    const enemy = gameState.combat.enemy;
    
    if (member.pp < 5) {
        showCombatMessage('Not enough PP!');
        return;
    }
    
    member.pp -= 5;
    let damage = Math.floor(10 + member.attack * 1.5);
    enemy.hp -= damage;
    
    updateCombatPartyDisplay();
    hidePSIMenu();
    showCombatMessage(`${member.name} uses Coffee Break! ${damage} damage!`);
    
    if (enemy.hp <= 0) {
        endCombat(true);
    } else {
        gameState.combat.turn = 'enemy';
        setTimeout(enemyTurn, 1500);
    }
}

function useAllNighter() {
    if (gameState.combat.turn !== 'player') return;
    
    const member = gameState.party[gameState.combat.activePartyMember];
    const enemy = gameState.combat.enemy;
    
    if (member.pp < 8) {
        showCombatMessage('Not enough PP!');
        return;
    }
    
    member.pp -= 8;
    let damage = Math.floor(15 + member.attack * 2);
    enemy.hp -= damage;
    
    updateCombatPartyDisplay();
    hidePSIMenu();
    showCombatMessage(`${member.name} pulls an All-Nighter! ${damage} damage!`);
    
    if (enemy.hp <= 0) {
        endCombat(true);
    } else {
        gameState.combat.turn = 'enemy';
        setTimeout(enemyTurn, 1500);
    }
}

function useRamenHeal() {
    if (gameState.combat.turn !== 'player') return;
    
    const member = gameState.party[gameState.combat.activePartyMember];
    
    if (member.pp < 5) {
        showCombatMessage('Not enough PP!');
        return;
    }
    
    member.pp -= 5;
    member.hp = Math.min(member.maxHp, member.hp + 30);
    
    updateCombatPartyDisplay();
    hidePSIMenu();
    showCombatMessage(`${member.name} heals 30 HP!`);
    
    gameState.combat.turn = 'enemy';
    setTimeout(enemyTurn, 1500);
}

function playerDefend() {
    if (gameState.combat.turn !== 'player') return;
    
    gameState.combat.playerDefending = true;
    showCombatMessage('Defending!');
    
    gameState.combat.turn = 'enemy';
    setTimeout(enemyTurn, 1000);
}

function playerRun() {
    if (gameState.combat.turn !== 'player') return;
    
    if (gameState.combat.enemy.isBoss) {
        showCombatMessage('Cannot escape from a boss!');
        return;
    }
    
    if (Math.random() < 0.7) {
        endCombat(false);
        showCombatMessage('Escaped!');
    } else {
        showCombatMessage('Failed to escape!');
        gameState.combat.turn = 'enemy';
        setTimeout(enemyTurn, 1000);
    }
}

function enemyTurn() {
    const enemy = gameState.combat.enemy;
    const alive = gameState.party.filter(m => m.hp > 0);
    
    if (alive.length === 0) {
        endCombat(false);
        return;
    }
    
    const target = alive[Math.floor(Math.random() * alive.length)];
    const attack = enemy.attacks[Math.floor(Math.random() * enemy.attacks.length)];
    
    let damage = Math.max(1, Math.floor(enemy.attack * attack.power - target.defense));
    
    if (gameState.combat.playerDefending) {
        damage = Math.floor(damage * 0.5);
        gameState.combat.playerDefending = false;
    }
    
    target.hp -= damage;
    updateCombatPartyDisplay();
    updateHUD();
    soundSystem.playSound('damage');
    showCombatMessage(`${enemy.name} uses ${attack.name}! ${damage} damage!`);
    
    if (gameState.party.every(m => m.hp <= 0)) {
        endCombat(false);
        setTimeout(() => {
            gameState.party.forEach(m => {
                m.hp = m.maxHp;
                m.pp = m.maxPp;
            });
            gameState.currentArea = 'room303';
            gameState.player.x = 400;
            gameState.player.y = 300;
            spawnEnemies();
            updateHUD();
        }, 3000);
    } else {
        gameState.combat.turn = 'player';
    }
}

function endCombat(victory) {
    gameState.combat.active = false;
    document.getElementById('combatScreen').classList.remove('active');
    
    if (victory) {
        const enemy = gameState.combat.enemy;
        
        gameState.party.forEach(member => {
            if (member.hp > 0) {
                member.exp += enemy.exp;
                member.money = (member.money || 0) + enemy.money;
                
                if (member.exp >= member.level * 10) {
                    member.level++;
                    member.exp = 0;
                    member.maxHp += 5;
                    member.hp = member.maxHp;
                    member.maxPp += 3;
                    member.pp = member.maxPp;
                    member.attack += 2;
                    member.defense += 1;
                    soundSystem.playSound('levelup');
                    showCombatMessage(member.name + ' leveled up!');
                }
            }
        });
        
        if (enemy.isBoss && enemy.name.includes('IAN')) {
            gameState.flags.defeatedIan = true;
            showCombatMessage('IAN defeated! Castle gate is open!');
        }
        
        if (enemy.isBoss && enemy.name.includes('RYLEE')) {
            gameState.flags.defeatedRylee = true;
            showCombatMessage('RYLEE defeated! Izzy is free!');
        }
        
        soundSystem.playSound('victory');
        updateHUD();
    }
}

function updateInventoryDisplay() {
    const listElement = document.getElementById('inventoryList');
    document.getElementById('inventoryMoney').textContent = gameState.party[0].money || 0;
    listElement.innerHTML = '';
    
    let displayItems = [];
    
    if (gameState.inventoryTab === 'items') {
        displayItems = gameState.inventory.filter(i => items[i.id].type === 'item');
    } else if (gameState.inventoryTab === 'weapons') {
        displayItems = gameState.inventory.filter(i => items[i.id].type === 'weapon');
    } else {
        displayItems = gameState.inventory.filter(i => items[i.id].type === 'keyItem');
    }
    
    if (displayItems.length === 0) {
        listElement.innerHTML = '<div style="text-align:center;color:#666;">NO ITEMS</div>';
        return;
    }
    
    displayItems.forEach(item => {
        const itemData = items[item.id];
        const element = document.createElement('div');
        element.className = 'inventory-item';
        element.innerHTML = `
            <div>
                <div class="item-name">${itemData.name}</div>
                <div class="item-description">${itemData.description}</div>
            </div>
            <div class="item-quantity">x${item.quantity}</div>
        `;
        element.onclick = () => {
            if (itemData.type === 'item' && itemData.usable) {
                useItem(item.id, 0);
                updateInventoryDisplay();
                soundSystem.playSound('interact');
            } else if (itemData.type === 'weapon') {
                equipWeapon(item.id);
                updateInventoryDisplay();
            }
        };
        listElement.appendChild(element);
    });
}

function useItem(itemId, targetIndex) {
    const itemData = items[itemId];
    const target = gameState.party[targetIndex !== null ? targetIndex : gameState.combat.activePartyMember];
    
    if (itemData.healAmount) {
        target.hp = Math.min(target.maxHp, target.hp + itemData.healAmount);
        removeItem(itemId);
        updateHUD();
        return true;
    }
    
    if (itemData.ppRestore) {
        target.pp = Math.min(target.maxPp, target.pp + itemData.ppRestore);
        removeItem(itemId);
        updateHUD();
        return true;
    }
    
    return false;
}

function equipWeapon(itemId) {
    const itemData = items[itemId];
    gameState.equippedWeapon = itemId;
    gameState.party[0].attack = 5 + itemData.attackBonus;
    updateHUD();
}

function addItem(itemId, quantity = 1) {
    const existing = gameState.inventory.find(i => i.id === itemId);
    if (existing) {
        existing.quantity += quantity;
    } else {
        gameState.inventory.push({ id: itemId, quantity: quantity });
    }
}

function removeItem(itemId, quantity = 1) {
    const index = gameState.inventory.findIndex(i => i.id === itemId);
    if (index !== -1) {
        gameState.inventory[index].quantity -= quantity;
        if (gameState.inventory[index].quantity <= 0) {
            gameState.inventory.splice(index, 1);
        }
    }
}

function hasItem(itemId) {
    return gameState.inventory.some(i => i.id === itemId);
}

        const parsed = JSON.parse(saveData);
        gameState = { ...gameState, ...parsed };
        gameState.player = parsed.player || gameState.player;
        gameState.flags = parsed.flags || gameState.flags;
        gameState.party = parsed.party || gameState.party;
        gameState.inventory = parsed.inventory || gameState.inventory;
        spawnEnemies();
        updateHUD();
        showCombatMessage('Game loaded!');
    } else {
        showCombatMessage('No save file found!');
    }
    document.getElementById('gameMenu').classList.remove('active');
}

    const characterData = localStorage.getItem('johnNeumaierCharacter');
    if (!characterData) {
        window.location.href = 'index.html';
        return;
    }
    
    const charData = JSON.parse(characterData);
    gameState.party[0].name = charData.name || 'PLAYER';
    gameState.party[0].shirtColor = charData.shirtColor || '#ff0000';
    gameState.party[0].skinTone = charData.skinTone || '#f0c8a0';
    gameState.party[0].hairColor = charData.hairColor || '#4a3728';
    gameState.party[0].pantsColor = charData.pantsColor || '#0000ff';
    
    const saveData = localStorage.getItem('johnNeumaierSave');
    if (saveData) {
        const parsed = JSON.parse(saveData);
        gameState = { ...gameState, ...parsed };
        gameState.player = parsed.player || gameState.player;
        gameState.flags = parsed.flags || gameState.flags;
        gameState.party = parsed.party || gameState.party;
        gameState.inventory = parsed.inventory || gameState.inventory;
    } else {
        addItem('ramen', 2);
        addItem('coffee', 1);
        gameState.party[0].money = 50;
    }
    
    initMaps();
    spawnEnemies();
    updateHUD();
    gameLoop();
    
    setTimeout(() => {
        document.getElementById('loadingScreen').style.display = 'none';
        showDialogue(`${gameState.party[0].name}, you hear a crash from the closet...`);
    }, 2000);
}

// ============ EVENT LISTENERS ============
document.addEventListener('keydown', (e) => {
    switch (e.key.toLowerCase()) {
        case 'arrowup':
        case 'w':
            gameState.keys.up = true;
            e.preventDefault();
            break;
        case 'arrowdown':
        case 's':
            gameState.keys.down = true;
            e.preventDefault();
            break;
        case 'arrowleft':
        case 'a':
            gameState.keys.left = true;
            e.preventDefault();
            break;
        case 'arrowright':
        case 'd':
            gameState.keys.right = true;
            e.preventDefault();
            break;
    }
    
    if (e.key.toLowerCase() === 'e') {
        gameState.keys.interact = true;
    }
    
    if (e.key === ' ' && gameState.inDialogue) {
        e.preventDefault();
        if (gameState.dialogueQueue.length > 0) {
            showDialogue(gameState.dialogueQueue.shift());
        } else {
            closeDialogue();
        }
    }
    
    if (e.key === 'Escape' && !gameState.inDialogue && !gameState.combat.active) {
        if (document.getElementById('inventoryScreen').classList.contains('active')) {
            closeInventory();
        } else if (document.getElementById('shopScreen').classList.contains('active')) {
            closeShop();
        } else if (document.getElementById('phoneScreen').classList.contains('active')) {
            closePhone();
        } else {
            toggleMenu();
        }
    }
});

document.addEventListener('keyup', (e) => {
    switch (e.key.toLowerCase()) {
        case 'arrowup':
        case 'w':
            gameState.keys.up = false;
            break;
        case 'arrowdown':
        case 's':
            gameState.keys.down = false;
            break;
        case 'arrowleft':
        case 'a':
            gameState.keys.left = false;
            break;
        case 'arrowright':
        case 'd':
            gameState.keys.right = false;
            break;
        case 'e':
            gameState.keys.interact = false;
            break;
    }
});

// ============ START GAME ============
initGame();
</script>
</body>
</html>
