<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Neumaier Hall - The Adventure Begins</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #1a0a2e;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.5);
        }
        
        .game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #00ffff;
            padding: 20px;
            color: #fff;
            font-size: 12px;
            line-height: 1.6;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .dialogue-box.active {
            display: block;
            animation: dialogue-appear 0.5s ease-out;
        }
        
        @keyframes dialogue-appear {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ff00ff;
            padding: 30px;
            color: #fff;
            text-align: center;
            display: none;
            z-index: 200;
            min-width: 300px;
        }
        
        .menu.active {
            display: block;
        }
        
        .menu h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .menu button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .menu button:hover {
            background: #ff00ff;
            border-color: #fff;
            transform: scale(1.05);
        }
        
        /* Inventory UI */
        .inventory-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ff00ff;
            padding: 30px;
            color: #fff;
            display: none;
            z-index: 250;
            width: 600px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .inventory-screen.active {
            display: block;
        }
        
        .inventory-screen h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: center;
        }
        
        .inventory-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .inventory-tab {
            padding: 8px 15px;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }
        
        .inventory-tab.active {
            background: #ff00ff;
        }
        
        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }
        
        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00ffff;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s;
        }
        
        .inventory-item:hover {
            background: rgba(255, 0, 255, 0.3);
            transform: scale(1.02);
        }
        
        .inventory-item.selected {
            background: #ff00ff;
            border-color: #fff;
        }
        
        .item-name {
            flex: 1;
        }
        
        .item-quantity {
            color: #00ffff;
            margin-left: 10px;
        }
        
        .item-description {
            font-size: 10px;
            color: #cccccc;
            margin-top: 5px;
            line-height: 1.4;
        }
        
        .inventory-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .inventory-actions button {
            padding: 10px 20px;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }
        
        .inventory-actions button:hover {
            background: #ff00ff;
        }
        
        .money-display {
            text-align: center;
            margin-bottom: 15px;
            color: #FFD700;
            font-size: 14px;
        }
        
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 10px;
            z-index: 50;
            pointer-events: none;
        }
        
        .hud-left, .hud-right {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 2px solid #00ffff;
        }
        
        .hud-left {
            text-align: left;
        }
        
        .hud-right {
            text-align: right;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        
        .loading-text {
            color: #ff00ff;
            font-size: 24px;
            animation: loading-pulse 1s infinite;
            text-align: center;
            line-height: 2;
        }
        
        @keyframes loading-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .interaction-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 10px 20px;
            font-size: 10px;
            display: none;
            z-index: 75;
        }
        
        .interaction-prompt.active {
            display: block;
        }
        
        /* Combat UI */
        .combat-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
            display: none;
            z-index: 300;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .combat-screen.active {
            display: flex;
        }
        
        .combat-enemy-area {
            width: 80%;
            height: 35%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }
        
        .combat-enemy {
            width: 100px;
            height: 100px;
            animation: enemy-float 2s ease-in-out infinite;
        }
        
        @keyframes enemy-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .combat-party-area {
            width: 80%;
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 10px;
            gap: 20px;
        }
        
        .combat-party-member {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffff;
            border-radius: 5px;
        }
        
        .combat-party-member.active {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        
        .combat-player {
            width: 50px;
            height: 50px;
        }
        
        .combat-stats {
            color: #fff;
            font-size: 9px;
            line-height: 1.6;
        }
        
        .combat-menu {
            width: 80%;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ffff;
            padding: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .combat-button {
            padding: 12px 18px;
            background: #2d1b4e;
            border: 2px solid #ff00ff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .combat-button:hover {
            background: #ff00ff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }
        
        .combat-message {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #00ffff;
            display: none;
            z-index: 350;
            min-width: 300px;
        }
        
        .combat-message.active {
            display: block;
        }
        
        .combat-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            animation: psychedelic-shift 5s linear infinite;
        }
        
        @keyframes psychedelic-shift {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .psi-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        
        .psi-menu.active {
            display: flex;
        }
        
        .item-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .item-menu.active {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-screen" id="gameScreen">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div class="hud">
                <div class="hud-left">
                    <div id="hudName">PLAYER</div>
                    <div>LV: <span id="hudLevel">1</span></div>
                    <div>HP: <span id="hudHP">30/30</span></div>
                    <div>PP: <span id="hudPP">10/10</span></div>
                </div>
                <div class="hud-right">
                    <div>EXP: <span id="hudEXP">0</span></div>
                    <div>MONEY: $<span id="hudMoney">0</span></div>
                    <div>LOCATION: <span id="hudLocation">Room 303</span></div>
                </div>
            </div>
            
            <div class="interaction-prompt" id="interactionPrompt">
                [E] TO INTERACT
            </div>
            
            <div class="dialogue-box" id="dialogueBox">
                <p id="dialogueText"></p>
                <p style="text-align: center; margin-top: 10px; color: #00ffff; font-size: 10px;">
                    [PRESS SPACE TO CONTINUE]
                </p>
            </div>
            
            <div class="menu" id="gameMenu">
                <h2>MENU</h2>
                <button onclick="toggleMenu()">RESUME</button>
                <button onclick="showInventory()">INVENTORY</button>
                <button onclick="showStatus()">STATUS</button>
                <button onclick="saveGame()">SAVE</button>
                <button onclick="returnToTitle()">TITLE SCREEN</button>
            </div>
            
            <!-- Inventory Screen -->
            <div class="inventory-screen" id="inventoryScreen">
                <h2>INVENTORY</h2>
                <div class="money-display">MONEY: $<span id="inventoryMoney">0</span></div>
                <div class="inventory-tabs">
                    <button class="inventory-tab active" onclick="switchInventoryTab('items', this)">ITEMS</button>
                    <button class="inventory-tab" onclick="switchInventoryTab('weapons', this)">WEAPONS</button>
                    <button class="inventory-tab" onclick="switchInventoryTab('keyItems', this)">KEY ITEMS</button>
                </div>
                <div class="inventory-list" id="inventoryList">
                </div>
                <div class="inventory-actions">
                    <button onclick="closeInventory()">CLOSE</button>
                </div>
            </div>
            
            <!-- Combat Screen -->
            <div class="combat-screen" id="combatScreen">
                <div class="combat-background"></div>
                <div class="combat-enemy-area" id="combatEnemyArea">
                    <canvas id="combatEnemyCanvas" class="combat-enemy" width="100" height="100"></canvas>
                </div>
                <div class="combat-party-area" id="combatPartyArea">
                    <!-- Party members will be displayed here -->
                </div>
                <div class="combat-menu" id="combatMenu">
                    <button class="combat-button" onclick="playerAttack()">FIGHT</button>
                    <button class="combat-button" onclick="showPSIMenu()">PSYCH</button>
                    <button class="combat-button" onclick="showItemMenu()">ITEM</button>
                    <button class="combat-button" onclick="playerDefend()">GUARD</button>
                    <button class="combat-button" onclick="playerRun()">RUN</button>
                </div>
                <div class="psi-menu" id="psiMenu">
                    <button class="combat-button" onclick="useCoffeeBreak()">COFFEE BREAK (5 PP)</button>
                    <button class="combat-button" onclick="useAllNighter()">ALL-NIGHTER (8 PP)</button>
                    <button class="combat-button" onclick="useRamenHeal()">RAMEN BREAK (5 PP)</button>
                    <button class="combat-button" onclick="hidePSIMenu()">BACK</button>
                </div>
                <div class="item-menu" id="itemMenu">
                </div>
            </div>
            
            <!-- Combat Message -->
            <div class="combat-message" id="combatMessage">
                <p id="combatMessageText"></p>
            </div>
            
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-text">LOADING...</div>
            </div>
        </div>
    </div>
