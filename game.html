<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Neumaier Hall - The Adventure Begins</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #1a0a2e;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.5);
        }
        
        .game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #00ffff;
            padding: 20px;
            color: #fff;
            font-size: 12px;
            line-height: 1.6;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .dialogue-box.active {
            display: block;
            animation: dialogue-appear 0.5s ease-out;
        }
        
        @keyframes dialogue-appear {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ff00ff;
            padding: 30px;
            color: #fff;
            text-align: center;
            display: none;
            z-index: 200;
            min-width: 300px;
        }
        
        .menu.active {
            display: block;
        }
        
        .menu h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .menu button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .menu button:hover {
            background: #ff00ff;
            border-color: #fff;
            transform: scale(1.05);
        }
        
        .inventory-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ff00ff;
            padding: 30px;
            color: #fff;
            display: none;
            z-index: 250;
            width: 600px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .inventory-screen.active {
            display: block;
        }
        
        .inventory-screen h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: center;
        }
        
        .inventory-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .inventory-tab {
            padding: 8px 15px;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }
        
        .inventory-tab.active {
            background: #ff00ff;
        }
        
        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }
        
        .inventory-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00ffff;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s;
        }
        
        .inventory-item:hover {
            background: rgba(255, 0, 255, 0.3);
            transform: scale(1.02);
        }
        
        .inventory-item.selected {
            background: #ff00ff;
            border-color: #fff;
        }
        
        .item-name {
            flex: 1;
        }
        
        .item-quantity {
            color: #00ffff;
            margin-left: 10px;
        }
        
        .item-description {
            font-size: 10px;
            color: #cccccc;
            margin-top: 5px;
            line-height: 1.4;
        }
        
        .inventory-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .inventory-actions button {
            padding: 10px 20px;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }
        
        .inventory-actions button:hover {
            background: #ff00ff;
        }
        
        .money-display {
            text-align: center;
            margin-bottom: 15px;
            color: #FFD700;
            font-size: 14px;
        }
        
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 10px;
            z-index: 50;
            pointer-events: none;
        }
        
        .hud-left, .hud-right {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 2px solid #00ffff;
        }
        
        .hud-left {
            text-align: left;
        }
        
        .hud-right {
            text-align: right;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        
        .loading-text {
            color: #ff00ff;
            font-size: 24px;
            animation: loading-pulse 1s infinite;
            text-align: center;
            line-height: 2;
        }
        
        @keyframes loading-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .interaction-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 10px 20px;
            font-size: 10px;
            display: none;
            z-index: 75;
        }
        
        .interaction-prompt.active {
            display: block;
        }
        
        .combat-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
            display: none;
            z-index: 300;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .combat-screen.active {
            display: flex;
        }
        
        .combat-enemy-area {
            width: 80%;
            height: 35%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }
        
        .combat-enemy {
            width: 100px;
            height: 100px;
            animation: enemy-float 2s ease-in-out infinite;
        }
        
        @keyframes enemy-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .combat-party-area {
            width: 80%;
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 10px;
            gap: 20px;
        }
        
        .combat-party-member {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .combat-party-member.active {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        
        .combat-player {
            width: 50px;
            height: 50px;
        }
        
        .combat-stats {
            color: #fff;
            font-size: 9px;
            line-height: 1.6;
        }
        
        .combat-menu {
            width: 80%;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ffff;
            padding: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .combat-button {
            padding: 12px 18px;
            background: #2d1b4e;
            border: 2px solid #ff00ff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .combat-button:hover {
            background: #ff00ff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }
        
        .combat-message {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #00ffff;
            display: none;
            z-index: 350;
            min-width: 300px;
        }
        
        .combat-message.active {
            display: block;
        }
        
        .combat-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            animation: psychedelic-shift 5s linear infinite;
        }
        
        @keyframes psychedelic-shift {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .psi-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        
        .psi-menu.active {
            display: flex;
        }
        
        .item-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .item-menu.active {
            display: flex;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-screen" id="gameScreen">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div class="hud">
                <div class="hud-left">
                    <div id="hudName">PLAYER</div>
                    <div>LV: <span id="hudLevel">1</span></div>
                    <div>HP: <span id="hudHP">30/30</span></div>
                    <div>PP: <span id="hudPP">10/10</span></div>
                </div>
                <div class="hud-right">
                    <div>EXP: <span id="hudEXP">0</span></div>
                    <div>MONEY: $<span id="hudMoney">0</span></div>
                    <div>LOCATION: <span id="hudLocation">Room 303</span></div>
                </div>
            </div>
            
            <div class="interaction-prompt" id="interactionPrompt">
                [E] TO INTERACT
            </div>
            
            <div class="dialogue-box" id="dialogueBox">
                <p id="dialogueText"></p>
                <p style="text-align: center; margin-top: 10px; color: #00ffff; font-size: 10px;">
                    [PRESS SPACE TO CONTINUE]
                </p>
            </div>
            
            <div class="menu" id="gameMenu">
                <h2>MENU</h2>
                <button onclick="toggleMenu()">RESUME</button>
                <button onclick="showInventory()">INVENTORY</button>
                <button onclick="showStatus()">STATUS</button>
                <button onclick="saveGame()">SAVE</button>
                <button onclick="returnToTitle()">TITLE SCREEN</button>
            </div>
            
            <div class="inventory-screen" id="inventoryScreen">
                <h2>INVENTORY</h2>
                <div class="money-display">MONEY: $<span id="inventoryMoney">0</span></div>
                <div class="inventory-tabs">
                    <button class="inventory-tab active" onclick="switchInventoryTab('items', this)">ITEMS</button>
                    <button class="inventory-tab" onclick="switchInventoryTab('weapons', this)">WEAPONS</button>
                    <button class="inventory-tab" onclick="switchInventoryTab('keyItems', this)">KEY ITEMS</button>
                </div>
                <div class="inventory-list" id="inventoryList">
                </div>
                <div class="inventory-actions">
                    <button onclick="closeInventory()">CLOSE</button>
                </div>
            </div>
            
            <div class="combat-screen" id="combatScreen">
                <div class="combat-background"></div>
                <div class="combat-enemy-area" id="combatEnemyArea">
                    <canvas id="combatEnemyCanvas" class="combat-enemy" width="100" height="100"></canvas>
                </div>
                <div class="combat-party-area" id="combatPartyArea">
                </div>
                <div class="combat-menu" id="combatMenu">
                    <button class="combat-button" onclick="playerAttack()">FIGHT</button>
                    <button class="combat-button" onclick="showPSIMenu()">PSYCH</button>
                    <button class="combat-button" onclick="showItemMenu()">ITEM</button>
                    <button class="combat-button" onclick="playerDefend()">GUARD</button>
                    <button class="combat-button" onclick="playerRun()">RUN</button>
                </div>
                <div class="psi-menu" id="psiMenu">
                    <button class="combat-button" onclick="useCoffeeBreak()">COFFEE BREAK (5 PP)</button>
                    <button class="combat-button" onclick="useAllNighter()">ALL-NIGHTER (8 PP)</button>
                    <button class="combat-button" onclick="useRamenHeal()">RAMEN BREAK (5 PP)</button>
                    <button class="combat-button" onclick="hidePSIMenu()">BACK</button>
                </div>
                <div class="item-menu" id="itemMenu">
                </div>
            </div>
            
            <div class="combat-message" id="combatMessage">
                <p id="combatMessageText"></p>
            </div>
            
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-text">LOADING...</div>
            </div>
        </div>
    </div>
    
    <script>
        const items = {
            ramen: { name: 'Instant Ramen', type: 'item', healAmount: 20, description: 'Cheap instant noodles. Restores 20 HP.', price: 5, usable: true },
            energyDrink: { name: 'Energy Drink', type: 'item', healAmount: 50, description: 'Highly caffeinated. Restores 50 HP.', price: 15, usable: true },
            coffee: { name: 'Coffee', type: 'item', ppRestore: 10, description: 'Restores 10 PP. Essential for college students.', price: 8, usable: true },
            pizza: { name: 'Cold Pizza', type: 'item', healAmount: 100, description: 'Leftover pizza. Restores 100 HP.', price: 20, usable: true },
            textbook: { name: 'Textbook', type: 'weapon', attackBonus: 5, description: 'Heavy textbook. +5 Attack.', price: 30, usable: false },
            laptop: { name: 'Laptop', type: 'weapon', attackBonus: 10, description: 'Can be used as a weapon. +10 Attack.', price: 75, usable: false },
            deskLamp: { name: 'Desk Lamp', type: 'weapon', attackBonus: 3, description: 'A sturdy desk lamp. +3 Attack.', price: 15, usable: false },
            backpack: { name: 'Heavy Backpack', type: 'weapon', attackBonus: 8, description: 'Full of textbooks. +8 Attack.', price: 50, usable: false },
            forestKey: { name: 'Forest Key', type: 'keyItem', description: 'A rusted key that opens the Forest Gate.', price: 0, usable: false }
        };
        
        let gameState = {
            character: null,
            currentArea: 'room303',
            gameTime: 0,
            paused: false,
            inDialogue: false,
            dialogueQueue: [],
            pendingExit: null,
            player: { x: 400, y: 300, direction: 'down', moving: false, speed: 3 },
            keys: { up: false, down: false, left: false, right: false, interact: false },
            flags: { heardIzzyScream: false, enteredCloset: false, foundPortal: false, enteredForest: false, metBekah: false, foundForestKey: false, openedForestGate: false },
            combat: { active: false, enemy: null, turn: 'player', playerDefending: false, messageQueue: [], enemyEncounterChance: 0.1, activePartyMember: 0 },
            party: [
                { id: 'protagonist', name: 'PROTAGONIST', level: 1, hp: 30, maxHp: 30, pp: 10, maxPp: 10, attack: 5, defense: 3, speed: 4, exp: 0, shirtColor: '#ff0000', skinTone: '#f0c8a0', hairColor: '#4a3728', pantsColor: '#0000ff' }
            ],
            inventory: [],
            equippedWeapon: null,
            inventoryTab: 'items',
            selectedItem: null
        };
        
        const bekahStats = {
            id: 'bekah', name: 'BEKAH', level: 1, hp: 25, maxHp: 25, pp: 15, maxPp: 15, attack: 4, defense: 2, speed: 6, exp: 0, shirtColor: '#FF69B4', skinTone: '#FFC0CB', hairColor: '#8B4513', pantsColor: '#000000'
        };
        
        const enemies = {
            laundryGoblin: { name: 'Laundry Goblin', hp: 15, maxHp: 15, pp: 0, attack: 3, defense: 1, speed: 5, exp: 5, money: 5, color: '#808080', sprite: 'laundry', attacks: [{ name: 'Sock Attack', power: 1, type: 'physical' }, { name: 'Static Cling', power: 1.2, type: 'physical' }] },
            microwaveWraith: { name: 'Microwave Wraith', hp: 20, maxHp: 20, pp: 5, attack: 4, defense: 2, speed: 6, exp: 8, money: 8, color: '#C0C0C0', sprite: 'microwave', attacks: [{ name: 'Hot Pocket', power: 1.5, type: 'magical' }, { name: 'Radiation', power: 1, type: 'physical' }] },
            textbookTitan: { name: 'Textbook Titan', hp: 25, maxHp: 25, pp: 10, attack: 5, defense: 3, speed: 4, exp: 12, money: 12, color: '#8B0000', sprite: 'textbook', attacks: [{ name: 'Knowledge Drop', power: 1.3, type: 'magical' }, { name: 'Paper Cut', power: 1.4, type: 'physical' }] },
            coffeeGolem: { name: 'Coffee Golem', hp: 30, maxHp: 30, pp: 15, attack: 6, defense: 4, speed: 3, exp: 15, money: 15, color: '#6B4423', sprite: 'coffee', attacks: [{ name: 'Caffeine Rush', power: 1.6, type: 'magical' }, { name: 'Hot Splash', power: 1.2, type: 'physical' }] },
            showerMold: { name: 'Shower Mold', hp: 18, maxHp: 18, pp: 0, attack: 3, defense: 2, speed: 2, exp: 7, money: 3, color: '#556B2F', sprite: 'mold', attacks: [{ name: 'Spore Cloud', power: 1.1, type: 'physical' }, { name: 'Slimy Touch', power: 1.3, type: 'physical' }] },
            forestImp: { name: 'Forest Imp', hp: 22, maxHp: 22, pp: 8, attack: 4, defense: 2, speed: 7, exp: 10, money: 10, color: '#228B22', sprite: 'imp', attacks: [{ name: 'Branch Whip', power: 1.3, type: 'physical' }, { name: 'Leaf Storm', power: 1.4, type: 'magical' }] },
            mushroomZombie: { name: 'Mushroom Zombie', hp: 28, maxHp: 28, pp: 0, attack: 5, defense: 3, speed: 2, exp: 14, money: 8, color: '#8B008B', sprite: 'mushroom', attacks: [{ name: 'Spore Burst', power: 1.5, type: 'magical' }, { name: 'Fungal Grab', power: 1.2, type: 'physical' }] },
            shadowStudent: { name: 'Shadow Student', hp: 35, maxHp: 35, pp: 15, attack: 6, defense: 4, speed: 5, exp: 20, money: 20, color: '#2F4F4F', sprite: 'shadow', attacks: [{ name: 'Debt Collector', power: 1.7, type: 'magical' }, { name: 'Student Loan', power: 1.5, type: 'physical' }] }
        };
        
        const psychicAbilities = {
            coffeeBreak: { name: 'Coffee Break', cost: 5, power: 1.8, type: 'magical', description: 'Channel caffeine into psychic damage' },
            allNighter: { name: 'All-Nighter', cost: 8, power: 2.2, type: 'magical', description: 'Unleash the power of sleep deprivation' },
            ramenHeal: { name: 'Ramen Break', cost: 5, power: 0, type: 'healing', healAmount: 30, description: 'Restore HP with instant noodles' },
            bekahHeal: { name: 'Bekah\'s Kindness', cost: 5, power: 0, type: 'healing', healAmount: 25, description: 'Bekah uses her psychic kindness to heal' }
        };
        
        const maps = {};
        
        function initMaps() {
            maps.room303 = { width: 40, height: 30, tileSize: 20, collisionMap: [], npcs: [], objects: [], exits: [], backgroundColor: '#2d1b4e', floorColor: '#8B7355', wallColor: '#4A4A4A', enemies: [] };
            maps.closet = { width: 30, height: 30, tileSize: 20, collisionMap: [], npcs: [], objects: [], exits: [], backgroundColor: '#1a0a2e', floorColor: '#6B5B45', wallColor: '#3A2A1A', enemies: ['laundryGoblin', 'microwaveWraith', 'showerMold'] };
            maps.darkForest = { width: 50, height: 40, tileSize: 20, collisionMap: [], npcs: [], objects: [], exits: [], backgroundColor: '#0a1a0a', floorColor: '#1a3a1a', wallColor: '#0a2a0a', enemies: ['forestImp', 'mushroomZombie', 'shadowStudent', 'laundryGoblin'] };
            
            generateRoom303();
            generateCloset();
            generateDarkForest();
        }
        
        function generateRoom303() {
            const map = maps.room303;
            map.collisionMap = Array(map.height).fill().map(() => Array(map.width).fill(0));
            
            for (let x = 0; x < map.width; x++) {
                map.collisionMap[0][x] = 1;
                map.collisionMap[map.height - 1][x] = 1;
            }
            for (let y = 0; y < map.height; y++) {
                map.collisionMap[y][0] = 1;
                map.collisionMap[y][map.width - 1] = 1;
            }
            
            map.collisionMap[map.height - 1][20] = 0;
            map.collisionMap[map.height - 2][20] = 0;
            map.collisionMap[8][map.width - 1] = 0;
            map.collisionMap[9][map.width - 1] = 0;
            map.collisionMap[8][map.width - 2] = 0;
            map.collisionMap[9][map.width - 2] = 0;
            
            for (let y = 5; y < 10; y++) {
                for (let x = 5; x < 12; x++) map.collisionMap[y][x] = 1;
            }
            for (let y = 15; y < 18; y++) {
                for (let x = 25; x < 32; x++) map.collisionMap[y][x] = 1;
            }
            for (let y = 5; y < 12; y++) {
                for (let x = 30; x < 33; x++) map.collisionMap[y][x] = 1;
            }
            
            map.objects = [
                { x: 8, y: 5, type: 'bed', name: 'Your Bed', description: 'A messy college dorm bed.' },
                { x: 28, y: 15, type: 'desk', name: 'Your Desk', description: 'Covered in textbooks and energy drinks.', itemDrop: 'deskLamp' },
                { x: 31, y: 8, type: 'bookshelf', name: 'Bookshelf', description: 'Full of textbooks you haven\'t opened yet.', itemDrop: 'textbook' }
            ];
            
            map.npcs = [
                { x: 22, y: 10, name: 'Izzy', sprite: 'izzy', dialogue: ["IZZY: *muffled screams from the closet*", "IZZY: HELP! Something dragged me in here!", "IZZY: It's so dark... and cold... PLEASE HURRY!"], interactionType: 'izzy' }
            ];
            
            map.exits = [
                { x: 39, y: 8, targetArea: 'closet', targetX: 1, targetY: 15, transitionText: 'You open the closet door...' }

        function initGame() {
            const characterData = localStorage.getItem('johnNeumaierCharacter');
            
            if (!characterData) {
                window.location.href = 'index.html';
                return;
            }
            
            const charData = JSON.parse(characterData);
            
            gameState.party[0] = {
                ...gameState.party[0],
                name: charData.name || 'PROTAGONIST',
                shirtColor: charData.shirtColor || '#ff0000',
                skinTone: charData.skinTone || '#f0c8a0',
                hairColor: charData.hairColor || '#4a3728',
                pantsColor: charData.pantsColor || '#0000ff'
            };
            
            gameState.character = gameState.party[0];
            
            if (!charData.inventory) charData.inventory = [];
            gameState.inventory = charData.inventory;
            
            if (gameState.inventory.length === 0) {
                addItem('ramen', 2);
                addItem('coffee', 1);
            }
            
            initMaps();
            updateHUD();
            gameLoop();
            
            setTimeout(() => {
                document.getElementById('loadingScreen').style.display = 'none';
                startOpeningScene();
            }, 2000);
        }
        
        function addItem(itemId, quantity = 1) {
            const existingItem = gameState.inventory.find(item => item.id === itemId);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                gameState.inventory.push({ id: itemId, quantity: quantity });
            }
        }
        
        function removeItem(itemId, quantity = 1) {
            const itemIndex = gameState.inventory.findIndex(item => item.id === itemId);
            if (itemIndex !== -1) {
                gameState.inventory[itemIndex].quantity -= quantity;
                if (gameState.inventory[itemIndex].quantity <= 0) {
                    gameState.inventory.splice(itemIndex, 1);
                }
            }
        }
        
        function hasItem(itemId) {
            return gameState.inventory.some(item => item.id === itemId);
        }
        
        function getItemQuantity(itemId) {
            const item = gameState.inventory.find(item => item.id === itemId);
            return item ? item.quantity : 0;
        }
        
        function useItem(itemId, targetPartyMember = null) {
            const itemData = items[itemId];
            const target = targetPartyMember !== null ? targetPartyMember : gameState.combat.activePartyMember;
            const partyMember = gameState.party[target];
            
            if (!itemData || !itemData.usable) return false;
            
            if (itemData.healAmount) {
                partyMember.hp = Math.min(partyMember.maxHp, partyMember.hp + itemData.healAmount);
                removeItem(itemId);
                updateHUD();
                return true;
            }
            
            if (itemData.ppRestore) {
                partyMember.pp = Math.min(partyMember.maxPp, partyMember.pp + itemData.ppRestore);
                removeItem(itemId);
                updateHUD();
                return true;
            }
            
            return false;
        }
        
        function equipWeapon(itemId) {
            const itemData = items[itemId];
            if (!itemData || itemData.type !== 'weapon') return;
            gameState.equippedWeapon = itemId;
            gameState.party[0].attack = 5 + itemData.attackBonus;
            updateHUD();
        }
        
        function showInventory() {
            document.getElementById('gameMenu').classList.remove('active');
            gameState.paused = true;
            gameState.inventoryTab = 'items';
            document.getElementById('inventoryScreen').classList.add('active');
            updateInventoryDisplay();
        }
        
        function closeInventory() {
            document.getElementById('inventoryScreen').classList.remove('active');
            gameState.paused = false;
        }
        
        function switchInventoryTab(tab, button) {
            gameState.inventoryTab = tab;
            gameState.selectedItem = null;
            document.querySelectorAll('.inventory-tab').forEach(btn => btn.classList.remove('active'));
            button.classList.add('active');
            updateInventoryDisplay();
        }
        
        function updateInventoryDisplay() {
            const listElement = document.getElementById('inventoryList');
            const moneyElement = document.getElementById('inventoryMoney');
            moneyElement.textContent = gameState.party[0].money || 0;
            listElement.innerHTML = '';
            
            let displayItems = [];
            
            switch(gameState.inventoryTab) {
                case 'items':
                    displayItems = gameState.inventory.filter(item => items[item.id].type === 'item');
                    break;
                case 'weapons':
                    displayItems = gameState.inventory.filter(item => items[item.id].type === 'weapon');
                    break;
                case 'keyItems':
                    displayItems = gameState.inventory.filter(item => items[item.id].type === 'keyItem');
                    break;
            }
            
            if (displayItems.length === 0) {
                listElement.innerHTML = '<div style="text-align: center; color: #666;">NO ITEMS</div>';
                return;
            }
            
            displayItems.forEach(item => {
                const itemData = items[item.id];
                const itemElement = document.createElement('div');
                itemElement.className = 'inventory-item';
                if (gameState.selectedItem === item.id) itemElement.classList.add('selected');
                
                itemElement.innerHTML = `
                    <div>
                        <div class="item-name">${itemData.name}</div>
                        <div class="item-description">${itemData.description}</div>
                    </div>
                    <div class="item-quantity">x${item.quantity}</div>
                `;
                
                itemElement.addEventListener('click', () => selectInventoryItem(item.id));
                listElement.appendChild(itemElement);
            });
        }
        
        function selectInventoryItem(itemId) {
            gameState.selectedItem = itemId;
            updateInventoryDisplay();
            
            const itemData = items[itemId];
            
            if (itemData.type === 'item' && itemData.usable) {
                if (useItem(itemId, 0)) {
                    showCombatMessage(`Used ${itemData.name}!`);
                    updateInventoryDisplay();
                }
            } else if (itemData.type === 'weapon') {
                equipWeapon(itemId);
                showCombatMessage(`Equipped ${itemData.name}!`);
                updateInventoryDisplay();
            }
        }
        
        function showItemMenu() {
            if (gameState.combat.turn !== 'player') return;
            
            const itemMenu = document.getElementById('itemMenu');
            itemMenu.innerHTML = '';
            
            const usableItems = gameState.inventory.filter(item => items[item.id].type === 'item' && items[item.id].usable);
            
            if (usableItems.length === 0) {
                showCombatMessage('No usable items!');
                return;
            }
            
            usableItems.forEach(item => {
                const itemData = items[item.id];
                const button = document.createElement('button');
                button.className = 'combat-button';
                button.textContent = `${itemData.name} (x${item.quantity})`;
                button.addEventListener('click', () => {
                    const target = gameState.combat.activePartyMember;
                    if (useItem(item.id, target)) {
                        showCombatMessage(`${gameState.party[target].name} uses ${itemData.name}!`);
                        document.getElementById('combatMenu').style.display = 'flex';
                        itemMenu.classList.remove('active');
                        gameState.combat.turn = 'enemy';
                        setTimeout(enemyTurn, 1500);
                    } else {
                        showCombatMessage('Can\'t use that right now!');
                    }
                });
                itemMenu.appendChild(button);
            });
            
            const backButton = document.createElement('button');
            backButton.className = 'combat-button';
            backButton.textContent = 'BACK';
            backButton.addEventListener('click', () => {
                document.getElementById('combatMenu').style.display = 'flex';
                itemMenu.classList.remove('active');
            });
            itemMenu.appendChild(backButton);
            
            document.getElementById('combatMenu').style.display = 'none';
            itemMenu.classList.add('active');
        }
        
        function gameLoop() {
            if (!gameState.paused && !gameState.inDialogue && !gameState.combat.active) {
                updatePlayer();
                checkInteractions();
                checkRandomEncounter();
                renderGame();
            }
            requestAnimationFrame(gameLoop);
        }
        
        function checkRandomEncounter() {
            const map = maps[gameState.currentArea];
            if (map.enemies && map.enemies.length > 0 && gameState.player.moving) {
                if (Math.random() < gameState.combat.enemyEncounterChance) {
                    const randomEnemy = map.enemies[Math.floor(Math.random() * map.enemies.length)];
                    startCombat(randomEnemy);
                }
            }
        }
        
        function startCombat(enemyType) {
            gameState.combat.active = true;
            gameState.combat.turn = 'player';
            gameState.combat.playerDefending = false;
            gameState.combat.enemy = { ...enemies[enemyType] };
            gameState.combat.activePartyMember = 0;
            
            document.getElementById('combatScreen').classList.add('active');
            document.getElementById('combatMenu').style.display = 'flex';
            document.getElementById('psiMenu').classList.remove('active');
            document.getElementById('itemMenu').classList.remove('active');
            
            drawCombatEnemy();
            updateCombatPartyDisplay();
            showCombatMessage(`${gameState.combat.enemy.name} attacks!`);
        }
        
        function updateCombatPartyDisplay() {
            const partyArea = document.getElementById('combatPartyArea');
            partyArea.innerHTML = '';
            
            gameState.party.forEach((member, index) => {
                if (member.hp <= 0) return;
                
                const memberElement = document.createElement('div');
                memberElement.className = 'combat-party-member';
                if (index === gameState.combat.activePartyMember) memberElement.classList.add('active');
                
                const canvas = document.createElement('canvas');
                canvas.className = 'combat-player';
                canvas.width = 50;
                canvas.height = 50;
                
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = member.shirtColor;
                ctx.fillRect(5, 15, 40, 35);
                ctx.fillStyle = member.skinTone;
                ctx.fillRect(10, 5, 30, 25);
                ctx.fillStyle = member.hairColor;
                ctx.fillRect(10, 2, 30, 8);
                ctx.fillStyle = '#000000';
                ctx.fillRect(20, 15, 5, 5);
                ctx.fillRect(35, 15, 5, 5);
                
                memberElement.appendChild(canvas);
                
                const statsDiv = document.createElement('div');
                statsDiv.className = 'combat-stats';
                statsDiv.innerHTML = `
                    <div>${member.name}</div>
                    <div>HP: ${member.hp}/${member.maxHp}</div>
                    <div>PP: ${member.pp}/${member.maxPp}</div>
                `;
                
                memberElement.appendChild(statsDiv);
                memberElement.addEventListener('click', () => {
                    gameState.combat.activePartyMember = index;
                    updateCombatPartyDisplay();
                });
                
                partyArea.appendChild(memberElement);
            });
        }
        
        function drawCombatEnemy() {
            const canvas = document.getElementById('combatEnemyCanvas');
            const ctx = canvas.getContext('2d');
            const enemy = gameState.combat.enemy;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            switch(enemy.sprite) {
                case 'laundry':
                    ctx.fillStyle = '#808080';
                    ctx.fillRect(30, 50, 40, 30);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(25, 45, 15, 15);
                    ctx.fillRect(60, 45, 15, 15);
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(45, 55, 10, 5);
                    break;
                case 'microwave':
                    ctx.fillStyle = '#C0C0C0';
                    ctx.fillRect(20, 30, 60, 40);
                    ctx.fillStyle = '#808080';
                    ctx.fillRect(30, 25, 40, 10);
                    ctx.fillStyle = '#00FF00';
                    ctx.fillRect(35, 35, 30, 5);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(45, 45, 10, 10);
                    break;
                case 'textbook':
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(25, 30, 50, 40);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(30, 35, 40, 30);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(35, 40, 30, 3);
                    ctx.fillRect(35, 50, 30, 3);
                    ctx.fillRect(35, 60, 30, 3);
                    break;
                case 'coffee':
                    ctx.fillStyle = '#6B4423';
                    ctx.fillRect(30, 30, 40, 50);
                    ctx.fillStyle = '#4A2F1A';
                    ctx.fillRect(25, 25, 50, 15);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(40, 45, 5, 5);
                    ctx.fillRect(55, 45, 5, 5);
                    break;
                case 'mold':
                    ctx.fillStyle = '#556B2F';
                    ctx.beginPath();
                    ctx.arc(50, 50, 25, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#6B8E23';
                    ctx.beginPath();
                    ctx.arc(40, 40, 8, 0, Math.PI * 2);
                    ctx.arc(60, 40, 8, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'imp':
                    ctx.fillStyle = '#228B22';
                    ctx.fillRect(25, 40, 50, 30);
                    ctx.fillStyle = '#32CD32';
                    ctx.fillRect(35, 25, 30, 20);
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(45, 35, 10, 5);
                    break;
                case 'mushroom':
                    ctx.fillStyle = '#8B008B';
                    ctx.fillRect(30, 30, 40, 40);
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(40, 20, 20, 20);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(45, 35, 5, 5);
                    ctx.fillRect(55, 35, 5, 5);
                    break;
                case 'shadow':
                    ctx.fillStyle = '#2F4F4F';
                    ctx.fillRect(25, 25, 50, 50);
                    ctx.fillStyle = '#1a1a1a';
                    ctx.fillRect(35, 35, 30, 30);
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(45, 45, 10, 5);
                    break;
                default:
                    ctx.fillStyle = enemy.color;
                    ctx.fillRect(20, 20, 60, 60);
            }
        }
        
        function showCombatMessage(message) {
            const messageDiv = document.getElementById('combatMessage');
            const messageText = document.getElementById('combatMessageText');
            
            messageText.textContent = message;
            messageDiv.classList.add('active');
            
            setTimeout(() => {
                messageDiv.classList.remove('active');
            }, 1500);
        }
        
        function showPSIMenu() {
            if (gameState.combat.turn !== 'player') return;
            document.getElementById('combatMenu').style.display = 'none';
            document.getElementById('psiMenu').classList.add('active');
        }
        
        function hidePSIMenu() {
            document.getElementById('combatMenu').style.display = 'flex';
            document.getElementById('psiMenu').classList.remove('active');
        }
        
        function playerAttack() {
            if (gameState.combat.turn !== 'player') return;
            
            const partyMember = gameState.party[gameState.combat.activePartyMember];
            const enemy = gameState.combat.enemy;
            
            const attackMessages = [
                `${partyMember.name} throws a textbook at ${enemy.name}!`,
                `${partyMember.name} hits ${enemy.name} with a laptop!`,
                `${partyMember.name} attacks with a desk lamp!`,
                `${partyMember.name} swings a backpack!`
            ];
            const message = attackMessages[Math.floor(Math.random() * attackMessages.length)];
            
            let damage = Math.max(1, partyMember.attack - enemy.defense + Math.floor(Math.random() * 3));
            
            if (gameState.combat.playerDefending) {
                damage = Math.floor(damage * 0.5);
                gameState.combat.playerDefending = false;
            }
            
            enemy.hp -= damage;
            showCombatMessage(`${message} ${damage} damage!`);
            
            if (enemy.hp <= 0) {
                endCombat(true);
            } else {
                gameState.combat.turn = 'enemy';
                setTimeout(enemyTurn, 1500);
            }
        }
        
        function useCoffeeBreak() {
            if (gameState.combat.turn !== 'player') return;
            
            const partyMember = gameState.party[gameState.combat.activePartyMember];
            const ability = psychicAbilities.coffeeBreak;
            
            if (partyMember.pp < ability.cost) {
                showCombatMessage('Not enough PP!');
                return;
            }
            
            const enemy = gameState.combat.enemy;
            let damage = Math.floor(10 + partyMember.attack * 1.5);
            
            partyMember.pp -= ability.cost;
            enemy.hp -= damage;
            updateCombatPartyDisplay();
            hidePSIMenu();
            
            showCombatMessage(`${partyMember.name} uses ${ability.name}! ${enemy.name} takes ${damage} psychic damage!`);
            
            if (enemy.hp <= 0) {
                endCombat(true);
            } else {
                gameState.combat.turn = 'enemy';
                setTimeout(enemyTurn, 1500);
            }
        }
        
        function useAllNighter() {
            if (gameState.combat.turn !== 'player') return;
            
            const partyMember = gameState.party[gameState.combat.activePartyMember];
            const ability = psychicAbilities.allNighter;
            
            if (partyMember.pp < ability.cost) {
                showCombatMessage('Not enough PP!');
                return;
            }
            
            const enemy = gameState.combat.enemy;
            let damage = Math.floor(15 + partyMember.attack * 2);
            
            partyMember.pp -= ability.cost;
            enemy.hp -= damage;
            updateCombatPartyDisplay();
            hidePSIMenu();
            
            showCombatMessage(`${partyMember.name} pulls an ${ability.name}! ${enemy.name} takes ${damage} damage!`);
            
            if (enemy.hp <= 0) {
                endCombat(true);
            } else {
                gameState.combat.turn = 'enemy';
                setTimeout(enemyTurn, 1500);
            }
        }
        
        function useRamenHeal() {
            if (gameState.combat.turn !== 'player') return;
            
            const partyMember = gameState.party[gameState.combat.activePartyMember];
            const ability = psychicAbilities.ramenHeal;
            
            if (partyMember.pp < ability.cost) {
                showCombatMessage('Not enough PP!');
                return;
            }
            
            partyMember.pp -= ability.cost;
            partyMember.hp = Math.min(partyMember.maxHp, partyMember.hp + ability.healAmount);
            updateCombatPartyDisplay();
            hidePSIMenu();
            
            showCombatMessage(`${partyMember.name} eats instant ramen! Restored ${ability.healAmount} HP!`);
            
            gameState.combat.turn = 'enemy';
            setTimeout(enemyTurn, 1500);
        }
        
        function playerDefend() {
            if (gameState.combat.turn !== 'player') return;
            
            gameState.combat.playerDefending = true;
            showCombatMessage(`${gameState.party[gameState.combat.activePartyMember].name} hides behind a desk!`);
            gameState.combat.turn = 'enemy';
            setTimeout(enemyTurn, 1000);
        }
        
        function playerRun() {
            if (gameState.combat.turn !== 'player') return;
            
            const escapeChance = 0.5;
            if (Math.random() < escapeChance) {
                endCombat(false);
                showCombatMessage('You escaped!');
            } else {
                showCombatMessage('Couldn\'t escape!');
                gameState.combat.turn = 'enemy';
                setTimeout(enemyTurn, 1000);
            }
        }
        
        function enemyTurn() {
            const enemy = gameState.combat.enemy;
            
            const alivePartyMembers = gameState.party.filter(member => member.hp > 0);
            if (alivePartyMembers.length === 0) {
                endCombat(false);
                showCombatMessage('All party members are defeated...');
                return;
            }
            
            const target = alivePartyMembers[Math.floor(Math.random() * alivePartyMembers.length)];
            const attack = enemy.attacks[Math.floor(Math.random() * enemy.attacks.length)];
            let damage = Math.max(1, Math.floor(enemy.attack * attack.power - target.defense));
            
            if (gameState.combat.playerDefending) {
                damage = Math.floor(damage * 0.5);
                gameState.combat.playerDefending = false;
            }
            
            target.hp -= damage;
            updateCombatPartyDisplay();
            updateHUD();
            
            showCombatMessage(`${enemy.name} uses ${attack.name} on ${target.name}! ${damage} damage!`);
            
            const allDefeated = gameState.party.every(member => member.hp <= 0);
            
            if (allDefeated) {
                endCombat(false);
                showCombatMessage('Your party is defeated...');
                setTimeout(() => {
                    gameState.party.forEach(member => {
                        member.hp = member.maxHp;
                        member.pp = member.maxPp;
                    });
                    gameState.currentArea = 'room303';
                    gameState.player.x = 400;
                    gameState.player.y = 300;
                    updateHUD();
                }, 3000);
            } else {
                gameState.combat.turn = 'player';
            }
        }
        
        function endCombat(victory) {
            gameState.combat.active = false;
            document.getElementById('combatScreen').classList.remove('active');
            
            if (victory) {
                const enemy = gameState.combat.enemy;
                
                gameState.party.forEach(member => {
                    if (member.hp > 0) {
                        member.exp += enemy.exp;
                        member.money = (member.money || 0) + enemy.money;
                        
                        const expNeeded = member.level * 10;
                        if (member.exp >= expNeeded) {
                            member.level++;
                            member.exp -= expNeeded;
                            member.maxHp += 5;
                            member.hp = member.maxHp;
                            member.maxPp += 3;
                            member.pp = member.maxPp;
                            member.attack += 2;
                            member.defense += 1;
                            member.speed += 1;
                            
                            showCombatMessage(`${member.name} reached level ${member.level}!`);
                        }
                    }
                });
                
                updateHUD();
            }
        }
        
        function updatePlayer() {
            const map = maps[gameState.currentArea];
            const player = gameState.player;
            
            let dx = 0;
            let dy = 0;
            
            if (gameState.keys.up) { dy = -player.speed; player.direction = 'up'; }
            if (gameState.keys.down) { dy = player.speed; player.direction = 'down'; }
            if (gameState.keys.left) { dx = -player.speed; player.direction = 'left'; }
            if (gameState.keys.right) { dx = player.speed; player.direction = 'right'; }
            
            player.moving = dx !== 0 || dy !== 0;
            
            if (dx !== 0 && canMove(player.x + dx, player.y, map)) player.x += dx;
            if (dy !== 0 && canMove(player.x, player.y + dy, map)) player.y += dy;
            
            checkAreaTransition();
        }
        
        function canMove(x, y, map) {
            const tileX = Math.floor(x / map.tileSize);
            const tileY = Math.floor(y / map.tileSize);
            
            if (tileX < 0 || tileX >= map.width || tileY < 0 || tileY >= map.height) return false;
            
            return map.collisionMap[tileY][tileX] === 0;
        }
        
        function checkAreaTransition() {
            const map = maps[gameState.currentArea];
            const player = gameState.player;
            
            map.exits.forEach(exit => {
                const exitTileX = exit.x * map.tileSize;
                const exitTileY = exit.y * map.tileSize;
                
                if (Math.abs(player.x - exitTileX) < map.tileSize / 2 &&
                    Math.abs(player.y - exitTileY) < map.tileSize / 2) {
                    if (exit.targetArea === 'graveyard' && !gameState.flags.openedForestGate) {
                        if (!gameState.flags.foundForestKey) {
                            showDialogue('The gate is locked. You need to find the key...');
                            gameState.inDialogue = true;
                        }
                        return;
                    }
                    
                    if (exit.transitionText) {
                        transitionWithDialogue(exit);
                    } else {
                        transitionArea(exit.targetArea, exit.targetX, exit.targetY);
                    }
                }
            });
        }
        
        function transitionWithDialogue(exit) {
            gameState.inDialogue = true;
            gameState.dialogueQueue = [
                exit.transitionText,
                null
            ];
            showDialogue(gameState.dialogueQueue.shift());
            gameState.pendingExit = exit;
        }
        
        function transitionArea(areaId, targetX, targetY) {
            gameState.currentArea = areaId;
            gameState.player.x = targetX * maps[areaId].tileSize;
            gameState.player.y = targetY * maps[areaId].tileSize;
            updateHUD();
            
            if (areaId === 'closet' && !gameState.flags.enteredCloset) {
                gameState.flags.enteredCloset = true;
                gameState.dialogueQueue = [
                    "The closet is darker than it should be...",
                    "The air is cold, and you hear whispers...",
                    "A strange purple glow comes from deeper in...",
                    "You feel something watching you..."
                ];
                setTimeout(() => showDialogue(gameState.dialogueQueue.shift()), 500);
            }
            
            if (areaId === 'darkForest' && !gameState.flags.enteredForest) {
                gameState.flags.enteredForest = true;
                gameState.dialogueQueue = [
                    "You emerge into a twisted, dark forest...",
                    "The trees seem to move when you're not looking...",
                    "You can hear Izzy's voice echoing in the distance...",
                    "There's a gate at the north end, but it's locked...",
                    "Maybe there's a key hidden somewhere in this forest..."
                ];
                setTimeout(() => showDialogue(gameState.dialogueQueue.shift()), 500);
            }
        }
        
        function checkInteractions() {
            const map = maps[gameState.currentArea];
            const player = gameState.player;
            const interactRange = 30;
            
            let nearInteraction = false;
            
            map.npcs.forEach(npc => {
                const npcX = npc.x * map.tileSize;
                const npcY = npc.y * map.tileSize;
                
                if (Math.abs(player.x - npcX) < interactRange &&
                    Math.abs(player.y - npcY) < interactRange) {
                    nearInteraction = true;
                    if (gameState.keys.interact) interactWithNPC(npc);
                }
            });
            
            map.objects.forEach(obj => {
                const objX = obj.x * map.tileSize;
                const objY = obj.y * map.tileSize;
                
                if (Math.abs(player.x - objX) < interactRange &&
                    Math.abs(player.y - objY) < interactRange) {
                    nearInteraction = true;
                    if (gameState.keys.interact) interactWithObject(obj);
                }
            });
            
            const prompt = document.getElementById('interactionPrompt');
            if (nearInteraction && !gameState.inDialogue) {
                prompt.classList.add('active');
            } else {
                prompt.classList.remove('active');
            }
        }
        
        function interactWithNPC(npc) {
            gameState.keys.interact = false;
            
            if (npc.interactionType === 'izzy') {
                gameState.flags.heardIzzyScream = true;
                gameState.dialogueQueue = [...npc.dialogue];
                showDialogue(gameState.dialogueQueue.shift());
            } else if (npc.interactionType === 'bekah') {
                if (!gameState.flags.metBekah) {
                    gameState.flags.metBekah = true;
                    gameState.party.push({...bekahStats});
                    gameState.dialogueQueue = [...npc.dialogue];
                } else {
                    gameState.dialogueQueue = [
                        "BEKAH: We need to find Izzy!",
                        "BEKAH: Let me know if you need help in battle!"
                    ];
                }
                showDialogue(gameState.dialogueQueue.shift());
            }
        }
        
        function interactWithObject(obj) {
            gameState.keys.interact = false;
            
            if (obj.interactionType === 'portal') {
                gameState.dialogueQueue = [
                    "The portal swirls with dark energy...",
                    "You can hear Izzy's voice echoing from within...",
                    "This must be the entrance to the Dark Wonderland Forest.",
                    "You step through the portal..."
                ];
                
                gameState.pendingExit = {
                    targetArea: 'darkForest',
                    targetX: 25,
                    targetY: 38
                };
                
                showDialogue(gameState.dialogueQueue.shift());
            } else if (obj.interactionType === 'returnPortal') {
                gameState.dialogueQueue = [
                    "A portal back to the closet.",
                    "You step through the portal..."
                ];
                
                gameState.pendingExit = {
                    targetArea: 'closet',
                    targetX: 14,
                    targetY: 14
                };
                
                showDialogue(gameState.dialogueQueue.shift());
            } else if (obj.interactionType === 'note') {
                gameState.dialogueQueue = [
                    "You find a torn note...",
                    "\"The key is hidden where the mushrooms glow...\"",
                    "You should look for glowing mushrooms!"
                ];
                showDialogue(gameState.dialogueQueue.shift());
            } else if (obj.interactionType === 'forestKey') {
                if (!hasItem('forestKey')) {
                    gameState.flags.foundForestKey = true;
                    addItem('forestKey');
                    gameState.dialogueQueue = [
                        "You found the Forest Key!",
                        "Added to Key Items!"
                    ];
                } else {
                    gameState.dialogueQueue = [
                        "You already have the Forest Key."
                    ];
                }
                showDialogue(gameState.dialogueQueue.shift());
            } else if (obj.interactionType === 'gate') {
                if (gameState.flags.foundForestKey || hasItem('forestKey')) {
                    gameState.flags.openedForestGate = true;
                    gameState.dialogueQueue = [
                        "You use the Forest Key...",
                        "The gate creaks open!",
                        "The path to the graveyard is clear!"
                    ];
                } else {
                    gameState.dialogueQueue = [
                        "The gate is locked.",
                        "You need to find the key..."
                    ];
                }
                showDialogue(gameState.dialogueQueue.shift());
            } else if (obj.itemDrop) {
                if (!hasItem(obj.itemDrop)) {
                    addItem(obj.itemDrop);
                    gameState.dialogueQueue = [
                        `You found: ${items[obj.itemDrop].name}!`,
                        items[obj.itemDrop].description,
                        "Added to inventory!"
                    ];
                } else {
                    gameState.dialogueQueue = [
                        `${obj.name}: ${obj.description}`
                    ];
                }
                showDialogue(gameState.dialogueQueue.shift());
            } else {
                gameState.dialogueQueue = [`${obj.name}: ${obj.description}`];
                showDialogue(gameState.dialogueQueue.shift());
            }
        }
        
        function renderGame() {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');
            const map = maps[gameState.currentArea];
            
            ctx.fillStyle = map.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < map.height; y++) {
                for (let x = 0; x < map.width; x++) {
                    if (map.collisionMap[y][x] === 0) {
                        drawFloorTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize, map.floorColor);
                    }
                }
            }
            
            for (let y = 0; y < map.height; y++) {
                for (let x = 0; x < map.width; x++) {
                    if (map.collisionMap[y][x] === 1) {
                        if (gameState.currentArea === 'darkForest') {
                            drawTreeTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                        } else {
                            drawWallTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize, map.wallColor);
                        }
                    }
                }
            }
            
            map.objects.forEach(obj => drawObject(ctx, obj, map.tileSize));
            map.npcs.forEach(npc => drawNPC(ctx, npc, map.tileSize));
            drawPlayer(ctx);
        }
        
        function drawFloorTile(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
        }
        
        function drawWallTile(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, size, size);
            ctx.beginPath();
            ctx.moveTo(x, y + size/2);
            ctx.lineTo(x + size, y + size/2);
            ctx.stroke();
        }
        
        function drawTreeTile(ctx, x, y, size) {
            ctx.fillStyle = '#0a2a0a';
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#1a4a1a';
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a3a0a';
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawObject(ctx, obj, tileSize) {
            const x = obj.x * tileSize;
            const y = obj.y * tileSize;
            
            switch(obj.type) {
                case 'bed':
                    ctx.fillStyle = '#4169E1';
                    ctx.fillRect(x, y, tileSize * 3, tileSize * 2);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(x + 5, y + 5, tileSize * 2, tileSize);
                    break;
                case 'desk':
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x, y, tileSize * 2, tileSize);
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(x, y + tileSize, tileSize * 2, tileSize/2);
                    break;
                case 'bookshelf':
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(x, y, tileSize, tileSize * 3);
                    for (let i = 0; i < 3; i++) {
                        ctx.fillStyle = ['#FF0000', '#00FF00', '#0000FF'][i];
                        ctx.fillRect(x + 2, y + i * tileSize + 2, tileSize - 4, tileSize - 4);
                    }
                    break;
                case 'clothes':
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    ctx.fillStyle = '#FF1493';
                    ctx.fillRect(x + 5, y + 5, tileSize - 10, tileSize - 10);
                    break;
                case 'boxes':
                    ctx.fillStyle = '#8B7355';
                    ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
                    ctx.strokeStyle = '#654321';
                    ctx.strokeRect(x, y, tileSize * 2, tileSize * 2);
                    break;
                case 'portal':
                    const time = Date.now() / 1000;
                    const pulse = Math.sin(time * 3) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255, 0, 255, ${pulse})`;
                    ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
                    ctx.fillStyle = `rgba(0, 255, 255, ${pulse * 0.5})`;
                    ctx.fillRect(x + 5, y + 5, tileSize * 2 - 10, tileSize * 2 - 10);
                    break;
                case 'tree':
                    ctx.fillStyle = '#1a4a1a';
                    ctx.beginPath();
                    ctx.arc(x + tileSize/2, y + tileSize/2, tileSize, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'mushroom':
                    ctx.fillStyle = '#8B008B';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    ctx.fillStyle = '#FF69B4';
                    ctx.beginPath();
                    ctx.arc(x + tileSize/2, y + tileSize/2, tileSize/2, 0, Math.PI * 2);
                    ctx.fill();
                    break;
                case 'note':
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    ctx.strokeStyle = '#000000';
                    ctx.strokeRect(x, y, tileSize, tileSize);
                    break;
                case 'key':
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(x + 5, y + 8, 10, 4);
                    ctx.fillRect(x + 12, y + 5, 3, 10);
                    break;
                case 'gate':
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(x, y, tileSize * 3, tileSize * 2);
                    ctx.strokeStyle = '#000000';
                    ctx.lineWidth = 2;
                    for (let i = 0; i < 3; i++) {
                        ctx.beginPath();
                        ctx.moveTo(x + i * tileSize, y);
                        ctx.lineTo(x + i * tileSize, y + tileSize * 2);
                        ctx.stroke();
                    }
                    break;
            }
        }
        
        function drawNPC(ctx, npc, tileSize) {
            const x = npc.x * tileSize;
            const y = npc.y * tileSize;
            
            if (npc.sprite === 'bekah') {
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(x, y, tileSize, tileSize * 0.8);
                ctx.fillStyle = '#FFC0CB';
                ctx.fillRect(x + 3, y - 3, tileSize - 6, tileSize - 6);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x + 3, y - 6, tileSize - 6, 5);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 5, y + 3, 3, 3);
                ctx.fillRect(x + 12, y + 3, 3, 3);
            } else {
                ctx.fillStyle = '#FFC0CB';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x, y, tileSize, tileSize/3);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 5, y + 8, 3, 3);
                ctx.fillRect(x + 12, y + 8, 3, 3);
            }
        }
        
        function drawPlayer(ctx) {
            const player = gameState.player;
            const tileSize = maps[gameState.currentArea].tileSize;
            const partyLeader = gameState.party[0];
            
            ctx.fillStyle = partyLeader.shirtColor;
            ctx.fillRect(player.x, player.y, tileSize, tileSize);
            ctx.fillStyle = partyLeader.skinTone;
            ctx.fillRect(player.x + 3, player.y - 5, tileSize - 6, tileSize - 6);
            ctx.fillStyle = partyLeader.hairColor;
            ctx.fillRect(player.x + 3, player.y - 8, tileSize - 6, 5);
            ctx.fillStyle = '#000000';
            if (player.direction === 'down') {
                ctx.fillRect(player.x + 5, player.y + 3, 3, 3);
                ctx.fillRect(player.x + 12, player.y + 3, 3, 3);
            } else {
                ctx.fillRect(player.x + 5, player.y + 2, 3, 3);
                ctx.fillRect(player.x + 12, player.y + 2, 3, 3);
            }
            ctx.fillStyle = partyLeader.pantsColor;
            ctx.fillRect(player.x + 3, player.y + tileSize - 5, 5, 5);
            ctx.fillRect(player.x + 12, player.y + tileSize - 5, 5, 5);
        }
        
        function updateHUD() {
            const partyLeader = gameState.party[0];
            document.getElementById('hudName').textContent = partyLeader.name;
            document.getElementById('hudLevel').textContent = partyLeader.level;
            document.getElementById('hudHP').textContent = `${partyLeader.hp}/${partyLeader.maxHp}`;
            document.getElementById('hudPP').textContent = `${partyLeader.pp}/${partyLeader.maxPp}`;
            document.getElementById('hudEXP').textContent = partyLeader.exp;
            document.getElementById('hudMoney').textContent = partyLeader.money || 0;
            document.getElementById('hudLocation').textContent = getLocationName(gameState.currentArea);
        }
        
        function getLocationName(areaId) {
            const locations = {
                'room303': 'Room 303',
                'closet': 'The Closet',
                'darkForest': 'Dark Wonderland Forest',
                'graveyard': 'The Graveyard',
                'village': 'The Village',
                'upperVillage': 'Upper Village',
                'castleWalls': 'Castle Walls',
                'castle': 'The Castle'
            };
            return locations[areaId] || 'Unknown';
        }
        
        function showDialogue(text) {
            gameState.inDialogue = true;
            document.getElementById('dialogueText').textContent = text;
            document.getElementById('dialogueBox').classList.add('active');
        }
        
        function closeDialogue() {
            gameState.inDialogue = false;
            document.getElementById('dialogueBox').classList.remove('active');
            
            if (gameState.dialogueQueue.length > 0) {
                const nextDialogue = gameState.dialogueQueue.shift();
                if (nextDialogue) {
                    setTimeout(() => showDialogue(nextDialogue), 500);
                }
            } else if (gameState.pendingExit) {
                const exit = gameState.pendingExit;
                gameState.pendingExit = null;
                transitionArea(exit.targetArea, exit.targetX, exit.targetY);
            }
        }
        
        function startOpeningScene() {
            const char = gameState.party[0];
            
            gameState.dialogueQueue = [
                `${char.name}, you're in your dorm room at John Neumaier Hall.`,
                "It's a quiet evening... or so you thought.",
                "Suddenly, you hear a violent crash from the closet.",
                "IZZY SCREAMS!",
                "Something is terribly wrong...",
                "You need to investigate the closet on the right side of the room!"
            ];
            
            showDialogue(gameState.dialogueQueue.shift());
        }
        
        function toggleMenu() {
            const menu = document.getElementById('gameMenu');
            menu.classList.toggle('active');
            gameState.paused = menu.classList.contains('active');
        }
        
        function showStatus() {
            console.log('Status screen coming soon!');
        }
        
        function saveGame() {
            localStorage.setItem('johnNeumaierSave', JSON.stringify(gameState));
            showCombatMessage('Game saved!');
        }
        
        function returnToTitle() {
            if (confirm('Return to title screen?')) {
                window.location.href = 'index.html';
            }
        }
        
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    gameState.keys.up = true;
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    gameState.keys.down = true;
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'a':
                    gameState.keys.left = true;
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    gameState.keys.right = true;
                    e.preventDefault();
                    break;
            }
            
            if (e.key.toLowerCase() === 'e') {
                gameState.keys.interact = true;
            }
            
            if (e.key === ' ' && gameState.inDialogue) {
                e.preventDefault();
                if (gameState.dialogueQueue.length > 0) {
                    showDialogue(gameState.dialogueQueue.shift());
                } else {
                    closeDialogue();
                }
            }
            
            if (e.key === 'Escape' && !gameState.inDialogue && !gameState.combat.active) {
                if (document.getElementById('inventoryScreen').classList.contains('active')) {
                    closeInventory();
                } else {
                    toggleMenu();
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    gameState.keys.up = false;
                    break;
                case 'arrowdown':
                case 's':
                    gameState.keys.down = false;
                    break;
                case 'arrowleft':
                case 'a':
                    gameState.keys.left = false;
                    break;
                case 'arrowright':
                case 'd':
                    gameState.keys.right = false;
                    break;
                case 'e':
                    gameState.keys.interact = false;
                    break;
            }
        });
        
        initGame();
    </script>
</body>
