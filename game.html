<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JN Wonderland - Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 960px;
            height: 680px;
            background: #1a1a2e;
            border: 6px solid #4a4a6a;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(100, 50, 200, 0.3);
            transition: background 1s ease;
        }

        /* ========== CANVAS LAYER ========== */
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated;
            cursor: default;
        }

        /* ========== UI OVERLAY ========== */
        #uiOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* ========== DIALOGUE BOX ========== */
        #dialogueBox {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 750px;
            background: rgba(10, 10, 21, 0.92);
            border: 4px solid #4a4a6a;
            padding: 15px 20px;
            color: #d4d4f0;
            font-size: 10px;
            line-height: 2;
            backdrop-filter: blur(4px);
            pointer-events: auto;
            display: none;
            z-index: 20;
            min-height: 100px;
        }

        #dialogueBox .speaker {
            color: #ffd93d;
            font-size: 8px;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        #dialogueBox .dialogue {
            color: #e8e8f0;
            font-size: 10px;
        }

        #dialogueBox .dialogue .highlight { color: #ffd93d; }
        #dialogueBox .dialogue .creepy { color: #ff6b6b; }
        #dialogueBox .dialogue .good { color: #4aff8a; }

        #dialogueBox .continue {
            color: #4a4a6a;
            font-size: 7px;
            text-align: right;
            margin-top: 6px;
            animation: blink 1s infinite;
        }

        #dialogueBox .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
            pointer-events: auto;
        }

        #dialogueBox .game-btn {
            background: #2a2a4a;
            border: 3px solid #4a4a6a;
            color: #d4d4f0;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            min-width: 80px;
        }

        #dialogueBox .game-btn:hover {
            background: #4a4a7a;
            border-color: #ffd93d;
            color: #ffd93d;
            transform: scale(1.05);
        }

        #dialogueBox .game-btn.primary {
            background: #4a2a4a;
            border-color: #8a4a6a;
            color: #ff9d8a;
        }

        #dialogueBox .game-btn.primary:hover {
            background: #6a3a5a;
            border-color: #ff6b6b;
        }

        #dialogueBox .game-btn.success {
            background: #2a4a2a;
            border-color: #4a8a4a;
            color: #8aff8a;
        }

        #dialogueBox .game-btn.success:hover {
            background: #3a6a3a;
            border-color: #6aff6a;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ========== HUD ========== */
        #hud {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(10, 10, 21, 0.85);
            border: 2px solid #2a2a4a;
            padding: 8px 12px;
            font-size: 7px;
            color: #8888aa;
            text-align: right;
            line-height: 1.8;
            z-index: 15;
            pointer-events: none;
            backdrop-filter: blur(4px);
        }

        #hud .hp { color: #ff6b6b; }
        #hud .step { color: #ffd93d; }
        #hud .items { color: #6ab4ff; }

        /* ========== QUEST LOG ========== */
        #questLog {
            position: absolute;
            top: 10px;
            left: 12px;
            background: rgba(10, 10, 21, 0.85);
            border: 2px solid #2a4a4a;
            padding: 8px 12px;
            font-size: 6px;
            color: #6ac8ff;
            z-index: 15;
            pointer-events: none;
            backdrop-filter: blur(4px);
            max-width: 200px;
            line-height: 1.8;
        }

        #questLog .title {
            color: #ffd93d;
            font-size: 7px;
            margin-bottom: 4px;
        }

        #questLog .step-done {
            color: #4aff8a;
        }

        #questLog .step-active {
            color: #ffd93d;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1000px) {
            #gameContainer { width: 95vw; height: 90vh; }
            #dialogueBox { font-size: 8px; padding: 12px 15px; min-height: 80px; }
            #dialogueBox .game-btn { font-size: 7px; padding: 6px 12px; min-width: 60px; }
            #hud { font-size: 6px; padding: 5px 8px; }
            #questLog { font-size: 5px; padding: 5px 8px; max-width: 150px; }
        }

        @media (max-width: 600px) {
            #dialogueBox { font-size: 7px; padding: 10px 12px; min-height: 70px; bottom: 10px; }
            #dialogueBox .game-btn { font-size: 6px; padding: 4px 8px; min-width: 50px; }
            #hud { font-size: 5px; padding: 3px 6px; top: 5px; right: 6px; }
            #questLog { font-size: 4px; padding: 3px 6px; top: 5px; left: 6px; max-width: 120px; }
        }
    </style>
</head>
<body>

    <!-- ============================================================ -->
    <!-- GAME CONTAINER -->
    <!-- ============================================================ -->
    <div id="gameContainer">

        <!-- Canvas for rendering -->
        <canvas id="gameCanvas"></canvas>

        <!-- HUD -->
        <div id="hud">
            <div class="hp">❤️ HP: <span id="hudHp">20</span>/20</div>
            <div class="step">📍 STEP: <span id="hudStep">0</span>/<span id="hudMaxStep">6</span></div>
            <div class="items">📦 ITEMS: <span id="hudItems">None</span></div>
        </div>

        <!-- Quest Log -->
        <div id="questLog">
            <div class="title">📋 YOUR QUEST</div>
            <div id="questList">
                <div class="step-active">✦ Find the Cat</div>
                <div>✦ Listen to the Cat</div>
                <div>✦ Enter the Closet</div>
                <div>✦ Explore the Hall</div>
                <div>✦ Find the Residents</div>
                <div>✦ Reach the Queen</div>
            </div>
        </div>

        <!-- Dialogue Box -->
        <div id="dialogueBox">
            <div class="speaker" id="dialogueSpeaker">🎮 NARRATOR</div>
            <div class="dialogue" id="dialogueText">Welcome to JN Wonderland...</div>
            <div class="continue" id="dialogueContinue">▼ Press SPACE or click</div>
            <div class="btn-group" id="dialogueButtons" style="display: none;"></div>
        </div>

    </div>

    <!-- ============================================================ -->
    <!-- JAVASCRIPT - COMPLETE ADVENTURE GAME -->
    <!-- ============================================================ -->
    <script>
        // ============================================================
        //  SETUP CANVAS
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let W, H, tileSize;

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            W = canvas.width;
            H = canvas.height;
            tileSize = Math.min(W / 20, H / 15);
            // Ensure tileSize is at least 20px for pixel art
            tileSize = Math.max(tileSize, 20);
            // Recalculate grid
            cols = Math.floor(W / tileSize);
            rows = Math.floor(H / tileSize);
        }

        // ============================================================
        //  PLAYER STATE
        // ============================================================

        let player = {
            name: 'PROTAGONIST',
            hair: 'blonde',
            skin: 'light',
            outfit: 'hoodie',
            hp: 20,
            maxHp: 20,
            wonder: 5,
            // Position (in tiles)
            x: 5,
            y: 8,
            // Movement
            moving: false,
            targetX: 5,
            targetY: 8,
            moveProgress: 0,
            facing: 'down', // up, down, left, right
            // Items
            hasKey: false,
            hasNote: false,
            hasCandy: false,
            hasCrown: false,
            hasMirror: false,
            hasClock: false,
            hasRose: false,
            hasTea: false,
            hasCard: false,
            hasHeart: false,
            // Quest progress
            questStep: 0, // 0-6
            metCat: false,
            talkedToCat: false,
            enteredCloset: false,
            exploredHall: false,
            foundResidents: false,
            reachedQueen: false,
            // Flags
            ianDefeated: false,
            ianBefriended: false,
            queenDefeated: false,
            queenBefriended: false,
            hasMercy: false,
            hasWisdom: false,
            hasCourage: false,
            // Dialogue state
            inDialogue: false,
            dialogueQueue: [],
            // Enemies
            enemiesDefeated: 0,
            // Side characters met
            residentsMet: [],
            // Game state
            gameState: 'exploring', // 'exploring', 'dialogue', 'cutscene'
            ending: 0
        };

        // ============================================================
        //  LOAD PLAYER DATA
        // ============================================================

        function loadPlayerData() {
            const saved = localStorage.getItem('jnPlayerState');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    player.name = data.name || 'PROTAGONIST';
                    player.hair = data.hair || 'blonde';
                    player.skin = data.skin || 'light';
                    player.outfit = data.outfit || 'hoodie';
                } catch (e) { /* ignore */ }
            }
        }
        loadPlayerData();

        // ============================================================
        //  TILE MAP
        // ============================================================

        let cols = 20, rows = 15;
        let map = [];

        // Tile types
        const T = {
            FLOOR: 0,
            WALL: 1,
            DOOR: 2,
            CLOSET: 3,
            CAT: 4,
            RESIDENT: 5,
            ENEMY: 6,
            ITEM: 7,
            EXIT: 8,
            QUEEN: 9,
            IAN: 10,
            CHEST: 11,
            STAIRS: 12
        };

        function buildMap() {
            // Create a simple building floor plan
            // 0 = floor, 1 = wall, 2 = door, 3 = closet, 4 = cat spawn, 5 = resident, 9 = queen, 10 = ian
            map = [];
            for (let r = 0; r < rows; r++) {
                map[r] = [];
                for (let c = 0; c < cols; c++) {
                    // Outer walls
                    if (r === 0 || r === rows - 1 || c === 0 || c === cols - 1) {
                        map[r][c] = T.WALL;
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }

            // Interior walls - create rooms
            // Room 303 area (top left)
            for (let r = 2; r < 6; r++) {
                for (let c = 2; c < 7; c++) {
                    if (r === 2 || r === 5 || c === 2 || c === 6) {
                        if (!(r === 2 && c === 2) && !(r === 2 && c === 3) && !(r === 5 && c === 6)) {
                            map[r][c] = T.WALL;
                        }
                    }
                }
            }
            // Door to Room 303
            map[2][3] = T.DOOR;
            // Closet in Room 303
            map[4][4] = T.CLOSET;

            // Cat spawn location
            map[3][5] = T.CAT;

            // Hallway (center)
            for (let r = 3; r < 12; r++) {
                for (let c = 8; c < 12; c++) {
                    if (r === 3 || r === 11 || c === 8 || c === 11) {
                        if (!(r === 3 && c === 9) && !(r === 11 && c === 9)) {
                            map[r][c] = T.WALL;
                        }
                    }
                }
            }
            // Hallway doors
            map[3][9] = T.DOOR;
            map[11][9] = T.DOOR;

            // Resident rooms (bottom right)
            for (let r = 8; r < 12; r++) {
                for (let c = 14; c < 18; c++) {
                    if (r === 8 || r === 11 || c === 14 || c === 17) {
                        if (!(r === 8 && c === 15) && !(r === 8 && c === 16)) {
                            map[r][c] = T.WALL;
                        }
                    }
                }
            }
            // Resident spawn
            map[10][15] = T.RESIDENT;
            map[10][16] = T.RESIDENT;

            // Ian (bodyguard) location - blocks path to Queen
            map[7][14] = T.IAN;

            // Queen's chamber (bottom right corner)
            for (let r = 11; r < 14; r++) {
                for (let c = 16; c < 19; c++) {
                    if (r === 11 || r === 13 || c === 16 || c === 18) {
                        if (!(r === 11 && c === 17)) {
                            map[r][c] = T.WALL;
                        }
                    }
                }
            }
            map[12][17] = T.QUEEN;

            // Some items scattered
            map[3][10] = T.ITEM;
            map[5][12] = T.ITEM;
            map[9][13] = T.ITEM;
            map[6][16] = T.CHEST;

            // Exit (top right)
            map[1][cols - 2] = T.EXIT;
        }

        // ============================================================
        //  GAME OBJECTS
        // ============================================================

        let objects = [];
        let npcs = [];
        let items = [];

        // NPC definitions
        const npcDefs = {
            cat: {
                name: '🐱 THE CAT',
                x: 3,
                y: 5,
                sprite: 'cat',
                dialogues: {
                    first: [
                        'You hear a soft meow behind you.',
                        'A cat sits on the floor, watching you with bright eyes.',
                        '"You look lost, human. Let me help you."',
                        '"I\'m the guide of this place. I know all the secrets."',
                        '"To escape Wonderland, you must complete 6 steps."',
                        '"Step 1: Find the closet in Room 303 and enter it."',
                        '"Step 2: Explore the endless hallway."',
                        '"Step 3: Find the former residents and help them."',
                        '"Step 4: Defeat or befriend the bodyguard, Ian."',
                        '"Step 5: Face the Queen of the Desk."',
                        '"Step 6: Choose your fate and escape."',
                        '"Good luck, human. You\'ll need it."',
                        'The cat vanishes with a flick of its tail.'
                    ],
                    later: [
                        '"You\'re making progress! Keep going!"',
                        '"Remember: be kind to the residents. They have stories to tell."',
                        '"The Queen is powerful, but she has a weakness..."',
                        '"Find the heart of Wonderland. It will guide you."'
                    ]
                }
            },
            residents: [
                {
                    id: 'sarah',
                    name: '👻 SARAH',
                    room: '301',
                    x: 10,
                    y: 15,
                    dialogues: {
                        first: '"Oh! A visitor! I\'m Sarah from Room 301."',
                        help: '"I was a librarian before the Queen trapped us here."',
                        gift: '📜 NOTE',
                        giftDesc: 'Sarah\'s journal. It has clues about the Queen.'
                    }
                },
                {
                    id: 'mark',
                    name: '🧙‍♂️ MARK',
                    room: '302',
                    x: 10,
                    y: 16,
                    dialogues: {
                        first: '"I\'m Mark. I was a magician. Now I\'m just stuck."',
                        help: '"I tried to escape and got trapped. But I learned things."',
                        gift: '🪞 MIRROR',
                        giftDesc: 'Mark\'s magic mirror. It reveals hidden truths.'
                    }
                }
            ]
        };

        // ============================================================
        //  SPRITE RENDERER
        // ============================================================

        function drawPixelSprite(ctx, x, y, size, hair, skin, outfit, facing) {
            // Simplified pixel character
            const s = size / 12;
            const colors = {
                skin: skin === 'light' ? '#f5d0b8' :
                      skin === 'medium' ? '#d4a574' :
                      skin === 'dark' ? '#8d6b4b' : '#c4a882',
                hair: hair === 'blonde' ? '#f5d742' :
                      hair === 'brown' ? '#8b6b4a' :
                      hair === 'black' ? '#2a2a2a' :
                      hair === 'red' ? '#c0392b' : '#ff6b9d',
                outfit: outfit === 'hoodie' ? '#4a7a9c' :
                       outfit === 'sweater' ? '#8b5a2b' :
                       outfit === 'jacket' ? '#2d3d4a' : '#c0392b',
                eye: '#f0f0f0',
                pupil: '#1a1a2e'
            };

            // Draw body
            ctx.fillStyle = colors.outfit;
            ctx.fillRect(x + s * 2, y + s * 5, s * 8, s * 7);

            // Draw head
            ctx.fillStyle = colors.skin;
            ctx.fillRect(x + s * 3, y + s * 1, s * 6, s * 4);

            // Draw hair
            ctx.fillStyle = colors.hair;
            ctx.fillRect(x + s * 2, y + s * 0, s * 8, s * 2);
            ctx.fillRect(x + s * 1, y + s * 2, s * 2, s * 1);
            ctx.fillRect(x + s * 9, y + s * 2, s * 2, s * 1);

            // Draw eyes
            ctx.fillStyle = colors.eye;
            ctx.fillRect(x + s * 4, y + s * 2, s * 1.5, s * 1.5);
            ctx.fillRect(x + s * 6.5, y + s * 2, s * 1.5, s * 1.5);
            ctx.fillStyle = colors.pupil;
            ctx.fillRect(x + s * 4.5, y + s * 2.5, s * 0.8, s * 0.8);
            ctx.fillRect(x + s * 7, y + s * 2.5, s * 0.8, s * 0.8);

            // Draw mouth (small smile)
            ctx.fillStyle = '#8b6b4a';
            ctx.fillRect(x + s * 5, y + s * 3.5, s * 2, s * 0.5);

            // Draw legs
            ctx.fillStyle = colors.outfit;
            ctx.fillRect(x + s * 3, y + s * 12, s * 2, s * 2);
            ctx.fillRect(x + s * 7, y + s * 12, s * 2, s * 2);

            // Draw shoes
            ctx.fillStyle = '#2a2a2a';
            ctx.fillRect(x + s * 2.5, y + s * 14, s * 3, s * 1);
            ctx.fillRect(x + s * 6.5, y + s * 14, s * 3, s * 1);

            // Direction indicator (tiny arrow)
            if (facing === 'up') {
                ctx.fillStyle = '#ffd93d';
                ctx.beginPath();
                ctx.moveTo(x + s * 6, y - s * 2);
                ctx.lineTo(x + s * 4, y + s * 0);
                ctx.lineTo(x + s * 8, y + s * 0);
                ctx.fill();
            } else if (facing === 'down') {
                ctx.fillStyle = '#ffd93d';
                ctx.beginPath();
                ctx.moveTo(x + s * 6, y + s * 17);
                ctx.lineTo(x + s * 4, y + s * 15);
                ctx.lineTo(x + s * 8, y + s * 15);
                ctx.fill();
            } else if (facing === 'left') {
                ctx.fillStyle = '#ffd93d';
                ctx.beginPath();
                ctx.moveTo(x - s * 2, y + s * 8);
                ctx.lineTo(x + s * 0, y + s * 6);
                ctx.lineTo(x + s * 0, y + s * 10);
                ctx.fill();
            } else {
                ctx.fillStyle = '#ffd93d';
                ctx.beginPath();
                ctx.moveTo(x + s * 14, y + s * 8);
                ctx.lineTo(x + s * 12, y + s * 6);
                ctx.lineTo(x + s * 12, y + s * 10);
                ctx.fill();
            }
        }

        function drawCat(ctx, x, y, size) {
            const s = size / 12;
            // Body
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.ellipse(x + s * 6, y + s * 6, s * 4, s * 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.ellipse(x + s * 6, y + s * 3, s * 3, s * 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.moveTo(x + s * 3.5, y + s * 1);
            ctx.lineTo(x + s * 2, y - s * 1);
            ctx.lineTo(x + s * 4.5, y + s * 0.5);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + s * 8.5, y + s * 1);
            ctx.lineTo(x + s * 10, y - s * 1);
            ctx.lineTo(x + s * 7.5, y + s * 0.5);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.ellipse(x + s * 4.5, y + s * 3, s * 0.8, s * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + s * 7.5, y + s * 3, s * 0.8, s * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pupils (slits)
            ctx.fillStyle = '#4a8a4a';
            ctx.fillRect(x + s * 4.3, y + s * 2.5, s * 0.4, s * 1.5);
            ctx.fillRect(x + s * 7.3, y + s * 2.5, s * 0.4, s * 1.5);

            // Nose
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(x + s * 6, y + s * 3.8, s * 0.5, 0, Math.PI * 2);
            ctx.fill();

            // Mouth (grin)
            ctx.strokeStyle = '#1a1a2e';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(x + s * 6, y + s * 4.2, s * 1.5, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // Tail
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.moveTo(x + s * 10, y + s * 6);
            ctx.quadraticCurveTo(x + s * 12, y + s * 3, x + s * 11, y + s * 1);
            ctx.lineWidth = s * 1.5;
            ctx.strokeStyle = '#ff8a4a';
            ctx.stroke();
        }

        function drawEnemy(ctx, x, y, size, type) {
            const s = size / 12;
            // Simple enemy sprite
            ctx.fillStyle = '#ff2a2a';
            ctx.beginPath();
            ctx.arc(x + s * 6, y + s * 6, s * 4, 0, Math.PI * 2);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(x + s * 4, y + s * 4.5, s * 1.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + s * 8, y + s * 4.5, s * 1.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#1a1a2e';
            ctx.beginPath();
            ctx.arc(x + s * 4.5, y + s * 4.5, s * 0.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + s * 8.5, y + s * 4.5, s * 0.8, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(x + s * 4, y + s * 7, s * 4, s * 1);

            // Label
            ctx.fillStyle = '#ffffff';
            ctx.font = `${s * 1.5}px monospace`;
            ctx.textAlign = 'center';
            ctx.fillText(type || '!', x + s * 6, y + s * 11);
        }

        // ============================================================
        //  RENDER GAME
        // ============================================================

        let cameraX = 0, cameraY = 0;

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Calculate camera to follow player
            const targetCamX = player.x * tileSize - W / 2 + tileSize / 2;
            const targetCamY = player.y * tileSize - H / 2 + tileSize / 2;
            cameraX += (targetCamX - cameraX) * 0.1;
            cameraY += (targetCamY - cameraY) * 0.1;

            // Draw map
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * tileSize - cameraX;
                    const y = r * tileSize - cameraY;

                    // Skip if off screen
                    if (x < -tileSize || x > W + tileSize || y < -tileSize || y > H + tileSize) continue;

                    const tile = map[r][c];
                    if (tile === T.WALL) {
                        ctx.fillStyle = '#2a2a4a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.strokeStyle = '#3a3a5a';
                        ctx.lineWidth = 1;
                        ctx.strokeRect(x, y, tileSize, tileSize);
                    } else if (tile === T.FLOOR) {
                        // Floor pattern - subtle checker
                        ctx.fillStyle = (r + c) % 2 === 0 ? '#1a1a2e' : '#1e1e32';
                        ctx.fillRect(x, y, tileSize, tileSize);
                    } else if (tile === T.DOOR) {
                        ctx.fillStyle = '#4a3a2a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#8a7a5a';
                        ctx.fillRect(x + tileSize * 0.3, y + tileSize * 0.1, tileSize * 0.4, tileSize * 0.8);
                        ctx.fillStyle = '#ffd93d';
                        ctx.fillRect(x + tileSize * 0.45, y + tileSize * 0.4, tileSize * 0.1, tileSize * 0.2);
                    } else if (tile === T.CLOSET) {
                        ctx.fillStyle = '#1a1a2e';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#3a2a4a';
                        ctx.fillRect(x + tileSize * 0.1, y + tileSize * 0.1, tileSize * 0.8, tileSize * 0.8);
                        // Glow effect
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize * 0.6);
                        grad.addColorStop(0, 'rgba(255, 217, 61, 0.3)');
                        grad.addColorStop(1, 'rgba(255, 217, 61, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x, y, tileSize, tileSize);
                        // Closet text
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🚪', x + tileSize/2, y + tileSize * 0.7);
                    } else if (tile === T.ITEM) {
                        ctx.fillStyle = '#1a1a2e';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.5}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('✨', x + tileSize/2, y + tileSize * 0.7);
                    } else if (tile === T.CHEST) {
                        ctx.fillStyle = '#2a1a0a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#8a6a3a';
                        ctx.fillRect(x + tileSize * 0.1, y + tileSize * 0.2, tileSize * 0.8, tileSize * 0.6);
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('📦', x + tileSize/2, y + tileSize * 0.7);
                    } else if (tile === T.EXIT) {
                        ctx.fillStyle = '#0a1a0a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#4aff8a';
                        ctx.font = `${tileSize * 0.5}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🚪', x + tileSize/2, y + tileSize * 0.7);
                    } else if (tile === T.QUEEN) {
                        ctx.fillStyle = '#2a0a0a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#ff4a4a';
                        ctx.font = `${tileSize * 0.6}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('👑', x + tileSize/2, y + tileSize * 0.7);
                        // Red glow
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize);
                        grad.addColorStop(0, 'rgba(255, 0, 0, 0.1)');
                        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x - tileSize, y - tileSize, tileSize * 3, tileSize * 3);
                    } else if (tile === T.IAN) {
                        ctx.fillStyle = '#0a1a0a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#8aba4a';
                        ctx.font = `${tileSize * 0.6}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('💪', x + tileSize/2, y + tileSize * 0.7);
                    } else if (tile === T.RESIDENT) {
                        ctx.fillStyle = '#1a0a1a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#6ab4ff';
                        ctx.font = `${tileSize * 0.5}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('👩', x + tileSize/2, y + tileSize * 0.7);
                    } else if (tile === T.CAT) {
                        // Draw cat
                        drawCat(ctx, x, y, tileSize);
                    }
                }
            }

            // Draw player
            const px = player.x * tileSize - cameraX;
            const py = player.y * tileSize - cameraY;
            if (px > -tileSize && px < W + tileSize && py > -tileSize && py < H + tileSize) {
                drawPixelSprite(ctx, px, py, tileSize, player.hair, player.skin, player.outfit, player.facing);
            }

            // Draw UI labels
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(10, H - 30, 200, 20);
            ctx.fillStyle = '#8888aa';
            ctx.font = '10px monospace';
            ctx.textAlign = 'left';
            ctx.fillText(`📍 ${player.x}, ${player.y} | Step ${player.questStep}/6`, 15, H - 15);

            // Draw interaction indicator (if near interactive tile)
            const nearby = getNearbyInteractive();
            if (nearby && player.gameState === 'exploring') {
                ctx.fillStyle = 'rgba(255,217,61,0.3)';
                ctx.fillRect(nearby.x * tileSize - cameraX, nearby.y * tileSize - cameraY - 20, tileSize, 20);
                ctx.fillStyle = '#ffd93d';
                ctx.font = '8px monospace';
                ctx.textAlign = 'center';
                ctx.fillText('🔹 Press SPACE', nearby.x * tileSize - cameraX + tileSize/2, nearby.y * tileSize - cameraY - 6);
            }
        }

        // ============================================================
        //  INTERACTION SYSTEM
        // ============================================================

        function getNearbyInteractive() {
            const directions = [
                { dx: 0, dy: -1 }, // up
                { dx: 0, dy: 1 },  // down
                { dx: -1, dy: 0 }, // left
                { dx: 1, dy: 0 }   // right
            ];

            for (const dir of directions) {
                const nx = player.x + dir.dx;
                const ny = player.y + dir.dy;
                if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                    const tile = map[ny][nx];
                    if (tile === T.DOOR || tile === T.CLOSET || tile === T.ITEM || 
                        tile === T.CHEST || tile === T.EXIT || tile === T.QUEEN || 
                        tile === T.IAN || tile === T.RESIDENT || tile === T.CAT) {
                        return { x: nx, y: ny, tile: tile };
                    }
                }
            }
            return null;
        }

        // ============================================================
        //  DIALOGUE SYSTEM
        // ============================================================

        let dialogueCallback = null;

        function showDialogue(speaker, text, choices = null, callback = null) {
            const box = document.getElementById('dialogueBox');
            const speakerEl = document.getElementById('dialogueSpeaker');
            const textEl = document.getElementById('dialogueText');
            const continueEl = document.getElementById('dialogueContinue');
            const buttonsEl = document.getElementById('dialogueButtons');

            box.style.display = 'block';
            speakerEl.textContent = speaker;
            textEl.innerHTML = text;
            continueEl.style.display = 'none';
            buttonsEl.style.display = 'none';

            if (choices && choices.length > 0) {
                buttonsEl.style.display = 'flex';
                buttonsEl.innerHTML = '';
                for (const choice of choices) {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn ' + (choice.class || '');
                    btn.textContent = choice.label;
                    btn.onclick = function() {
                        if (choice.action) choice.action();
                        if (callback) callback(choice.value);
                    };
                    buttonsEl.appendChild(btn);
                }
            } else {
                continueEl.style.display = 'block';
                continueEl.textContent = '▼ Press SPACE or click to continue';
            }

            dialogueCallback = callback;
            player.inDialogue = true;
            player.gameState = 'dialogue';

            // Click to continue
            box.onclick = function(e) {
                if (e.target === box || e.target === textEl || e.target === continueEl) {
                    if (continueEl.style.display !== 'none') {
                        continueDialogue();
                    }
                }
            };
        }

        function continueDialogue() {
            if (dialogueCallback) {
                const cb = dialogueCallback;
                dialogueCallback = null;
                cb();
            } else {
                closeDialogue();
            }
        }

        function closeDialogue() {
            document.getElementById('dialogueBox').style.display = 'none';
            player.inDialogue = false;
            player.gameState = 'exploring';
            dialogueCallback = null;
            updateUI();
        }

        // Keyboard support
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (player.inDialogue) {
                    const continueEl = document.getElementById('dialogueContinue');
                    if (continueEl.style.display !== 'none') {
                        continueDialogue();
                    }
                } else if (player.gameState === 'exploring') {
                    interact();
                }
            }

            // Movement with arrow keys / WASD
            if (!player.inDialogue && player.gameState === 'exploring') {
                let dx = 0, dy = 0;
                if (e.key === 'ArrowUp' || e.key === 'w') { dy = -1; player.facing = 'up'; }
                if (e.key === 'ArrowDown' || e.key === 's') { dy = 1; player.facing = 'down'; }
                if (e.key === 'ArrowLeft' || e.key === 'a') { dx = -1; player.facing = 'left'; }
                if (e.key === 'ArrowRight' || e.key === 'd') { dx = 1; player.facing = 'right'; }

                if (dx !== 0 || dy !== 0) {
                    e.preventDefault();
                    tryMove(dx, dy);
                }
            }
        });

        // ============================================================
        //  MOVEMENT SYSTEM
        // ============================================================

        let moveQueue = [];

        function tryMove(dx, dy) {
            if (player.moving) {
                moveQueue.push({ dx, dy });
                return;
            }

            const nx = player.x + dx;
            const ny = player.y + dy;

            // Check bounds
            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return;

            // Check if walkable
            const tile = map[ny][nx];
            if (tile === T.WALL) {
                // Bump sound effect (visual only)
                return;
            }

            // Move player
            player.x = nx;
            player.y = ny;
            player.facing = dx === 0 ? (dy === -1 ? 'up' : dy === 1 ? 'down' : player.facing) :
                             dx === -1 ? 'left' : 'right';

            updateUI();

            // Check for interactions after move
            checkAutoInteract();
        }

        function checkAutoInteract() {
            const nearby = getNearbyInteractive();
            if (nearby) {
                // Auto-trigger certain interactions
                if (nearby.tile === T.CAT && !player.metCat) {
                    meetCat();
                }
                if (nearby.tile === T.CLOSET && player.metCat && !player.enteredCloset) {
                    // Show hint
                    showDialogue('💡 HINT', 'Press SPACE to enter the closet.');
                }
                if (nearby.tile === T.RESIDENT && player.questStep >= 2) {
                    // Will be handled by interact()
                }
                if (nearby.tile === T.IAN && player.questStep >= 3) {
                    // Will be handled by interact()
                }
                if (nearby.tile === T.QUEEN && player.questStep >= 5) {
                    // Will be handled by interact()
                }
            }
        }

        function interact() {
            if (player.inDialogue) return;

            const nearby = getNearbyInteractive();
            if (!nearby) {
                showDialogue('💡 HINT', 'There\'s nothing to interact with here. Try exploring!');
                setTimeout(closeDialogue, 1500);
                return;
            }

            const { x, y, tile } = nearby;

            switch (tile) {
                case T.CAT:
                    meetCat();
                    break;
                case T.CLOSET:
                    enterCloset();
                    break;
                case T.DOOR:
                    openDoor(x, y);
                    break;
                case T.ITEM:
                    pickUpItem(x, y);
                    break;
                case T.CHEST:
                    openChest(x, y);
                    break;
                case T.RESIDENT:
                    talkToResident(x, y);
                    break;
                case T.IAN:
                    faceIan();
                    break;
                case T.QUEEN:
                    faceQueen();
                    break;
                case T.EXIT:
                    escapeWonderland();
                    break;
                default:
                    showDialogue('💡 HINT', 'You can\'t interact with that right now.');
                    setTimeout(closeDialogue, 1500);
            }
        }

        // ============================================================
        //  QUEST STEPS
        // ============================================================

        const questSteps = [
            { id: 'meetCat', label: 'Find the Cat' },
            { id: 'talkCat', label: 'Listen to the Cat' },
            { id: 'enterCloset', label: 'Enter the Closet' },
            { id: 'exploreHall', label: 'Explore the Hall' },
            { id: 'findResidents', label: 'Find the Residents' },
            { id: 'defeatIan', label: 'Face the Bodyguard' },
            { id: 'defeatQueen', label: 'Reach the Queen' }
        ];

        function updateQuestLog() {
            const list = document.getElementById('questList');
            let html = '';
            for (let i = 0; i < questSteps.length; i++) {
                const step = questSteps[i];
                let cls = '';
                if (i < player.questStep) cls = 'step-done';
                else if (i === player.questStep) cls = 'step-active';
                html += `<div class="${cls}">${i < player.questStep ? '✅' : '✦'} ${step.label}</div>`;
            }
            list.innerHTML = html;
        }

        // ============================================================
        //  STORY EVENTS
        // ============================================================

        // --- MEET THE CAT ---
        function meetCat() {
            if (player.metCat) {
                showDialogue('🐱 THE CAT', '"You\'re doing well, human. Keep going!"');
                setTimeout(closeDialogue, 1500);
                return;
            }

            player.metCat = true;
            player.questStep = Math.max(player.questStep, 1);

            showDialogue('🐱 THE CAT', 
                '"You hear a soft meow. A cat sits on the floor, watching you with bright eyes."<br><br>' +
                '"I\'m the guide of this place. To escape Wonderland, you must complete 6 steps."<br><br>' +
                '<span class="highlight">Step 1: Find the closet in Room 303 and enter it.</span><br>' +
                '<span class="highlight">Step 2: Explore the endless hallway.</span><br>' +
                '<span class="highlight">Step 3: Find the former residents and help them.</span><br>' +
                '<span class="highlight">Step 4: Defeat or befriend the bodyguard, Ian.</span><br>' +
                '<span class="highlight">Step 5: Face the Queen of the Desk.</span><br>' +
                '<span class="highlight">Step 6: Choose your fate and escape.</span><br><br>' +
                '"Good luck, human. You\'ll need it."',
                [{ label: '🐱 Thank you!', value: 'thanks' }],
                function() {
                    player.talkedToCat = true;
                    player.questStep = Math.max(player.questStep, 2);
                    updateUI();
                    closeDialogue();
                    showDialogue('🐱 THE CAT', 'The cat vanishes with a flick of its tail.');
                    setTimeout(closeDialogue, 1500);
                    // Remove cat from map
                    map[3][5] = T.FLOOR;
                    updateUI();
                }
            );
        }

        // --- ENTER CLOSET ---
        function enterCloset() {
            if (player.enteredCloset) {
                showDialogue('🌀 THE CLOSET', 'The closet is still glowing, but you\'ve already been through it.');
                setTimeout(closeDialogue, 1500);
                return;
            }

            if (!player.metCat) {
                showDialogue('💡 HINT', 'You should find the cat first. It might have answers.');
                setTimeout(closeDialogue, 1500);
                return;
            }

            player.enteredCloset = true;
            player.questStep = Math.max(player.questStep, 3);
            player.wonder += 10;

            showDialogue('🌀 THE CLOSET',
                'You step into the closet. There\'s no back wall.<br>' +
                'Just a long, dark tunnel stretching into infinity...<br><br>' +
                'You walk forward. And forward. And forward...<br><br>' +
                '<span class="highlight">✦ You emerge into a strange hallway ✦</span><br>' +
                '<span class="good">✦ +10 WONDER ✦</span>',
                [{ label: '🌀 Enter Wonderland', value: 'enter' }],
                function() {
                    player.questStep = Math.max(player.questStep, 4);
                    // Move player to hallway
                    player.x = 8;
                    player.y = 7;
                    // Update map - closet is now just a closet
                    map[4][4] = T.FLOOR;
                    updateUI();
                    closeDialogue();
                    showDialogue('🏚️ THE WORN HALL',
                        'The hallway stretches <span class="creepy">infinitely</span> in both directions.<br>' +
                        'The walls pulse like they\'re breathing.<br>' +
                        '<span class="highlight">✦ You feel like you\'re being watched ✦</span><br><br>' +
                        'The cat appears beside you.<br>' +
                        '"Welcome to Wonderland proper. Your journey begins now."'
                    );
                    setTimeout(closeDialogue, 3000);
                    // Add some items to the map
                    map[3][10] = T.ITEM;
                    map[5][12] = T.ITEM;
                    updateUI();
                }
            );
        }

        // --- OPEN DOOR ---
        function openDoor(x, y) {
            // Random event when opening doors
            const events = [
                'You open the door. It\'s just a closet. Nothing special.',
                'You open the door. A gust of wind blows through. <span class="creepy">✦ Strange ✦</span>',
                'You open the door. You find a <span class="highlight">piece of candy</span> on the floor!',
                'You open the door. A cat walks out. It looks at you, then walks away.',
                'You open the door. It leads to another hallway. <span class="wonder">✦ This place is confusing ✦</span>'
            ];

            const event = events[Math.floor(Math.random() * events.length)];
            showDialogue('🚪 DOOR', event);
            setTimeout(closeDialogue, 1500);

            if (event.includes('candy')) {
                player.hasCandy = true;
                updateUI();
            }
        }

        // --- PICK UP ITEM ---
        function pickUpItem(x, y) {
            const items = [
                { name: '📜 Note', flag: 'hasNote' },
                { name: '💊 Candy', flag: 'hasCandy' },
                { name: '🔑 Key', flag: 'hasKey' },
                { name: '🌹 Rose', flag: 'hasRose' },
                { name: '🍵 Tea', flag: 'hasTea' }
            ];

            const item = items[Math.floor(Math.random() * items.length)];
            if (!player[item.flag]) {
                player[item.flag] = true;
                showDialogue('✨ ITEM FOUND', `You found <span class="highlight">${item.name}</span>!`);
                setTimeout(closeDialogue, 1500);
                map[y][x] = T.FLOOR;
                updateUI();
            } else {
                showDialogue('✨ ITEM', 'There\'s nothing here.');
                setTimeout(closeDialogue, 1500);
            }
        }

        // --- OPEN CHEST ---
        function openChest(x, y) {
            const chestItems = [
                { name: '👑 Crown', flag: 'hasCrown' },
                { name: '🪞 Mirror', flag: 'hasMirror' },
                { name: '⏰ Clock', flag: 'hasClock' },
                { name: '🃏 Card', flag: 'hasCard' },
                { name: '❤️ Heart', flag: 'hasHeart' }
            ];

            const item = chestItems[Math.floor(Math.random() * chestItems.length)];
            if (!player[item.flag]) {
                player[item.flag] = true;
                player.wonder += 5;
                showDialogue('📦 CHEST', `You open the chest and find <span class="highlight">${item.name}</span>!<br><span class="good">✦ +5 WONDER ✦</span>`);
                setTimeout(closeDialogue, 2000);
                map[y][x] = T.FLOOR;
                updateUI();
            } else {
                showDialogue('📦 CHEST', 'The chest is empty.');
                setTimeout(closeDialogue, 1500);
            }
        }

        // --- TALK TO RESIDENT ---
        function talkToResident(x, y) {
            if (player.residentsMet.length >= 2) {
                showDialogue('🏠 RESIDENT', '"You\'ve helped all of us. Thank you."');
                setTimeout(closeDialogue, 1500);
                return;
            }

            const residentData = [
                { name: '👻 SARAH', room: '301', text: '"I was a librarian before the Queen trapped us here."' },
                { name: '🧙‍♂️ MARK', room: '302', text: '"I tried to escape and got trapped. But I learned things."' },
                { name: '🎨 LISA', room: '304', text: '"The colors here are alive. They remember who painted them."' },
                { name: '🎵 JAMES', room: '305', text: '"Ian wasn\'t always like this. The Queen corrupted him."' }
            ];

            const available = residentData.filter(r => !player.residentsMet.includes(r.name));
            if (available.length === 0) {
                showDialogue('🏠 RESIDENT', '"You\'ve met everyone! Good luck with the Queen."');
                setTimeout(closeDialogue, 1500);
                return;
            }

            const resident = available[Math.floor(Math.random() * available.length)];
            player.residentsMet.push(resident.name);
            player.questStep = Math.max(player.questStep, 5);
            player.wonder += 5;

            showDialogue(`🏠 ${resident.name} (Room ${resident.room})`,
                `${resident.text}<br><br>` +
                `<span class="good">✦ You helped a former resident ✦</span><br>` +
                `<span class="highlight">✦ +5 WONDER ✦</span>`,
                [{ label: '🤝 Help them', value: 'help' }],
                function() {
                    player.hasMercy = true;
                    player.wonder += 5;
                    updateUI();
                    closeDialogue();
                    showDialogue(`🏠 ${resident.name}`, 
                        '"Thank you! Here, take this."<br>' +
                        `You receive <span class="highlight">a gift</span> from ${resident.name}.`
                    );
                    setTimeout(closeDialogue, 2000);
                    // Remove resident from map
                    map[y][x] = T.FLOOR;
                    updateUI();
                }
            );
        }

        // --- FACE IAN (Bodyguard) ---
        function faceIan() {
            if (player.ianDefeated || player.ianBefriended) {
                showDialogue('💪 IAN', '"You already dealt with me, human. Go on."');
                setTimeout(closeDialogue, 1500);
                return;
            }

            if (player.questStep < 4) {
                showDialogue('💪 IAN', '"You\'re not ready to face me yet, human. Complete your quest first."');
                setTimeout(closeDialogue, 1500);
                return;
            }

            showDialogue('💪 IAN - QUEEN\'S BODYGUARD',
                '<span style="color: #8aba4a; font-size: 14px;">"YOU SHALL NOT PASS!"</span><br>' +
                'Ian blocks your path to the Queen.<br>' +
                'His muscles bulge. He\'s ready for battle.<br><br>' +
                'How do you approach him?',
                [
                    { label: '⚔️ Fight', value: 'fight', class: 'danger' },
                    { label: '💬 Talk', value: 'talk' },
                    { label: '🎭 Prank', value: 'prank', class: 'wonder' },
                    { label: '🕊️ Spare', value: 'spare', class: 'success' }
                ],
                function(choice) {
                    handleIanChoice(choice);
                }
            );
        }

        function handleIanChoice(choice) {
            closeDialogue();

            switch (choice) {
                case 'fight':
                    if (player.hasSword || player.hasCrown || player.enemiesDefeated > 3) {
                        player.ianDefeated = true;
                        player.questStep = Math.max(player.questStep, 6);
                        showDialogue('⚔️ BATTLE',
                            'You fight Ian with all your might!<br>' +
                            'He\'s strong, but you\'re stronger.<br>' +
                            '<span class="good">✦ IAN IS DEFEATED! ✦</span><br>' +
                            '<span style="color: #8aba4a;">"You\'re stronger than you look, human. Go on."</span>'
                        );
                        setTimeout(closeDialogue, 3000);
                        map[7][14] = T.FLOOR;
                    } else {
                        showDialogue('⚔️ BATTLE',
                            'You fight Ian, but he\'s too strong!<br>' +
                            '<span class="creepy">✦ You lose 5 HP ✦</span><br>' +
                            '<span style="color: #8888aa;">You need more power. Defeat enemies and find items.</span>'
                        );
                        player.hp -= 5;
                        setTimeout(closeDialogue, 3000);
                    }
                    break;

                case 'talk':
                    player.ianBefriended = true;
                    player.questStep = Math.max(player.questStep, 6);
                    showDialogue('💬 TALK',
                        'You talk to Ian. He seems sad.<br>' +
                        '<span style="color: #8aba4a;">"...The Queen corrupted me. But I see you\'re different."</span><br>' +
                        '<span class="good">✦ IAN LETS YOU PASS ✦</span>'
                    );
                    setTimeout(closeDialogue, 3000);
                    map[7][14] = T.FLOOR;
                    break;

                case 'prank':
                    player.ianBefriended = true;
                    player.questStep = Math.max(player.questStep, 6);
                    showDialogue('🎭 PRANK',
                        'You yell <span style="color: #ffd93d;">"MY MOM!"</span><br>' +
                        'Ian freezes. Tears well up in his eyes.<br>' +
                        '<span style="color: #8aba4a;">"Bro... that\'s my mom\'s catchphrase..."</span><br>' +
                        '<span class="good">✦ IAN LETS YOU PASS ✦</span>'
                    );
                    setTimeout(closeDialogue, 3000);
                    map[7][14] = T.FLOOR;
                    break;

                case 'spare':
                    player.ianBefriended = true;
                    player.questStep = Math.max(player.questStep, 6);
                    player.hasMercy = true;
                    showDialogue('🕊️ SPARE',
                        'You put your hands up. <span style="color: #ffd93d;">"I don\'t want to fight."</span><br>' +
                        'Ian stares at you. His muscles deflate.<br>' +
                        '<span style="color: #8aba4a;">"...You\'re not like the others."</span><br>' +
                        '<span class="good">✦ IAN LETS YOU PASS ✦</span>'
                    );
                    setTimeout(closeDialogue, 3000);
                    map[7][14] = T.FLOOR;
                    break;
            }
            updateUI();
        }

        // --- FACE QUEEN ---
        function faceQueen() {
            if (player.queenDefeated || player.queenBefriended) {
                showDialogue('👑 THE QUEEN', '"You\'ve already defeated me. What more do you want?"');
                setTimeout(closeDialogue, 1500);
                return;
            }

            if (player.questStep < 5) {
                showDialogue('👑 THE QUEEN', '"You\'re not ready to face me yet, human. Complete your quest first."');
                setTimeout(closeDialogue, 1500);
                return;
            }

            if (!player.ianDefeated && !player.ianBefriended) {
                showDialogue('👑 THE QUEEN', '"You must defeat Ian first to reach me!"');
                setTimeout(closeDialogue, 1500);
                return;
            }

            showDialogue('👑 QUEEN RYLEE - FINAL BOSS',
                '<span style="color: #ff4a4a; font-size: 14px;">"YOU DARE FACE ME?"</span><br>' +
                'The Queen rises from her desk. The room shakes.<br>' +
                'She\'s the most powerful being in Wonderland.<br><br>' +
                'How do you approach her?',
                [
                    { label: '⚔️ Fight', value: 'fight', class: 'danger' },
                    { label: '💬 Talk', value: 'talk' },
                    { label: '🌀 Wonder', value: 'wonder', class: 'wonder' },
                    { label: '🕊️ Spare', value: 'spare', class: 'success' }
                ],
                function(choice) {
                    handleQueenChoice(choice);
                }
            );
        }

        function handleQueenChoice(choice) {
            closeDialogue();

            switch (choice) {
                case 'fight':
                    if (player.hasSword && player.hasCrown) {
                        player.queenDefeated = true;
                        player.questStep = 7;
                        showDialogue('⚔️ FINAL BATTLE',
                            'You fight the Queen with all your power!<br>' +
                            'Your sword glows. Your crown shines.<br>' +
                            '<span class="good">✦ THE QUEEN IS DEFEATED! ✦</span><br>' +
                            '<span style="color: #ffd93d;">Wonderland is free!</span>'
                        );
                        setTimeout(() => {
                            closeDialogue();
                            showEnding('good', 'Warrior Ending',
                                'You defeated the Queen through strength and courage.<br>' +
                                'Wonderland is free from her tyranny.<br><br>' +
                                '<span class="highlight">✦ You escaped, but you carry the lessons of Wonderland forever ✦</span>'
                            );
                        }, 2000);
                    } else {
                        showDialogue('⚔️ FINAL BATTLE',
                            'You fight the Queen, but she\'s too powerful!<br>' +
                            '<span class="creepy">✦ You lose 5 HP ✦</span><br>' +
                            '<span style="color: #8888aa;">You need the sword and crown to defeat her.</span>'
                        );
                        player.hp -= 5;
                        setTimeout(closeDialogue, 3000);
                    }
                    break;

                case 'talk':
                    if (player.hasWisdom) {
                        player.queenBefriended = true;
                        player.questStep = 7;
                        showDialogue('💬 TALK',
                            'You talk to the Queen. You tell her about the residents.<br>' +
                            'She listens. Her expression softens.<br>' +
                            '<span style="color: #ff4a4a;">"...I forgot what it was like to be human."</span><br>' +
                            '<span class="good">✦ THE QUEEN LETS YOU GO ✦</span>'
                        );
                        setTimeout(() => {
                            closeDialogue();
                            showEnding('good', 'Wisdom Ending',
                                'You reached the Queen through wisdom and understanding.<br>' +
                                'She remembers her humanity.<br><br>' +
                                '<span class="highlight">✦ You escaped, and the Queen begins to heal ✦</span>'
                            );
                        }, 3000);
                    } else {
                        showDialogue('💬 TALK',
                            'You try to reason with the Queen.<br>' +
                            '<span style="color: #ff4a4a;">"Reason? REASON? I AM THE LAW!"</span><br>' +
                            '<span style="color: #8888aa;">You need more wisdom to reach her.</span>'
                        );
                        setTimeout(closeDialogue, 2000);
                    }
                    break;

                case 'wonder':
                    if (player.wonder >= 50) {
                        player.queenDefeated = true;
                        player.questStep = 7;
                        showDialogue('🌀 WONDER POWER',
                            'You channel the power of Wonderland itself!<br>' +
                            'The Queen\'s desk flickers. She looks uncertain.<br>' +
                            '<span style="color: #ff4a4a;">"What... what are you?"</span><br>' +
                            '<span class="good">✦ THE QUEEN IS DEFEATED BY WONDER ✦</span>'
                        );
                        setTimeout(() => {
                            closeDialogue();
                            showEnding('good', 'Wonder Master Ending',
                                'You mastered the power of Wonderland.<br>' +
                                'The Queen bows to your wisdom.<br><br>' +
                                '<span class="highlight">✦ You become the bridge between worlds ✦</span>'
                            );
                        }, 3000);
                    } else {
                        showDialogue('🌀 WONDER POWER',
                            'You try to use Wonder, but it\'s not enough.<br>' +
                            '<span style="color: #ff4a4a;">"Your soul is weak!"</span><br>' +
                            `<span style="color: #8888aa;">You need 50+ Wonder (current: ${player.wonder})</span>`
                        );
                        setTimeout(closeDialogue, 2000);
                    }
                    break;

                case 'spare':
                    if (player.hasMercy && player.residentsMet.length >= 2) {
                        player.queenBefriended = true;
                        player.questStep = 7;
                        showDialogue('🕊️ SPARE',
                            'You offer mercy to the Queen.<br>' +
                            'She stares at you, speechless.<br>' +
                            '<span style="color: #ff4a4a;">"No one has ever... spared me..."</span><br>' +
                            '<span class="good">✦ THE QUEEN IS MOVED ✦</span><br>' +
                            '<span style="color: #ffd93d;">She steps down from her throne.</span>'
                        );
                        setTimeout(() => {
                            closeDialogue();
                            showEnding('good', 'Mercy Ending',
                                'You showed mercy to the Queen.<br>' +
                                'She remembers what it\'s like to be loved.<br><br>' +
                                '<span class="highlight">✦ Wonderland is at peace because of your kindness ✦</span>'
                            );
                        }, 3000);
                    } else {
                        showDialogue('🕊️ SPARE',
                            'You try to spare the Queen.<br>' +
                            '<span style="color: #ff4a4a;">"You think you can SPARE ME?"</span><br>' +
                            '<span style="color: #8888aa;">You need more mercy and more residents saved.</span>'
                        );
                        setTimeout(closeDialogue, 2000);
                    }
                    break;
            }
            updateUI();
        }

        // --- ESCAPE ---
        function escapeWonderland() {
            if (player.questStep < 6) {
                showDialogue('🚪 EXIT',
                    'The exit is locked. You need to complete your quest first.<br>' +
                    `<span style="color: #8888aa;">Quest progress: ${player.questStep}/6</span>`
                );
                setTimeout(closeDialogue, 2000);
                return;
            }

            showDialogue('🚪 ESCAPE',
                'You stand before the exit. The door glows with warm light.<br><br>' +
                'Do you want to leave Wonderland?',
                [
                    { label: '🚪 Yes, escape', value: 'escape', class: 'success' },
                    { label: '🌀 Stay in Wonderland', value: 'stay', class: 'wonder' }
                ],
                function(choice) {
                    closeDialogue();
                    if (choice === 'escape') {
                        showEnding('good', 'Escape Ending',
                            'You escaped Wonderland!<br>' +
                            'You return to JN Hall, forever changed by your adventure.<br><br>' +
                            '<span class="highlight">✦ You carry the wonder of the journey in your heart ✦</span>'
                        );
                    } else {
                        showEnding('neutral', 'Wonderland Resident',
                            'You choose to stay in Wonderland.<br>' +
                            'The cat appears beside you. "You belong here now."<br><br>' +
                            '<span class="highlight">✦ You become a part of Wonderland forever ✦</span>'
                        );
                    }
                }
            );
        }

        // ============================================================
        //  ENDING SYSTEM
        // ============================================================

        function showEnding(type, title, text) {
            const box = document.getElementById('dialogueBox');
            box.style.display = 'block';
            document.getElementById('dialogueSpeaker').textContent = `🎬 ${title}`;
            document.getElementById('dialogueText').innerHTML = text;
            document.getElementById('dialogueContinue').style.display = 'none';
            const buttons = document.getElementById('dialogueButtons');
            buttons.style.display = 'flex';
            buttons.innerHTML = `
                <button class="game-btn primary" onclick="resetGame()">🔄 PLAY AGAIN</button>
                <button class="game-btn" onclick="window.location.href='index.html'">🏠 MENU</button>
            `;
            player.gameState = 'dialogue';
            player.inDialogue = true;
            player.questStep = 7;
            updateUI();
        }

        // ============================================================
        //  UPDATE UI
        // ============================================================

        function updateUI() {
            document.getElementById('hudHp').textContent = player.hp;
            document.getElementById('hudStep').textContent = Math.min(player.questStep, 6);
            document.getElementById('hudMaxStep').textContent = 6;

            const items = [];
            if (player.hasKey) items.push('🔑');
            if (player.hasNote) items.push('📜');
            if (player.hasCandy) items.push('💊');
            if (player.hasCrown) items.push('👑');
            if (player.hasMirror) items.push('🪞');
            if (player.hasClock) items.push('⏰');
            if (player.hasRose) items.push('🌹');
            if (player.hasTea) items.push('🍵');
            if (player.hasCard) items.push('🃏');
            if (player.hasHeart) items.push('❤️');
            document.getElementById('hudItems').textContent = items.join(' ') || 'None';

            updateQuestLog();
        }

        // ============================================================
        //  RESET GAME
        // ============================================================

        function resetGame() {
            if (confirm('Reset the game and return to the character creator?')) {
                localStorage.removeItem('jnPlayerState');
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        //  GAME LOOP
        // ============================================================

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  INIT
        // ============================================================

        function init() {
            resizeCanvas();
            buildMap();
            // Place player in Room 303
            player.x = 4;
            player.y = 4;
            player.facing = 'down';
            updateUI();

            // Show intro dialogue
            setTimeout(() => {
                showDialogue('🎮 NARRATOR',
                    'You wake up in your dorm room at JN Hall.<br>' +
                    'You heard a scream from Room 303.<br><br>' +
                    '<span class="highlight">✦ You decide to investigate ✦</span><br>' +
                    '<span style="color: #8888aa; font-size: 8px;">Use Arrow Keys/WASD to move. Press SPACE to interact.</span>'
                );
                setTimeout(closeDialogue, 4000);
            }, 500);

            // Start game loop
            gameLoop();

            // Handle resize
            window.addEventListener('resize', function() {
                resizeCanvas();
            });
        }

        // Handle click on canvas to move
        canvas.addEventListener('click', function(e) {
            if (player.inDialogue || player.gameState !== 'exploring') return;

            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            // Convert to tile coordinates
            const tx = Math.floor((mx + cameraX) / tileSize);
            const ty = Math.floor((my + cameraY) / tileSize);

            if (tx >= 0 && tx < cols && ty >= 0 && ty < rows) {
                // Simple pathfinding - move towards click
                const dx = Math.sign(tx - player.x);
                const dy = Math.sign(ty - player.y);

                if (dx !== 0 && dy !== 0) {
                    // Try horizontal first
                    if (map[player.y][player.x + dx] !== T.WALL) {
                        tryMove(dx, 0);
                        return;
                    }
                    // Then vertical
                    if (map[player.y + dy][player.x] !== T.WALL) {
                        tryMove(0, dy);
                        return;
                    }
                } else if (dx !== 0) {
                    tryMove(dx, 0);
                } else if (dy !== 0) {
                    tryMove(0, dy);
                }
            }
        });

        // ============================================================
        //  START
        // ============================================================

        console.log('%c✦ JN WONDERLAND - ADVENTURE ✦', 'font-size:20px; color:#ffd93d;');
        console.log(`%cPlayer: ${player.name}`, 'color:#8888aa;');
        console.log('%c🎮 Use WASD/Arrow Keys to move, SPACE to interact!', 'color:#6ac8ff;');
        console.log('%c🐱 Find the cat to begin your quest!', 'color:#ff8a4a;');

        init();
    </script>
