<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JN Wonderland - The Asylum</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            image-rendering: pixelated;
            overflow: hidden;
        }

        #gameContainer {
            position: relative;
            width: 960px;
            height: 680px;
            background: #1a1a2e;
            border: 6px solid #4a4a6a;
            overflow: hidden;
            box-shadow: 0 0 60px rgba(100, 50, 200, 0.3);
            transition: background 2s ease, border-color 2s ease;
        }

        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            image-rendering: pixelated;
            cursor: default;
        }

        /* ========== UI OVERLAY ========== */
        #dialogueBox {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            background: rgba(5, 5, 15, 0.95);
            border: 4px solid #3a2a4a;
            padding: 18px 24px;
            color: #d4d4f0;
            font-size: 10px;
            line-height: 2.2;
            backdrop-filter: blur(8px);
            pointer-events: auto;
            display: none;
            z-index: 20;
            min-height: 120px;
            box-shadow: 0 0 40px rgba(100, 50, 150, 0.2);
        }

        #dialogueBox .speaker {
            color: #ffd93d;
            font-size: 8px;
            margin-bottom: 4px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #dialogueBox .speaker.narrator { color: #8888cc; }
        #dialogueBox .speaker.cat { color: #ff8a4a; }
        #dialogueBox .speaker.queen { color: #ff4a4a; }
        #dialogueBox .speaker.ian { color: #8aba4a; }
        #dialogueBox .speaker.creepy { color: #aa4a4a; }
        #dialogueBox .speaker.good { color: #4aff8a; }

        #dialogueBox .dialogue {
            color: #e8e8f0;
            font-size: 10px;
            line-height: 2.2;
        }

        #dialogueBox .dialogue .highlight { color: #ffd93d; }
        #dialogueBox .dialogue .creepy { color: #ff6b6b; }
        #dialogueBox .dialogue .good { color: #4aff8a; }
        #dialogueBox .dialogue .wonder { color: #a29bfe; }
        #dialogueBox .dialogue .dark { color: #6a4a7a; }
        #dialogueBox .dialogue .insane { color: #ff6b9d; }

        #dialogueBox .continue {
            color: #4a4a6a;
            font-size: 7px;
            text-align: right;
            margin-top: 8px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        #dialogueBox .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 12px;
            pointer-events: auto;
        }

        #dialogueBox .game-btn {
            background: #2a2a4a;
            border: 3px solid #4a4a6a;
            color: #d4d4f0;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            pointer-events: auto;
            min-width: 80px;
        }

        #dialogueBox .game-btn:hover {
            background: #4a4a7a;
            border-color: #ffd93d;
            color: #ffd93d;
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 217, 61, 0.2);
        }

        #dialogueBox .game-btn.primary { background: #4a2a4a; border-color: #8a4a6a; color: #ff9d8a; }
        #dialogueBox .game-btn.primary:hover { background: #6a3a5a; border-color: #ff6b6b; }
        #dialogueBox .game-btn.danger { background: #4a2a2a; border-color: #8a2a2a; color: #ff6a6a; }
        #dialogueBox .game-btn.danger:hover { background: #6a3a3a; border-color: #ff4a4a; }
        #dialogueBox .game-btn.success { background: #2a4a2a; border-color: #4a8a4a; color: #8aff8a; }
        #dialogueBox .game-btn.success:hover { background: #3a6a3a; border-color: #6aff6a; }
        #dialogueBox .game-btn.wonder { background: #2a2a4a; border-color: #6a4a8a; color: #c8a8ff; }
        #dialogueBox .game-btn.wonder:hover { background: #4a3a6a; border-color: #a87aff; }

        /* ========== HUD ========== */
        #hud {
            position: absolute;
            top: 10px;
            right: 12px;
            background: rgba(5, 5, 15, 0.85);
            border: 2px solid #2a2a4a;
            padding: 8px 14px;
            font-size: 7px;
            color: #8888aa;
            text-align: right;
            line-height: 2;
            z-index: 15;
            pointer-events: none;
            backdrop-filter: blur(4px);
            min-width: 120px;
        }

        #hud .hp { color: #ff6b6b; }
        #hud .act { color: #ffd93d; }
        #hud .wonder { color: #a29bfe; }
        #hud .items { color: #6ab4ff; }
        #hud .step { color: #ff8a4a; }
        #hud .sanity { color: #ff6b9d; }

        /* ========== QUEST LOG ========== */
        #questLog {
            position: absolute;
            top: 10px;
            left: 12px;
            background: rgba(5, 5, 15, 0.85);
            border: 2px solid #2a2a4a;
            padding: 8px 14px;
            font-size: 6px;
            color: #6ac8ff;
            z-index: 15;
            pointer-events: none;
            backdrop-filter: blur(4px);
            max-width: 220px;
            line-height: 1.8;
        }

        #questLog .title {
            color: #ffd93d;
            font-size: 7px;
            margin-bottom: 4px;
            letter-spacing: 1px;
        }

        #questLog .step-done { color: #4aff8a; }
        #questLog .step-active { color: #ffd93d; }
        #questLog .step-hidden { color: #2a2a4a; }
        #questLog .step-insane { color: #ff6b9d; animation: blink 0.5s infinite; }

        /* ========== CHAPTER TITLE ========== */
        #chapterTitle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ffd93d;
            font-size: 28px;
            text-align: center;
            z-index: 25;
            pointer-events: none;
            opacity: 0;
            text-shadow: 0 0 60px rgba(255, 217, 61, 0.3);
            transition: opacity 1.5s ease;
        }

        #chapterTitle .sub {
            font-size: 11px;
            color: #8888aa;
            margin-top: 10px;
            letter-spacing: 4px;
        }

        #chapterTitle .insane-sub {
            font-size: 11px;
            color: #ff6b9d;
            margin-top: 10px;
            letter-spacing: 4px;
            animation: blink 0.5s infinite;
        }

        /* ========== DARK OVERLAY ========== */
        #darkOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0);
            z-index: 5;
            pointer-events: none;
            transition: background 2s ease;
        }

        /* ========== SANITY EFFECTS ========== */
        @keyframes vignette {
            0%, 100% { box-shadow: inset 0 0 100px rgba(0,0,0,0); }
            50% { box-shadow: inset 0 0 100px rgba(100, 50, 150, 0.1); }
        }

        .sanity-effect {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 6;
            animation: vignette 3s infinite;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 1000px) {
            #gameContainer { width: 95vw; height: 90vh; }
            #dialogueBox { font-size: 8px; padding: 12px 16px; min-height: 100px; }
            #dialogueBox .dialogue { font-size: 8px; }
            #dialogueBox .game-btn { font-size: 7px; padding: 6px 12px; min-width: 60px; }
            #hud { font-size: 6px; padding: 5px 10px; min-width: 100px; }
            #questLog { font-size: 5px; padding: 5px 10px; max-width: 180px; }
            #chapterTitle { font-size: 20px; }
            #chapterTitle .sub { font-size: 9px; }
        }

        @media (max-width: 600px) {
            #dialogueBox { font-size: 7px; padding: 10px 12px; min-height: 80px; bottom: 10px; }
            #dialogueBox .dialogue { font-size: 7px; }
            #dialogueBox .game-btn { font-size: 6px; padding: 4px 8px; min-width: 50px; }
            #hud { font-size: 5px; padding: 3px 6px; top: 5px; right: 6px; min-width: 80px; }
            #questLog { font-size: 4px; padding: 3px 6px; top: 5px; left: 6px; max-width: 140px; }
            #chapterTitle { font-size: 16px; }
            #chapterTitle .sub { font-size: 7px; }
        }
    </style>
</head>
<body>

    <div id="gameContainer">

        <canvas id="gameCanvas"></canvas>
        <div class="sanity-effect" id="sanityEffect"></div>
        <div id="darkOverlay"></div>

        <div id="chapterTitle">
            <div id="chapterTitleText">CHAPTER I</div>
            <div class="sub" id="chapterSubText">The Scream</div>
        </div>

        <div id="hud">
            <div class="hp">❤️ HP: <span id="hudHp">20</span>/20</div>
            <div class="act">📖 ACT: <span id="hudAct">I</span></div>
            <div class="wonder">🌀 WONDER: <span id="hudWonder">5</span>%</div>
            <div class="sanity">🧠 SANITY: <span id="hudSanity">100</span>%</div>
            <div class="items">📦 ITEMS: <span id="hudItems">None</span></div>
            <div class="step">🐱 QUEST: <span id="hudStep">0</span>/<span id="hudMaxStep">8</span></div>
        </div>

        <div id="questLog">
            <div class="title">📋 THE ASYLUM</div>
            <div id="questList">
                <div class="step-active">✦ The Scream</div>
                <div>✦ The Fall</div>
                <div>✦ The Endless Hall</div>
                <div>✦ The Memories</div>
                <div>✦ The Mad Wing</div>
                <div>✦ The Bodyguard</div>
                <div>✦ The Queen</div>
                <div>✦ The Escape</div>
            </div>
        </div>

        <div id="dialogueBox">
            <div class="speaker" id="dialogueSpeaker">🎮 NARRATOR</div>
            <div class="dialogue" id="dialogueText">Welcome to JN Wonderland...</div>
            <div class="continue" id="dialogueContinue">▼ Press SPACE or click</div>
            <div class="btn-group" id="dialogueButtons" style="display: none;"></div>
        </div>

    </div>

    <script>
        // ============================================================
        //  SETUP
        // ============================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;

        let W, H, tileSize;

        function resizeCanvas() {
            const container = document.getElementById('gameContainer');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            W = canvas.width;
            H = canvas.height;
            tileSize = Math.min(W / 28, H / 20);
            tileSize = Math.max(tileSize, 18);
            cols = Math.floor(W / tileSize);
            rows = Math.floor(H / tileSize);
        }

        // ============================================================
        //  PLAYER STATE
        // ============================================================

        let player = {
            name: 'PROTAGONIST',
            hair: 'blonde',
            skin: 'light',
            outfit: 'hoodie',
            hp: 20,
            maxHp: 20,
            wonder: 5,
            sanity: 100,
            x: 5,
            y: 7,
            facing: 'down',
            questStep: 0,
            act: 1,
            // Story flags
            metCat: false,
            enteredCloset: false,
            foundMemories: 0,
            foundResidents: 0,
            ianDefeated: false,
            ianBefriended: false,
            queenDefeated: false,
            queenBefriended: false,
            hasMercy: false,
            hasWisdom: false,
            hasCourage: false,
            hasHope: false,
            // Items
            hasKey: false,
            hasNote: false,
            hasCandy: false,
            hasCrown: false,
            hasMirror: false,
            hasClock: false,
            hasRose: false,
            hasTea: false,
            hasCard: false,
            hasHeart: false,
            hasLetter: false,
            hasPhoto: false,
            hasDiary: false,
            // Combat
            enemiesDefeated: 0,
            // State
            inDialogue: false,
            gameState: 'exploring',
            ending: 0,
            // Map section tracking
            mapSection: 0, // 0=room303, 1=hallway, 2=endless, 3=memories, 4=madwing, 5=ian, 6=queen
            mapX: 0,
            mapY: 0
        };

        // ============================================================
        //  LOAD PLAYER
        // ============================================================

        function loadPlayerData() {
            const saved = localStorage.getItem('jnPlayerState');
            if (saved) {
                try {
                    const data = JSON.parse(saved);
                    player.name = data.name || 'PROTAGONIST';
                    player.hair = data.hair || 'blonde';
                    player.skin = data.skin || 'light';
                    player.outfit = data.outfit || 'hoodie';
                } catch (e) { /* ignore */ }
            }
        }
        loadPlayerData();

        // ============================================================
        //  TILE MAP - HUGE EXPANDED VERSION
        // ============================================================

        let cols = 28, rows = 20;
        let map = [];
        let mapOffsetX = 0, mapOffsetY = 0;

        const T = {
            FLOOR: 0,
            WALL: 1,
            DOOR: 2,
            CLOSET: 3,
            CAT: 4,
            RESIDENT: 5,
            ENEMY: 6,
            ITEM: 7,
            EXIT: 8,
            QUEEN: 9,
            IAN: 10,
            CHEST: 11,
            MEMORY: 12,
            LETTER: 13,
            PHOTO: 14,
            DIARY: 15,
            SHADOW: 16,
            PORTAL: 17,
            STAIRS: 18,
            MIRROR: 19,
            BLOOD: 20,
            CRACK: 21,
            EYE: 22
        };

        // ============================================================
        //  BUILD THE MASSIVE MAP
        // ============================================================

        function buildMap() {
            // We'll build a large map and then scroll through sections
            // Each section is 28x20 tiles
            // Section 0: Room 303 (normal)
            // Section 1: Hallway (getting weird)
            // Section 2: Endless Corridor (looping)
            // Section 3: Memory Rooms
            // Section 4: Mad Wing (insanity)
            // Section 5: Ian's Chamber
            // Section 6: Queen's Throne Room

            map = [];
            for (let r = 0; r < rows; r++) {
                map[r] = [];
                for (let c = 0; c < cols; c++) {
                    map[r][c] = T.WALL;
                }
            }

            // ===== SECTION 0: ROOM 303 =====
            // Room 303 area
            for (let r = 2; r < 8; r++) {
                for (let c = 2; c < 9; c++) {
                    if (r === 2 || r === 7 || c === 2 || c === 8) {
                        if (!(r === 2 && c === 4) && !(r === 2 && c === 5)) {
                            map[r][c] = T.WALL;
                        }
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }
            map[2][5] = T.DOOR;
            map[4][6] = T.CLOSET;
            map[3][5] = T.CAT;
            map[5][5] = T.ITEM;

            // Hallway outside Room 303
            for (let r = 2; r < 8; r++) {
                for (let c = 9; c < 14; c++) {
                    map[r][c] = T.FLOOR;
                }
            }

            // ===== SECTION 1: THE HALLWAY =====
            for (let r = 2; r < 14; r++) {
                for (let c = 14; c < 19; c++) {
                    if (r === 2 || r === 13 || c === 14 || c === 18) {
                        if (!(r === 2 && c === 16) && !(r === 13 && c === 16)) {
                            map[r][c] = T.WALL;
                        }
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }
            map[2][16] = T.DOOR;
            map[13][16] = T.DOOR;

            // ===== SECTION 2: ENDLESS CORRIDOR =====
            // This section loops! Walking one way wraps around
            for (let r = 2; r < 14; r++) {
                for (let c = 19; c < 24; c++) {
                    if (r === 2 || r === 13 || c === 19 || c === 23) {
                        if (!(r === 2 && c === 21) && !(r === 13 && c === 21)) {
                            map[r][c] = T.WALL;
                        }
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }
            map[2][21] = T.DOOR;
            map[13][21] = T.DOOR;

            // Loop indicators (cracks in walls)
            map[3][19] = T.CRACK;
            map[4][19] = T.CRACK;
            map[5][19] = T.CRACK;
            map[11][23] = T.CRACK;
            map[12][23] = T.CRACK;

            // ===== SECTION 3: MEMORY ROOMS =====
            for (let r = 2; r < 14; r++) {
                for (let c = 24; c < 28; c++) {
                    if (r === 2 || r === 13 || c === 24 || c === 27) {
                        if (!(r === 2 && c === 25) && !(r === 2 && c === 26) && !(r === 13 && c === 25) && !(r === 13 && c === 26)) {
                            map[r][c] = T.WALL;
                        }
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }
            map[2][25] = T.DOOR;
            map[2][26] = T.DOOR;
            map[13][25] = T.DOOR;
            map[13][26] = T.DOOR;

            // Memory fragments
            map[4][25] = T.MEMORY;
            map[6][26] = T.MEMORY;
            map[8][25] = T.MEMORY;
            map[10][26] = T.MEMORY;
            map[5][24] = T.LETTER;
            map[9][27] = T.PHOTO;
            map[7][26] = T.DIARY;

            // ===== SECTION 4: MAD WING =====
            // Reality breaks here - weird tile patterns
            for (let r = 14; r < rows; r++) {
                for (let c = 2; c < 14; c++) {
                    if (r === 14 || r === rows - 1 || c === 2 || c === 13) {
                        if (!(r === 14 && c === 7) && !(r === rows - 1 && c === 7)) {
                            map[r][c] = T.WALL;
                        }
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }
            map[14][7] = T.DOOR;
            map[19][7] = T.DOOR;

            // Madness tiles - eyes in the walls
            map[15][3] = T.EYE;
            map[16][12] = T.EYE;
            map[17][5] = T.EYE;
            map[18][10] = T.EYE;

            // Blood trails
            map[16][6] = T.BLOOD;
            map[17][7] = T.BLOOD;
            map[18][8] = T.BLOOD;

            // Mirrors
            map[15][8] = T.MIRROR;
            map[17][9] = T.MIRROR;

            // Shadows
            map[16][9] = T.SHADOW;
            map[18][11] = T.SHADOW;

            // Items in mad wing
            map[16][4] = T.ITEM;
            map[18][6] = T.CHEST;

            // ===== SECTION 5: IAN'S CHAMBER =====
            for (let r = 14; r < rows; r++) {
                for (let c = 14; c < 21; c++) {
                    if (r === 14 || r === rows - 1 || c === 14 || c === 20) {
                        if (!(r === 14 && c === 17) && !(r === rows - 1 && c === 17)) {
                            map[r][c] = T.WALL;
                        }
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }
            map[14][17] = T.DOOR;
            map[19][17] = T.DOOR;

            // Ian
            map[17][17] = T.IAN;

            // Arena decorations
            map[16][15] = T.CRACK;
            map[16][19] = T.CRACK;
            map[18][15] = T.CRACK;
            map[18][19] = T.CRACK;

            // ===== SECTION 6: QUEEN'S THRONE ROOM =====
            for (let r = 14; r < rows; r++) {
                for (let c = 21; c < cols; c++) {
                    if (r === 14 || r === rows - 1 || c === 21 || c === cols - 1) {
                        if (!(r === 14 && c === 24) && !(r === 14 && c === 25)) {
                            map[r][c] = T.WALL;
                        }
                    } else {
                        map[r][c] = T.FLOOR;
                    }
                }
            }
            map[14][24] = T.DOOR;
            map[14][25] = T.DOOR;

            // Queen's throne
            map[17][24] = T.QUEEN;

            // The exit back to Room 303 (behind the Queen)
            map[18][25] = T.EXIT;

            // Throne room decorations
            map[15][22] = T.MIRROR;
            map[15][26] = T.MIRROR;
            map[16][23] = T.BLOOD;
            map[16][25] = T.BLOOD;

            // Portal effect tiles
            map[17][23] = T.PORTAL;
            map[17][25] = T.PORTAL;

            // ============================================================
            //  TRANSITION DOORS BETWEEN SECTIONS
            // ============================================================

            // Room 303 to Hallway (section 0 to 1)
            map[4][9] = T.DOOR;

            // Hallway to Endless (section 1 to 2)
            map[7][19] = T.DOOR;

            // Endless to Memories (section 2 to 3)
            map[7][24] = T.DOOR;

            // Memories to Mad Wing (section 3 to 4) - via stairs
            map[13][3] = T.STAIRS;
            map[14][3] = T.STAIRS;

            // Mad Wing to Ian (section 4 to 5)
            map[14][13] = T.DOOR;

            // Ian to Queen (section 5 to 6)
            map[14][21] = T.DOOR;
        }

        // ============================================================
        //  RENDER ENGINE
        // ============================================================

        let cameraX = 0, cameraY = 0;
        let darkOpacity = 0;
        let insanityLevel = 0;

        function render() {
            ctx.clearRect(0, 0, W, H);

            // Calculate insanity level based on map section
            insanityLevel = Math.min(1, player.mapSection / 5);

            // Camera follow
            const targetCamX = player.x * tileSize - W / 2 + tileSize / 2;
            const targetCamY = player.y * tileSize - H / 2 + tileSize / 2;
            cameraX += (targetCamX - cameraX) * 0.08;
            cameraY += (targetCamY - cameraY) * 0.08;

            // Draw map
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const x = c * tileSize - cameraX;
                    const y = r * tileSize - cameraY;

                    if (x < -tileSize || x > W + tileSize || y < -tileSize || y > H + tileSize) continue;

                    const tile = map[r][c];

                    // Base floor
                    if (tile !== T.WALL) {
                        // Darkening floor based on section
                        const dark = 0.1 + insanityLevel * 0.15;
                        const color = Math.floor(15 + insanityLevel * 20);
                        ctx.fillStyle = `rgb(${color}, ${Math.floor(color * 0.7)}, ${Math.floor(color * 0.8 + insanityLevel * 20)})`;
                        ctx.fillRect(x, y, tileSize, tileSize);
                    }

                    // Wall
                    if (tile === T.WALL) {
                        const dark = 0.2 + insanityLevel * 0.3;
                        ctx.fillStyle = `rgba(20, 15, 30, ${dark})`;
                        ctx.fillRect(x, y, tileSize, tileSize);
                        // Wall texture
                        ctx.fillStyle = `rgba(35, 25, 50, ${0.3 + insanityLevel * 0.4})`;
                        ctx.fillRect(x + 2, y + 2, tileSize - 4, tileSize - 4);
                        // Cracks appear with insanity
                        if (insanityLevel > 0.3 && (r + c) % 4 === 0) {
                            ctx.strokeStyle = `rgba(100, 50, 150, ${insanityLevel * 0.3})`;
                            ctx.lineWidth = 1;
                            ctx.beginPath();
                            ctx.moveTo(x + tileSize * 0.2, y + tileSize * 0.3);
                            ctx.lineTo(x + tileSize * 0.4, y + tileSize * 0.6);
                            ctx.lineTo(x + tileSize * 0.3, y + tileSize * 0.8);
                            ctx.stroke();
                        }
                    }

                    // Door
                    if (tile === T.DOOR) {
                        ctx.fillStyle = '#2a1a1a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#3a2a2a';
                        ctx.fillRect(x + tileSize * 0.1, y + tileSize * 0.1, tileSize * 0.8, tileSize * 0.8);
                        ctx.fillStyle = '#8a6a3a';
                        ctx.fillRect(x + tileSize * 0.7, y + tileSize * 0.4, tileSize * 0.1, tileSize * 0.2);
                        // Door glow
                        const dist = Math.abs(player.x - c) + Math.abs(player.y - r);
                        if (dist <= 2) {
                            const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize);
                            grad.addColorStop(0, `rgba(255, 217, 61, ${0.1 + insanityLevel * 0.1})`);
                            grad.addColorStop(1, 'rgba(255, 217, 61, 0)');
                            ctx.fillStyle = grad;
                            ctx.fillRect(x - tileSize, y - tileSize, tileSize * 3, tileSize * 3);
                        }
                    }

                    // Closet
                    if (tile === T.CLOSET) {
                        ctx.fillStyle = '#0a0a1a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#1a0a2a';
                        ctx.fillRect(x + tileSize * 0.1, y + tileSize * 0.1, tileSize * 0.8, tileSize * 0.8);
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize * 0.8);
                        grad.addColorStop(0, 'rgba(100, 50, 200, 0.3)');
                        grad.addColorStop(1, 'rgba(100, 50, 200, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🌀', x + tileSize/2, y + tileSize * 0.7);
                    }

                    // Cat
                    if (tile === T.CAT) {
                        drawCat(ctx, x, y, tileSize);
                    }

                    // Resident
                    if (tile === T.RESIDENT) {
                        ctx.fillStyle = '#1a0a1a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#6ab4ff';
                        ctx.font = `${tileSize * 0.5}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('👤', x + tileSize/2, y + tileSize * 0.7);
                        ctx.fillStyle = '#8888aa';
                        ctx.font = `${tileSize * 0.15}px monospace`;
                        ctx.fillText('RESIDENT', x + tileSize/2, y + tileSize * 0.92);
                    }

                    // Ian
                    if (tile === T.IAN) {
                        ctx.fillStyle = '#0a1a0a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize);
                        grad.addColorStop(0, 'rgba(100, 200, 50, 0.15)');
                        grad.addColorStop(1, 'rgba(100, 200, 50, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x - tileSize, y - tileSize, tileSize * 3, tileSize * 3);
                        ctx.fillStyle = '#8aba4a';
                        ctx.font = `${tileSize * 0.6}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('💪', x + tileSize/2, y + tileSize * 0.7);
                        ctx.fillStyle = '#8aba4a';
                        ctx.font = `${tileSize * 0.15}px monospace`;
                        ctx.fillText('IAN', x + tileSize/2, y + tileSize * 0.92);
                    }

                    // Queen
                    if (tile === T.QUEEN) {
                        ctx.fillStyle = '#2a0a0a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize * 2);
                        grad.addColorStop(0, 'rgba(255, 0, 0, 0.2)');
                        grad.addColorStop(1, 'rgba(255, 0, 0, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x - tileSize, y - tileSize, tileSize * 3, tileSize * 3);
                        ctx.fillStyle = '#ff4a4a';
                        ctx.font = `${tileSize * 0.6}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('👑', x + tileSize/2, y + tileSize * 0.7);
                        ctx.fillStyle = '#ff4a4a';
                        ctx.font = `${tileSize * 0.15}px monospace`;
                        ctx.fillText('THE QUEEN', x + tileSize/2, y + tileSize * 0.92);
                    }

                    // Items
                    if (tile === T.ITEM) {
                        ctx.fillStyle = 'rgba(255, 217, 61, 0.15)';
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, tileSize * 0.3, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('✨', x + tileSize/2, y + tileSize * 0.7);
                    }

                    // Chest
                    if (tile === T.CHEST) {
                        ctx.fillStyle = '#2a1a0a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#6a4a2a';
                        ctx.fillRect(x + tileSize * 0.1, y + tileSize * 0.2, tileSize * 0.8, tileSize * 0.6);
                        ctx.fillStyle = '#ffd93d';
                        ctx.fillRect(x + tileSize * 0.35, y + tileSize * 0.15, tileSize * 0.3, tileSize * 0.1);
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.35}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('📦', x + tileSize/2, y + tileSize * 0.7);
                    }

                    // Memory
                    if (tile === T.MEMORY) {
                        ctx.fillStyle = `rgba(100, 50, 200, ${0.1 + insanityLevel * 0.2})`;
                        ctx.fillRect(x, y, tileSize, tileSize);
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize * 0.6);
                        grad.addColorStop(0, `rgba(162, 155, 254, ${0.2 + insanityLevel * 0.2})`);
                        grad.addColorStop(1, 'rgba(162, 155, 254, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#a29bfe';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('💭', x + tileSize/2, y + tileSize * 0.7);
                    }

                    // Letter
                    if (tile === T.LETTER) {
                        ctx.fillStyle = 'rgba(200, 180, 100, 0.15)';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('✉️', x + tileSize/2, y + tileSize * 0.7);
                    }

                    // Photo
                    if (tile === T.PHOTO) {
                        ctx.fillStyle = 'rgba(150, 100, 50, 0.15)';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#ff8a4a';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🖼️', x + tileSize/2, y + tileSize * 0.7);
                    }

                    // Diary
                    if (tile === T.DIARY) {
                        ctx.fillStyle = 'rgba(100, 50, 50, 0.15)';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = '#ff6b6b';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('📖', x + tileSize/2, y + tileSize * 0.7);
                    }

                    // Shadow
                    if (tile === T.SHADOW) {
                        ctx.fillStyle = `rgba(0, 0, 0, ${0.2 + insanityLevel * 0.2})`;
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, tileSize * 0.35, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.fillStyle = `rgba(100, 50, 150, ${0.1 + insanityLevel * 0.2})`;
                        ctx.font = `${tileSize * 0.3}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('👻', x + tileSize/2, y + tileSize * 0.65);
                    }

                    // Exit
                    if (tile === T.EXIT) {
                        ctx.fillStyle = 'rgba(50, 200, 100, 0.05)';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize);
                        grad.addColorStop(0, 'rgba(74, 255, 138, 0.2)');
                        grad.addColorStop(1, 'rgba(74, 255, 138, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x - tileSize, y - tileSize, tileSize * 3, tileSize * 3);
                        ctx.fillStyle = '#4aff8a';
                        ctx.font = `${tileSize * 0.5}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🚪', x + tileSize/2, y + tileSize * 0.7);
                        ctx.fillStyle = '#4aff8a';
                        ctx.font = `${tileSize * 0.15}px monospace`;
                        ctx.fillText('EXIT', x + tileSize/2, y + tileSize * 0.92);
                    }

                    // Blood
                    if (tile === T.BLOOD) {
                        ctx.fillStyle = `rgba(100, 20, 20, ${0.3 + insanityLevel * 0.3})`;
                        ctx.beginPath();
                        ctx.ellipse(x + tileSize/2, y + tileSize/2, tileSize * 0.4, tileSize * 0.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.beginPath();
                        ctx.ellipse(x + tileSize * 0.3, y + tileSize * 0.6, tileSize * 0.2, tileSize * 0.1, 0.5, 0, Math.PI * 2);
                        ctx.fill();
                    }

                    // Crack
                    if (tile === T.CRACK) {
                        ctx.strokeStyle = `rgba(60, 40, 80, ${0.3 + insanityLevel * 0.4})`;
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(x + tileSize * 0.1, y + tileSize * 0.2);
                        ctx.lineTo(x + tileSize * 0.3, y + tileSize * 0.5);
                        ctx.lineTo(x + tileSize * 0.2, y + tileSize * 0.8);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x + tileSize * 0.9, y + tileSize * 0.3);
                        ctx.lineTo(x + tileSize * 0.7, y + tileSize * 0.6);
                        ctx.lineTo(x + tileSize * 0.8, y + tileSize * 0.9);
                        ctx.stroke();
                    }

                    // Eye
                    if (tile === T.EYE) {
                        // White of eye
                        ctx.fillStyle = `rgba(200, 200, 200, ${0.2 + insanityLevel * 0.3})`;
                        ctx.beginPath();
                        ctx.ellipse(x + tileSize/2, y + tileSize/2, tileSize * 0.3, tileSize * 0.2, 0, 0, Math.PI * 2);
                        ctx.fill();
                        // Pupil
                        ctx.fillStyle = `rgba(100, 50, 150, ${0.4 + insanityLevel * 0.3})`;
                        ctx.beginPath();
                        ctx.arc(x + tileSize/2, y + tileSize/2, tileSize * 0.1, 0, Math.PI * 2);
                        ctx.fill();
                        // Red veins
                        ctx.strokeStyle = `rgba(150, 50, 50, ${0.2 + insanityLevel * 0.2})`;
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(x + tileSize * 0.2, y + tileSize * 0.4);
                        ctx.lineTo(x + tileSize * 0.4, y + tileSize * 0.45);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(x + tileSize * 0.8, y + tileSize * 0.6);
                        ctx.lineTo(x + tileSize * 0.6, y + tileSize * 0.55);
                        ctx.stroke();
                    }

                    // Mirror
                    if (tile === T.MIRROR) {
                        ctx.fillStyle = `rgba(100, 100, 150, ${0.1 + insanityLevel * 0.15})`;
                        ctx.fillRect(x, y, tileSize, tileSize);
                        ctx.fillStyle = `rgba(200, 200, 255, ${0.05 + insanityLevel * 0.1})`;
                        ctx.fillRect(x + tileSize * 0.1, y + tileSize * 0.1, tileSize * 0.8, tileSize * 0.8);
                        ctx.fillStyle = '#a29bfe';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🪞', x + tileSize/2, y + tileSize * 0.7);
                        // Reflection effect
                        if (insanityLevel > 0.5) {
                            ctx.fillStyle = `rgba(162, 155, 254, ${(insanityLevel - 0.5) * 0.2})`;
                            ctx.fillRect(x + tileSize * 0.2, y + tileSize * 0.2, tileSize * 0.6, tileSize * 0.6);
                        }
                    }

                    // Stairs
                    if (tile === T.STAIRS) {
                        ctx.fillStyle = '#1a1a2a';
                        ctx.fillRect(x, y, tileSize, tileSize);
                        for (let i = 0; i < 4; i++) {
                            ctx.fillStyle = '#2a2a4a';
                            ctx.fillRect(x + tileSize * 0.1, y + tileSize * (0.1 + i * 0.2), tileSize * 0.8, tileSize * 0.05);
                        }
                        ctx.fillStyle = '#ffd93d';
                        ctx.font = `${tileSize * 0.3}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('⬇', x + tileSize/2, y + tileSize * 0.75);
                    }

                    // Portal
                    if (tile === T.PORTAL) {
                        const grad = ctx.createRadialGradient(x + tileSize/2, y + tileSize/2, 0, x + tileSize/2, y + tileSize/2, tileSize * 0.6);
                        grad.addColorStop(0, `rgba(100, 50, 200, ${0.3 + insanityLevel * 0.3})`);
                        grad.addColorStop(0.5, `rgba(255, 100, 200, ${0.2 + insanityLevel * 0.2})`);
                        grad.addColorStop(1, 'rgba(100, 50, 200, 0)');
                        ctx.fillStyle = grad;
                        ctx.fillRect(x - tileSize * 0.5, y - tileSize * 0.5, tileSize * 2, tileSize * 2);
                        ctx.fillStyle = '#a29bfe';
                        ctx.font = `${tileSize * 0.4}px monospace`;
                        ctx.textAlign = 'center';
                        ctx.fillText('🌀', x + tileSize/2, y + tileSize * 0.7);
                    }
                }
            }

            // Draw player
            const px = player.x * tileSize - cameraX;
            const py = player.y * tileSize - cameraY;
            if (px > -tileSize && px < W + tileSize && py > -tileSize && py < H + tileSize) {
                drawPixelSprite(ctx, px, py, tileSize, player.hair, player.skin, player.outfit, player.facing);
            }

            // Draw interaction indicator
            const nearby = getNearbyInteractive();
            if (nearby && player.gameState === 'exploring' && !player.inDialogue) {
                const nx = nearby.x * tileSize - cameraX;
                const ny = nearby.y * tileSize - cameraY;
                ctx.fillStyle = 'rgba(255, 217, 61, 0.15)';
                ctx.fillRect(nx, ny - 18, tileSize, 16);
                ctx.fillStyle = '#ffd93d';
                ctx.font = '7px monospace';
                ctx.textAlign = 'center';
                const label = nearby.tile === T.CAT ? '🐱 TALK' :
                             nearby.tile === T.CLOSET ? '🌀 ENTER' :
                             nearby.tile === T.DOOR ? '🚪 OPEN' :
                             nearby.tile === T.ITEM ? '✨ PICK UP' :
                             nearby.tile === T.CHEST ? '📦 OPEN' :
                             nearby.tile === T.RESIDENT ? '💬 TALK' :
                             nearby.tile === T.IAN ? '💪 FACE' :
                             nearby.tile === T.QUEEN ? '👑 CHALLENGE' :
                             nearby.tile === T.EXIT ? '🚪 ESCAPE' :
                             nearby.tile === T.MEMORY ? '💭 REMEMBER' :
                             nearby.tile === T.LETTER ? '✉️ READ' :
                             nearby.tile === T.PHOTO ? '🖼️ VIEW' :
                             nearby.tile === T.DIARY ? '📖 READ' :
                             nearby.tile === T.SHADOW ? '👻 INVESTIGATE' :
                             nearby.tile === T.MIRROR ? '🪞 LOOK' :
                             nearby.tile === T.BLOOD ? '🩸 INVESTIGATE' :
                             nearby.tile === T.EYE ? '👁️ LOOK' :
                             nearby.tile === T.STAIRS ? '⬇️ DESCEND' :
                             nearby.tile === T.PORTAL ? '🌀 ENTER' : '🔹 INTERACT';
                ctx.fillText('🔹 ' + label, nx + tileSize/2, ny - 6);
            }

            // Sanity overlay
            if (insanityLevel > 0.3) {
                // Vignette
                const grad = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.8);
                grad.addColorStop(0, `rgba(0,0,0,0)`);
                grad.addColorStop(1, `rgba(0,0,0,${insanityLevel * 0.3})`);
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, W, H);

                // Static noise
                if (insanityLevel > 0.6 && Math.random() < insanityLevel * 0.1) {
                    for (let i = 0; i < 20; i++) {
                        ctx.fillStyle = `rgba(100, 50, 150, ${Math.random() * 0.05})`;
                        ctx.fillRect(Math.random() * W, Math.random() * H, Math.random() * 20, Math.random() * 2);
                    }
                }
            }

            // Dark overlay
            document.getElementById('darkOverlay').style.background = `rgba(0, 0, 0, ${darkOpacity})`;
        }

        // ============================================================
        //  SPRITE FUNCTIONS
        // ============================================================

        function drawPixelSprite(ctx, x, y, size, hair, skin, outfit, facing) {
            const s = size / 12;
            const colors = {
                skin: skin === 'light' ? '#f5d0b8' :
                      skin === 'medium' ? '#d4a574' :
                      skin === 'dark' ? '#8d6b4b' : '#c4a882',
                hair: hair === 'blonde' ? '#f5d742' :
                      hair === 'brown' ? '#8b6b4a' :
                      hair === 'black' ? '#2a2a2a' :
                      hair === 'red' ? '#c0392b' : '#ff6b9d',
                outfit: outfit === 'hoodie' ? '#4a7a9c' :
                       outfit === 'sweater' ? '#8b5a2b' :
                       outfit === 'jacket' ? '#2d3d4a' : '#c0392b',
                eye: '#f0f0f0',
                pupil: '#1a1a2e'
            };

            // Shadow
            ctx.fillStyle = 'rgba(0,0,0,0.3)';
            ctx.beginPath();
            ctx.ellipse(x + s * 6, y + s * 16, s * 4, s * 1.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Body
            ctx.fillStyle = colors.outfit;
            ctx.fillRect(x + s * 2, y + s * 5, s * 8, s * 7);

            // Head
            ctx.fillStyle = colors.skin;
            ctx.fillRect(x + s * 3, y + s * 1, s * 6, s * 4);

            // Hair
            ctx.fillStyle = colors.hair;
            ctx.fillRect(x + s * 2, y + s * 0, s * 8, s * 2);
            ctx.fillRect(x + s * 1, y + s * 2, s * 2, s * 1);
            ctx.fillRect(x + s * 9, y + s * 2, s * 2, s * 1);

            // Eyes
            ctx.fillStyle = colors.eye;
            ctx.fillRect(x + s * 4, y + s * 2.5, s * 1.5, s * 1.5);
            ctx.fillRect(x + s * 6.5, y + s * 2.5, s * 1.5, s * 1.5);
            ctx.fillStyle = colors.pupil;
            ctx.fillRect(x + s * 4.5, y + s * 3, s * 0.8, s * 0.8);
            ctx.fillRect(x + s * 7, y + s * 3, s * 0.8, s * 0.8);

            // Mouth
            ctx.fillStyle = '#8b6b4a';
            ctx.fillRect(x + s * 5, y + s * 4, s * 2, s * 0.5);

            // Legs
            ctx.fillStyle = colors.outfit;
            ctx.fillRect(x + s * 3, y + s * 12, s * 2, s * 2.5);
            ctx.fillRect(x + s * 7, y + s * 12, s * 2, s * 2.5);

            // Shoes
            ctx.fillStyle = '#1a1a2a';
            ctx.fillRect(x + s * 2.5, y + s * 14.5, s * 3, s * 1.2);
            ctx.fillRect(x + s * 6.5, y + s * 14.5, s * 3, s * 1.2);

            // Direction indicator
            ctx.fillStyle = 'rgba(255, 217, 61, 0.4)';
            const dirSize = s * 2.5;
            if (facing === 'up') {
                ctx.beginPath();
                ctx.moveTo(x + s * 6, y - dirSize * 0.8);
                ctx.lineTo(x + s * 6 - dirSize * 0.6, y + dirSize * 0.2);
                ctx.lineTo(x + s * 6 + dirSize * 0.6, y + dirSize * 0.2);
                ctx.fill();
            } else if (facing === 'down') {
                ctx.beginPath();
                ctx.moveTo(x + s * 6, y + s * 17 + dirSize * 0.8);
                ctx.lineTo(x + s * 6 - dirSize * 0.6, y + s * 17 - dirSize * 0.2);
                ctx.lineTo(x + s * 6 + dirSize * 0.6, y + s * 17 - dirSize * 0.2);
                ctx.fill();
            } else if (facing === 'left') {
                ctx.beginPath();
                ctx.moveTo(x - dirSize * 0.8, y + s * 8);
                ctx.lineTo(x + dirSize * 0.2, y + s * 8 - dirSize * 0.6);
                ctx.lineTo(x + dirSize * 0.2, y + s * 8 + dirSize * 0.6);
                ctx.fill();
            } else {
                ctx.beginPath();
                ctx.moveTo(x + s * 12 + dirSize * 0.8, y + s * 8);
                ctx.lineTo(x + s * 12 - dirSize * 0.2, y + s * 8 - dirSize * 0.6);
                ctx.lineTo(x + s * 12 - dirSize * 0.2, y + s * 8 + dirSize * 0.6);
                ctx.fill();
            }
        }

        function drawCat(ctx, x, y, size) {
            const s = size / 12;
            // Body
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.ellipse(x + s * 6, y + s * 6, s * 4, s * 3, 0, 0, Math.PI * 2);
            ctx.fill();

            // Head
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.ellipse(x + s * 6, y + s * 3, s * 3, s * 2.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // Ears
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.moveTo(x + s * 3.5, y + s * 1);
            ctx.lineTo(x + s * 2, y - s * 1);
            ctx.lineTo(x + s * 4.5, y + s * 0.5);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(x + s * 8.5, y + s * 1);
            ctx.lineTo(x + s * 10, y - s * 1);
            ctx.lineTo(x + s * 7.5, y + s * 0.5);
            ctx.fill();

            // Eyes - glowing
            ctx.fillStyle = '#4a8a4a';
            ctx.beginPath();
            ctx.ellipse(x + s * 4.5, y + s * 3, s * 0.8, s * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(x + s * 7.5, y + s * 3, s * 0.8, s * 1.2, 0, 0, Math.PI * 2);
            ctx.fill();

            // Pupils
            ctx.fillStyle = '#0a0a1a';
            ctx.fillRect(x + s * 4.3, y + s * 2.5, s * 0.4, s * 1.5);
            ctx.fillRect(x + s * 7.3, y + s * 2.5, s * 0.4, s * 1.5);

            // Glow
            const grad = ctx.createRadialGradient(x + s * 4.5, y + s * 3, 0, x + s * 4.5, y + s * 3, s * 2);
            grad.addColorStop(0, 'rgba(74, 138, 74, 0.2)');
            grad.addColorStop(1, 'rgba(74, 138, 74, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x + s * 4.5, y + s * 3, s * 2, 0, Math.PI * 2);
            ctx.fill();
            const grad2 = ctx.createRadialGradient(x + s * 7.5, y + s * 3, 0, x + s * 7.5, y + s * 3, s * 2);
            grad2.addColorStop(0, 'rgba(74, 138, 74, 0.2)');
            grad2.addColorStop(1, 'rgba(74, 138, 74, 0)');
            ctx.fillStyle = grad2;
            ctx.beginPath();
            ctx.arc(x + s * 7.5, y + s * 3, s * 2, 0, Math.PI * 2);
            ctx.fill();

            // Nose
            ctx.fillStyle = '#ff6b6b';
            ctx.beginPath();
            ctx.arc(x + s * 6, y + s * 3.8, s * 0.5, 0, Math.PI * 2);
            ctx.fill();

            // Mouth
            ctx.strokeStyle = '#0a0a1a';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.arc(x + s * 6, y + s * 4.2, s * 1.5, 0.1, Math.PI - 0.1);
            ctx.stroke();

            // Tail
            ctx.fillStyle = '#ff8a4a';
            ctx.beginPath();
            ctx.moveTo(x + s * 10, y + s * 6);
            ctx.quadraticCurveTo(x + s * 12, y + s * 3, x + s * 11, y + s * 1);
            ctx.lineWidth = s * 1.5;
            ctx.strokeStyle = '#ff8a4a';
            ctx.stroke();
        }

        // ============================================================
        //  INTERACTION SYSTEM
        // ============================================================

        function getNearbyInteractive() {
            const directions = [
                { dx: 0, dy: -1 },
                { dx: 0, dy: 1 },
                { dx: -1, dy: 0 },
                { dx: 1, dy: 0 }
            ];

            for (const dir of directions) {
                const nx = player.x + dir.dx;
                const ny = player.y + dir.dy;
                if (nx >= 0 && nx < cols && ny >= 0 && ny < rows) {
                    const tile = map[ny][nx];
                    if (tile === T.DOOR || tile === T.CLOSET || tile === T.ITEM || 
                        tile === T.CHEST || tile === T.EXIT || tile === T.QUEEN || 
                        tile === T.IAN || tile === T.RESIDENT || tile === T.CAT ||
                        tile === T.MEMORY || tile === T.LETTER || tile === T.PHOTO ||
                        tile === T.DIARY || tile === T.SHADOW || tile === T.MIRROR ||
                        tile === T.BLOOD || tile === T.EYE || tile === T.STAIRS ||
                        tile === T.PORTAL) {
                        return { x: nx, y: ny, tile: tile };
                    }
                }
            }
            return null;
        }

        // ============================================================
        //  DIALOGUE SYSTEM
        // ============================================================

        let dialogueCallback = null;
        let dialogueTimer = null;

        function showDialogue(speaker, text, choices = null, callback = null, autoClose = 0) {
            const box = document.getElementById('dialogueBox');
            const speakerEl = document.getElementById('dialogueSpeaker');
            const textEl = document.getElementById('dialogueText');
            const continueEl = document.getElementById('dialogueContinue');
            const buttonsEl = document.getElementById('dialogueButtons');

            box.style.display = 'block';
            speakerEl.textContent = speaker;
            textEl.innerHTML = text;
            continueEl.style.display = 'none';
            buttonsEl.style.display = 'none';

            if (choices && choices.length > 0) {
                buttonsEl.style.display = 'flex';
                buttonsEl.innerHTML = '';
                for (const choice of choices) {
                    const btn = document.createElement('button');
                    btn.className = 'game-btn ' + (choice.class || '');
                    btn.textContent = choice.label;
                    btn.onclick = function() {
                        if (choice.action) choice.action();
                        if (callback) callback(choice.value);
                    };
                    buttonsEl.appendChild(btn);
                }
            } else {
                continueEl.style.display = 'block';
                continueEl.textContent = '▼ Press SPACE or click to continue';
            }

            dialogueCallback = callback;
            player.inDialogue = true;
            player.gameState = 'dialogue';

            if (autoClose > 0) {
                clearTimeout(dialogueTimer);
                dialogueTimer = setTimeout(() => {
                    closeDialogue();
                }, autoClose);
            }

            box.onclick = function(e) {
                if (e.target === box || e.target === textEl || e.target === continueEl) {
                    if (continueEl.style.display !== 'none') {
                        continueDialogue();
                    }
                }
            };
        }

        function continueDialogue() {
            if (dialogueCallback) {
                const cb = dialogueCallback;
                dialogueCallback = null;
                cb();
            } else {
                closeDialogue();
            }
        }

        function closeDialogue() {
            document.getElementById('dialogueBox').style.display = 'none';
            player.inDialogue = false;
            player.gameState = 'exploring';
            dialogueCallback = null;
            clearTimeout(dialogueTimer);
            updateUI();
        }

        // Keyboard
        document.addEventListener('keydown', function(e) {
            if (e.key === ' ' || e.key === 'Space') {
                e.preventDefault();
                if (player.inDialogue) {
                    const continueEl = document.getElementById('dialogueContinue');
                    if (continueEl.style.display !== 'none') {
                        continueDialogue();
                    }
                } else if (player.gameState === 'exploring') {
                    interact();
                }
            }

            if (!player.inDialogue && player.gameState === 'exploring') {
                let dx = 0, dy = 0;
                if (e.key === 'ArrowUp' || e.key === 'w') { dy = -1; player.facing = 'up'; }
                if (e.key === 'ArrowDown' || e.key === 's') { dy = 1; player.facing = 'down'; }
                if (e.key === 'ArrowLeft' || e.key === 'a') { dx = -1; player.facing = 'left'; }
                if (e.key === 'ArrowRight' || e.key === 'd') { dx = 1; player.facing = 'right'; }

                if (dx !== 0 || dy !== 0) {
                    e.preventDefault();
                    tryMove(dx, dy);
                }
            }
        });

        // ============================================================
        //  MOVEMENT
        // ============================================================

        function tryMove(dx, dy) {
            const nx = player.x + dx;
            const ny = player.y + dy;

            if (nx < 0 || nx >= cols || ny < 0 || ny >= rows) return;

            const tile = map[ny][nx];
            if (tile === T.WALL) return;

            // Special: Endless Corridor looping
            if (tile === T.CRACK && player.mapSection === 2) {
                // Loop around
                if (dx === -1) { player.x = cols - 2; }
                else if (dx === 1) { player.x = 1; }
                else if (dy === -1) { player.y = rows - 2; }
                else if (dy === 1) { player.y = 1; }
                updateUI();
                return;
            }

            // Don't move into NPC tiles unless interacting
            if (tile === T.CAT || tile === T.RESIDENT || tile === T.IAN || 
                tile === T.QUEEN || tile === T.SHADOW) {
                player.x = nx;
                player.y = ny;
                player.facing = dx === 0 ? (dy === -1 ? 'up' : dy === 1 ? 'down' : player.facing) :
                                 dx === -1 ? 'left' : 'right';
                updateUI();
                const nearby = getNearbyInteractive();
                if (nearby && (nearby.tile === T.CAT || nearby.tile === T.RESIDENT || 
                              nearby.tile === T.IAN || nearby.tile === T.QUEEN ||
                              nearby.tile === T.SHADOW)) {
                    interact();
                }
                return;
            }

            player.x = nx;
            player.y = ny;
            player.facing = dx === 0 ? (dy === -1 ? 'up' : dy === 1 ? 'down' : player.facing) :
                             dx === -1 ? 'left' : 'right';

            updateUI();

            // Track map section
            updateMapSection();

            // Check for auto-interactions
            if (tile === T.ITEM || tile === T.CHEST || tile === T.MEMORY || 
                tile === T.LETTER || tile === T.PHOTO || tile === T.DIARY ||
                tile === T.MIRROR || tile === T.BLOOD || tile === T.EYE ||
                tile === T.STAIRS || tile === T.PORTAL) {
                interact();
            }

            // Sanity effects
            if (player.mapSection >= 4) {
                player.sanity = Math.max(0, player.sanity - 0.1);
                if (Math.random() < 0.01) {
                    showDialogue('🧠 YOUR MIND', '<span class="insane">"The walls are breathing..."</span>');
                    setTimeout(closeDialogue, 1500);
                }
            }
        }

        function updateMapSection() {
            // Determine which section the player is in based on position
            if (player.x < 9 && player.y < 8) player.mapSection = 0; // Room 303
            else if (player.x >= 9 && player.x < 14 && player.y < 14) player.mapSection = 1; // Hallway
            else if (player.x >= 14 && player.x < 19 && player.y < 14) player.mapSection = 2; // Endless
            else if (player.x >= 19 && player.x < 28 && player.y < 14) player.mapSection = 3; // Memories
            else if (player.x < 14 && player.y >= 14) player.mapSection = 4; // Mad Wing
            else if (player.x >= 14 && player.x < 21 && player.y >= 14) player.mapSection = 5; // Ian
            else if (player.x >= 21 && player.y >= 14) player.mapSection = 6; // Queen
        }

        // Click to move
        canvas.addEventListener('click', function(e) {
            if (player.inDialogue || player.gameState !== 'exploring') return;

            const rect = canvas.getBoundingClientRect();
            const mx = e.clientX - rect.left;
            const my = e.clientY - rect.top;

            const tx = Math.floor((mx + cameraX) / tileSize);
            const ty = Math.floor((my + cameraY) / tileSize);

            if (tx >= 0 && tx < cols && ty >= 0 && ty < rows) {
                const dx = Math.sign(tx - player.x);
                const dy = Math.sign(ty - player.y);

                if (dx !== 0 && dy !== 0) {
                    if (map[player.y][player.x + dx] !== T.WALL) {
                        tryMove(dx, 0);
                        return;
                    }
                    if (map[player.y + dy][player.x] !== T.WALL) {
                        tryMove(0, dy);
                        return;
                    }
                } else if (dx !== 0) {
                    tryMove(dx, 0);
                } else if (dy !== 0) {
                    tryMove(0, dy);
                }
            }
        });

        // ============================================================
        //  INTERACT
        // ============================================================

        function interact() {
            if (player.inDialogue) return;

            const nearby = getNearbyInteractive();
            if (!nearby) {
                showDialogue('💡 HINT', 'There\'s nothing here. Try exploring.');
                setTimeout(closeDialogue, 1500);
                return;
            }

            const { x, y, tile } = nearby;

            // Check map section for contextual interactions
            switch (tile) {
                case T.CAT: meetCat(); break;
                case T.CLOSET: enterCloset(); break;
                case T.DOOR: openDoor(x, y); break;
                case T.ITEM: pickUpItem(x, y); break;
                case T.CHEST: openChest(x, y); break;
                case T.MEMORY: findMemory(x, y); break;
                case T.LETTER: readLetter(x, y); break;
                case T.PHOTO: viewPhoto(x, y); break;
                case T.DIARY: readDiary(x, y); break;
                case T.MIRROR: lookInMirror(x, y); break;
                case T.BLOOD: investigateBlood(x, y); break;
                case T.EYE: lookAtEye(x, y); break;
                case T.STAIRS: descendStairs(x, y); break;
                case T.PORTAL: enterPortal(x, y); break;
                case T.RESIDENT: talkToResident(x, y); break;
                case T.SHADOW: investigateShadow(x, y); break;
                case T.IAN: faceIan(); break;
                case T.QUEEN: faceQueen(); break;
                case T.EXIT: escapeWonderland(); break;
                default: 
                    showDialogue('💡 HINT', 'You can\'t interact with that.');
                    setTimeout(closeDialogue, 1500);
            }
        }

            }
            updateUI();
        }

        // ============================================================
        //  ESCAPE
        // ============================================================

        function escapeWonderland() {
            if (player.questStep < 8) {
                showDialogue('🚪 EXIT',
                    'The exit is locked. You need to complete your quest.<br>' +
                    `<span style="color: #8888aa;">Progress: ${player.questStep}/8</span>`
                );
                setTimeout(closeDialogue, 2000);
                return;
            }

            showDialogue('🚪 THE EXIT',
                'You stand before the glowing exit.<br><br>' +
                'The cat appears beside you.<br>' +
                '"You\'ve done it, human. You\'ve completed your quest."<br>' +
                '"The Queen is free. The residents are free."<br>' +
                '"Now it\'s time for you to choose your fate."<br><br>' +
                'What do you do?',
                [
                    { label: '🚪 Escape', value: 'escape', class: 'success' },
                    { label: '🌀 Stay in Wonderland', value: 'stay', class: 'wonder' },
                    { label: '💔 Stay with the Queen', value: 'queen', class: 'primary' }
                ],
                function(choice) {
                    closeDialogue();
                    if (choice === 'escape') {
                        showEnding('good', 'The Escape',
                            'You step through the exit.<br><br>' +
                            'You\'re back in JN Hall. The sun is rising.<br>' +
                            'You\'re forever changed by your journey.<br><br>' +
                            '<span class="highlight">✦ You carry the wonder of the adventure in your heart ✦</span>'
                        );
                    } else if (choice === 'stay') {
                        showEnding('neutral', 'The Guardian',
                            'You choose to stay in Wonderland.<br><br>' +
                            'The cat smiles. "I knew you would."<br>' +
                            'You become the new guardian of Wonderland.<br><br>' +
                            '<span class="highlight">✦ You protect the memories forever ✦</span>'
                        );
                    } else {
                        if (player.queenBefriended) {
                            showEnding('good', 'The Companion',
                                'You stay with the Queen.<br><br>' +
                                'She\'s no longer dark. She\'s healing.<br>' +
                                'Together, you rebuild Wonderland.<br><br>' +
                                '<span class="highlight">✦ You found love in the darkness ✦</span>'
                            );
                        } else {
                            showEnding('neutral', 'The Watcher',
                                'You stay with the Queen, watching over her.<br><br>' +
                                'She\'s still healing, but she\'s not alone anymore.<br><br>' +
                                '<span class="highlight">✦ You are her hope ✦</span>'
                            );
                        }
                    }
                }
            );
        }

        // ============================================================
        //  CHAPTER TITLE
        // ============================================================

        function showChapter(title, sub) {
            const el = document.getElementById('chapterTitle');
            document.getElementById('chapterTitleText').textContent = title;
            const subEl = document.getElementById('chapterSubText');
            subEl.textContent = sub;
            subEl.className = player.mapSection >= 4 ? 'insane-sub' : 'sub';
            el.style.opacity = '1';
            setTimeout(() => {
                el.style.opacity = '0';
            }, 2500);
            darkOpacity = 0.3;
            setTimeout(() => {
                darkOpacity = 0;
            }, 2500);
        }

        // ============================================================
        //  ENDING SYSTEM
        // ============================================================

        function showEnding(type, title, text) {
            const box = document.getElementById('dialogueBox');
            box.style.display = 'block';
            document.getElementById('dialogueSpeaker').textContent = `🎬 ${title}`;
            document.getElementById('dialogueText').innerHTML = text;
            document.getElementById('dialogueContinue').style.display = 'none';
            const buttons = document.getElementById('dialogueButtons');
            buttons.style.display = 'flex';
            buttons.innerHTML = `
                <button class="game-btn primary" onclick="resetGame()">🔄 PLAY AGAIN</button>
                <button class="game-btn" onclick="window.location.href='index.html'">🏠 MENU</button>
            `;
            player.gameState = 'dialogue';
            player.inDialogue = true;
            player.questStep = 8;
            updateUI();
            darkOpacity = 0.2;
        }

        // ============================================================
        //  UPDATE UI
        // ============================================================

        function updateUI() {
            document.getElementById('hudHp').textContent = player.hp;
            document.getElementById('hudAct').textContent = ['I','II','III','IV','V','VI','VII'][player.act - 1] || 'VII';
            document.getElementById('hudWonder').textContent = Math.min(100, Math.round(player.wonder));
            document.getElementById('hudSanity').textContent = Math.round(player.sanity);
            document.getElementById('hudStep').textContent = Math.min(player.questStep, 8);
            document.getElementById('hudMaxStep').textContent = 8;

            // Sanity color
            const sanityEl = document.getElementById('hudSanity');
            if (player.sanity > 70) sanityEl.style.color = '#4aff8a';
            else if (player.sanity > 40) sanityEl.style.color = '#ffd93d';
            else sanityEl.style.color = '#ff6b6b';

            const items = [];
            if (player.hasKey) items.push('🔑');
            if (player.hasNote) items.push('📜');
            if (player.hasCandy) items.push('💊');
            if (player.hasCrown) items.push('👑');
            if (player.hasMirror) items.push('🪞');
            if (player.hasClock) items.push('⏰');
            if (player.hasRose) items.push('🌹');
            if (player.hasTea) items.push('🍵');
            if (player.hasCard) items.push('🃏');
            if (player.hasHeart) items.push('❤️');
            if (player.hasLetter) items.push('✉️');
            if (player.hasPhoto) items.push('🖼️');
            if (player.hasDiary) items.push('📖');
            document.getElementById('hudItems').textContent = items.join(' ') || 'None';

            // Quest log
            const questSteps = [
                { id: 'scream', label: 'The Scream' },
                { id: 'fall', label: 'The Fall' },
                { id: 'endless', label: 'The Endless Hall' },
                { id: 'memories', label: 'The Memories' },
                { id: 'madwing', label: 'The Mad Wing' },
                { id: 'ian', label: 'The Bodyguard' },
                { id: 'queen', label: 'The Queen' },
                { id: 'escape', label: 'The Escape' }
            ];

            const list = document.getElementById('questList');
            let html = '';
            for (let i = 0; i < questSteps.length; i++) {
                const step = questSteps[i];
                let cls = '';
                if (i < player.questStep) cls = 'step-done';
                else if (i === player.questStep) cls = 'step-active';
                else cls = 'step-hidden';
                if (i >= 4 && player.mapSection >= 4) cls += ' step-insane';
                html += `<div class="${cls}">${i < player.questStep ? '✅' : '✦'} ${step.label}</div>`;
            }
            list.innerHTML = html;
        }

        // ============================================================
        //  RESET
        // ============================================================

        function resetGame() {
            if (confirm('Reset the game and return to the character creator?')) {
                localStorage.removeItem('jnPlayerState');
                window.location.href = 'index.html';
            }
        }

        // ============================================================
        //  GAME LOOP
        // ============================================================

        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        // ============================================================
        //  INIT
        // ============================================================

        function init() {
            resizeCanvas();
            buildMap();
            player.x = 4;
            player.y = 4;
            player.facing = 'down';
            player.mapSection = 0;
            updateUI();

            // Welcome
            setTimeout(() => {
                showDialogue('🎮 NARRATOR',
                    '<span class="creepy">You wake up to a scream.</span><br><br>' +
                    'It\'s 3:03 AM. The scream came from Room 303.<br>' +
                    'Your heart is racing. You have to check it out.<br><br>' +
                    '<span style="color: #8888aa; font-size: 8px;">Use WASD/Arrow Keys to move. Press SPACE to interact.</span><br>' +
                    '<span style="color: #ff6b6b; font-size: 8px;">🧠 Your sanity drains in the Mad Wing. Find help.</span>'
                );
                setTimeout(closeDialogue, 4500);
            }, 500);

            gameLoop();

            window.addEventListener('resize', function() {
                resizeCanvas();
            });
        }

        console.log('%c✦ JN WONDERLAND: THE ASYLUM ✦', 'font-size:20px; color:#ffd93d;');
        console.log('%c🏚️ A massive labyrinth with 6 distinct sections', 'color:#8888aa;');
        console.log('%c🧠 Sanity mechanic - the deeper you go, the more you lose', 'color:#ff6b9d;');
        console.log(`%c🎮 Player: ${player.name}`, 'color:#6ac8ff;');
        console.log('%c🐱 Find the cat to begin your quest.', 'color:#ff8a4a;');
        console.log('%c🌀 6 sections: Room 303 → Hallway → Endless → Memories → Mad Wing → Ian → Queen', 'color:#a29bfe;');

        init();
    </script>

</body>
</html>
