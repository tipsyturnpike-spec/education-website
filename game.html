<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>John Neumaier Hall - The Complete Adventure</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        
        .game-container {
            position: relative;
            width: 800px;
            height: 600px;
            background: #1a0a2e;
            border: 4px solid #ff00ff;
            box-shadow: 0 0 50px rgba(255, 0, 255, 0.5);
        }
        
        .game-screen {
            position: relative;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        
        #gameCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            image-rendering: pixelated;
        }
        
        .dialogue-box {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(0, 0, 0, 0.9);
            border: 3px solid #00ffff;
            padding: 20px;
            color: #fff;
            font-size: 12px;
            line-height: 1.6;
            display: none;
            z-index: 100;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }
        
        .dialogue-box.active {
            display: block;
            animation: dialogue-appear 0.5s ease-out;
        }
        
        @keyframes dialogue-appear {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        
        .menu {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ff00ff;
            padding: 30px;
            color: #fff;
            text-align: center;
            display: none;
            z-index: 200;
            min-width: 300px;
        }
        
        .menu.active {
            display: block;
        }
        
        .menu h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 20px;
        }
        
        .menu button {
            display: block;
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 12px;
        }
        
        .menu button:hover {
            background: #ff00ff;
            border-color: #fff;
            transform: scale(1.05);
        }
        
        .inventory-screen, .shop-screen, .phone-screen {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.95);
            border: 4px solid #ff00ff;
            padding: 30px;
            color: #fff;
            display: none;
            z-index: 250;
            width: 600px;
            max-height: 500px;
            overflow-y: auto;
        }
        
        .inventory-screen.active, .shop-screen.active, .phone-screen.active {
            display: block;
        }
        
        .inventory-screen h2, .shop-screen h2, .phone-screen h2 {
            color: #ff00ff;
            margin-bottom: 20px;
            font-size: 16px;
            text-align: center;
        }
        
        .inventory-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            justify-content: center;
        }
        
        .inventory-tab {
            padding: 8px 15px;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }
        
        .inventory-tab.active {
            background: #ff00ff;
        }
        
        .inventory-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            min-height: 200px;
        }
        
        .inventory-item, .shop-item, .phone-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid #00ffff;
            cursor: pointer;
            font-size: 10px;
            transition: all 0.3s;
        }
        
        .inventory-item:hover, .shop-item:hover, .phone-item:hover {
            background: rgba(255, 0, 255, 0.3);
            transform: scale(1.02);
        }
        
        .inventory-item.selected {
            background: #ff00ff;
            border-color: #fff;
        }
        
        .item-name {
            flex: 1;
        }
        
        .item-quantity {
            color: #00ffff;
            margin-left: 10px;
        }
        
        .item-price {
            color: #FFD700;
            margin-left: 10px;
        }
        
        .item-description {
            font-size: 10px;
            color: #cccccc;
            margin-top: 5px;
            line-height: 1.4;
        }
        
        .inventory-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            justify-content: center;
        }
        
        .inventory-actions button {
            padding: 10px 20px;
            background: #2d1b4e;
            border: 2px solid #00ffff;
            color: #fff;
            cursor: pointer;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
        }
        
        .inventory-actions button:hover {
            background: #ff00ff;
        }
        
        .money-display {
            text-align: center;
            margin-bottom: 15px;
            color: #FFD700;
            font-size: 14px;
        }
        
        .hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            color: #fff;
            font-size: 10px;
            z-index: 50;
            pointer-events: none;
        }
        
        .hud-left, .hud-right {
            background: rgba(0, 0, 0, 0.7);
            padding: 10px;
            border: 2px solid #00ffff;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }
        
        .hud-left {
            text-align: left;
        }
        
        .hud-right {
            text-align: right;
        }
        
        .loading-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            flex-direction: column;
        }
        
        .loading-text {
            color: #ff00ff;
            font-size: 24px;
            animation: loading-pulse 1s infinite;
            text-align: center;
            line-height: 2;
        }
        
        @keyframes loading-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .interaction-prompt {
            position: absolute;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #ff00ff;
            color: #fff;
            padding: 10px 20px;
            font-size: 10px;
            display: none;
            z-index: 75;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.5);
        }
        
        .interaction-prompt.active {
            display: block;
        }
        
        .combat-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0a2e 0%, #2d1b4e 50%, #1a0a2e 100%);
            display: none;
            z-index: 300;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .combat-screen.active {
            display: flex;
        }
        
        .combat-enemy-area {
            width: 80%;
            height: 35%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            margin-bottom: 10px;
        }
        
        .combat-enemy {
            width: 100px;
            height: 100px;
            animation: enemy-float 2s ease-in-out infinite;
        }
        
        @keyframes enemy-float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        
        .combat-party-area {
            width: 80%;
            height: 20%;
            display: flex;
            align-items: center;
            justify-content: space-around;
            margin-bottom: 10px;
            gap: 20px;
        }
        
        .combat-party-member {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #00ffff;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .combat-party-member.active {
            border-color: #ff00ff;
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.5);
        }
        
        .combat-player {
            width: 50px;
            height: 50px;
        }
        
        .combat-stats {
            color: #fff;
            font-size: 9px;
            line-height: 1.6;
        }
        
        .combat-menu {
            width: 80%;
            background: rgba(0, 0, 0, 0.8);
            border: 3px solid #00ffff;
            padding: 15px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .combat-button {
            padding: 12px 18px;
            background: #2d1b4e;
            border: 2px solid #ff00ff;
            color: #fff;
            font-family: 'Press Start 2P', cursive;
            font-size: 11px;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .combat-button:hover {
            background: #ff00ff;
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255, 0, 255, 0.8);
        }
        
        .combat-message {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 12px;
            text-align: center;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px;
            border: 2px solid #00ffff;
            display: none;
            z-index: 350;
            min-width: 300px;
        }
        
        .combat-message.active {
            display: block;
        }
        
        .combat-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
            animation: psychedelic-shift 5s linear infinite;
        }
        
        @keyframes psychedelic-shift {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        
        .psi-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        
        .psi-menu.active {
            display: flex;
        }
        
        .item-menu {
            display: none;
            flex-direction: column;
            gap: 10px;
            max-height: 200px;
            overflow-y: auto;
        }
        
        .item-menu.active {
            display: flex;
        }
        
        .phone-screen {
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 100%);
            border: 4px solid #00ff00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }
        
        .phone-screen h2 {
            color: #00ff00;
        }
        
        .phone-item {
            border-color: #00ff00;
        }
        
        .phone-item:hover {
            background: rgba(0, 255, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <div class="game-screen" id="gameScreen">
            <canvas id="gameCanvas" width="800" height="600"></canvas>
            
            <div class="hud">
                <div class="hud-left">
                    <div id="hudName">PLAYER</div>
                    <div>LV: <span id="hudLevel">1</span></div>
                    <div>HP: <span id="hudHP">30/30</span></div>
                    <div>PP: <span id="hudPP">10/10</span></div>
                </div>
                <div class="hud-right">
                    <div>EXP: <span id="hudEXP">0</span></div>
                    <div>MONEY: $<span id="hudMoney">0</span></div>
                    <div>LOCATION: <span id="hudLocation">Room 303</span></div>
                </div>
            </div>
            
            <div class="interaction-prompt" id="interactionPrompt">
                [E] TO INTERACT
            </div>
            
            <div class="dialogue-box" id="dialogueBox">
                <p id="dialogueText"></p>
                <p style="text-align: center; margin-top: 10px; color: #00ffff; font-size: 10px;">
                    [PRESS SPACE TO CONTINUE]
                </p>
            </div>
            
            <div class="menu" id="gameMenu">
                <h2>MENU</h2>
                <button onclick="toggleMenu()">RESUME</button>
                <button onclick="showInventory()">INVENTORY</button>
                <button onclick="showPhone()">PHONE</button>
                <button onclick="showStatus()">STATUS</button>
                <button onclick="saveGame()">SAVE</button>
                <button onclick="loadGame()">LOAD</button>
                <button onclick="returnToTitle()">TITLE SCREEN</button>
            </div>
            
            <div class="inventory-screen" id="inventoryScreen">
                <h2>INVENTORY</h2>
                <div class="money-display">MONEY: $<span id="inventoryMoney">0</span></div>
                <div class="inventory-tabs">
                    <button class="inventory-tab active" onclick="switchInventoryTab('items', this)">ITEMS</button>
                    <button class="inventory-tab" onclick="switchInventoryTab('weapons', this)">WEAPONS</button>
                    <button class="inventory-tab" onclick="switchInventoryTab('keyItems', this)">KEY ITEMS</button>
                </div>
                <div class="inventory-list" id="inventoryList">
                </div>
                <div class="inventory-actions">
                    <button onclick="closeInventory()">CLOSE</button>
                </div>
            </div>
            
            <div class="phone-screen" id="phoneScreen">
                <h2>📱 PHONE</h2>
                <div class="money-display">YOUR MONEY: $<span id="phoneMoney">0</span></div>
                <div class="inventory-list" id="phoneList">
                </div>
                <div class="inventory-actions">
                    <button onclick="closePhone()">CLOSE PHONE</button>
                </div>
            </div>
            
            <div class="shop-screen" id="shopScreen">
                <h2 id="shopTitle">SHADY MERCHANT</h2>
                <div class="money-display">YOUR MONEY: $<span id="shopMoney">0</span></div>
                <div class="inventory-list" id="shopList">
                </div>
                <div class="inventory-actions">
                    <button onclick="closeShop()">LEAVE SHOP</button>
                </div>
            </div>
            
            <div class="combat-screen" id="combatScreen">
                <div class="combat-background"></div>
                <div class="combat-enemy-area" id="combatEnemyArea">
                    <canvas id="combatEnemyCanvas" class="combat-enemy" width="100" height="100"></canvas>
                </div>
                <div class="combat-party-area" id="combatPartyArea">
                </div>
                <div class="combat-menu" id="combatMenu">
                    <button class="combat-button" onclick="playerAttack()">FIGHT</button>
                    <button class="combat-button" onclick="showPSIMenu()">PSYCH</button>
                    <button class="combat-button" onclick="showItemMenu()">ITEM</button>
                    <button class="combat-button" onclick="playerDefend()">GUARD</button>
                    <button class="combat-button" onclick="playerRun()">RUN</button>
                </div>
                <div class="psi-menu" id="psiMenu">
                    <button class="combat-button" onclick="useCoffeeBreak()">COFFEE BREAK (5 PP)</button>
                    <button class="combat-button" onclick="useAllNighter()">ALL-NIGHTER (8 PP)</button>
                    <button class="combat-button" onclick="useRamenHeal()">RAMEN BREAK (5 PP)</button>
                    <button class="combat-button" onclick="hidePSIMenu()">BACK</button>
                </div>
                <div class="item-menu" id="itemMenu">
                </div>
            </div>
            
            <div class="combat-message" id="combatMessage">
                <p id="combatMessageText"></p>
            </div>
            
            <div class="loading-screen" id="loadingScreen">
                <div class="loading-text">LOADING...</div>
            </div>
        </div>
    </div>
    
    <script>
        // ============ SOUND SYSTEM ============
        const soundSystem = {
            audioContext: null,
            
            init() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                } catch(e) {
                    console.log('Audio not supported');
                }
            },
            
            playSound(type) {
                if (!this.audioContext) return;
                
                const oscillator = this.audioContext.createOscillator();
                const gainNode = this.audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(this.audioContext.destination);
                
                switch(type) {
                    case 'interact':
                        oscillator.frequency.setValueAtTime(800, this.audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(1200, this.audioContext.currentTime + 0.1);
                        gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.1);
                        oscillator.start(this.audioContext.currentTime);
                        oscillator.stop(this.audioContext.currentTime + 0.1);
                        break;
                        
                    case 'combat':
                        oscillator.frequency.setValueAtTime(200, this.audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(400, this.audioContext.currentTime + 0.3);
                        gainNode.gain.setValueAtTime(0.4, this.audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.3);
                        oscillator.start(this.audioContext.currentTime);
                        oscillator.stop(this.audioContext.currentTime + 0.3);
                        break;
                        
                    case 'victory':
                        oscillator.frequency.setValueAtTime(600, this.audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(1200, this.audioContext.currentTime + 0.4);
                        gainNode.gain.setValueAtTime(0.4, this.audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.4);
                        oscillator.start(this.audioContext.currentTime);
                        oscillator.stop(this.audioContext.currentTime + 0.4);
                        break;
                        
                    case 'damage':
                        oscillator.type = 'sawtooth';
                        oscillator.frequency.setValueAtTime(150, this.audioContext.currentTime);
                        oscillator.frequency.exponentialRampToValueAtTime(50, this.audioContext.currentTime + 0.2);
                        gainNode.gain.setValueAtTime(0.3, this.audioContext.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + 0.2);
                        oscillator.start(this.audioContext.currentTime);
                        oscillator.stop(this.audioContext.currentTime + 0.2);
                        break;
                        
                    case 'levelup':
                        [523, 659, 784, 1047].forEach((freq, i) => {
                            const osc = this.audioContext.createOscillator();
                            const gain = this.audioContext.createGain();
                            osc.connect(gain);
                            gain.connect(this.audioContext.destination);
                            osc.frequency.setValueAtTime(freq, this.audioContext.currentTime + i * 0.1);
                            gain.gain.setValueAtTime(0.3, this.audioContext.currentTime + i * 0.1);
                            gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + i * 0.1 + 0.1);
                            osc.start(this.audioContext.currentTime + i * 0.1);
                            osc.stop(this.audioContext.currentTime + i * 0.1 + 0.1);
                        });
                        break;
                        
                    case 'phone':
                        [440, 550].forEach((freq, i) => {
                            const osc = this.audioContext.createOscillator();
                            const gain = this.audioContext.createGain();
                            osc.connect(gain);
                            gain.connect(this.audioContext.destination);
                            osc.frequency.setValueAtTime(freq, this.audioContext.currentTime + i * 0.15);
                            gain.gain.setValueAtTime(0.4, this.audioContext.currentTime + i * 0.15);
                            gain.gain.exponentialRampToValueAtTime(0.01, this.audioContext.currentTime + i * 0.15 + 0.15);
                            osc.start(this.audioContext.currentTime + i * 0.15);
                            osc.stop(this.audioContext.currentTime + i * 0.15 + 0.15);
                        });
                        break;
                }
            }
        };
        
        // ============ ITEM DEFINITIONS ============
        const items = {
            ramen: { name: 'Instant Ramen', type: 'item', healAmount: 20, description: 'Cheap instant noodles. Restores 20 HP.', price: 5, usable: true },
            energyDrink: { name: 'Energy Drink', type: 'item', healAmount: 50, description: 'Highly caffeinated. Restores 50 HP.', price: 15, usable: true },
            coffee: { name: 'Coffee', type: 'item', ppRestore: 10, description: 'Restores 10 PP. Essential for college students.', price: 8, usable: true },
            pizza: { name: 'Cold Pizza', type: 'item', healAmount: 100, description: 'Leftover pizza. Restores 100 HP.', price: 20, usable: true },
            textbook: { name: 'Textbook', type: 'weapon', attackBonus: 5, description: 'Heavy textbook. +5 Attack.', price: 30, usable: false },
            laptop: { name: 'Laptop', type: 'weapon', attackBonus: 10, description: 'Can be used as a weapon. +10 Attack.', price: 75, usable: false },
            deskLamp: { name: 'Desk Lamp', type: 'weapon', attackBonus: 3, description: 'A sturdy desk lamp. +3 Attack.', price: 15, usable: false },
            backpack: { name: 'Heavy Backpack', type: 'weapon', attackBonus: 8, description: 'Full of textbooks. +8 Attack.', price: 50, usable: false },
            forestKey: { name: 'Forest Key', type: 'keyItem', description: 'A rusted key that opens the Forest Gate.', price: 0, usable: false },
            graveyardKey: { name: 'Graveyard Key', type: 'keyItem', description: 'A bone-shaped key that opens the Village Gate.', price: 0, usable: false },
            villageKey: { name: 'Village Key', type: 'keyItem', description: 'A brass key that opens the Upper Village Gate.', price: 0, usable: false },
            castleKey: { name: 'Castle Key', type: 'keyItem', description: 'An ornate key that opens the Castle Walls gate.', price: 0, usable: false }
        };
        
        // ============ GAME STATE ============
        let gameState = {
            character: null,
            currentArea: 'room303',
            gameTime: 0,
            paused: false,
            inDialogue: false,
            dialogueQueue: [],
            pendingExit: null,
            pendingShop: null,
            pendingBoss: null,
            player: { x: 400, y: 300, direction: 'down', moving: false, speed: 3 },
            keys: { up: false, down: false, left: false, right: false, interact: false },
            flags: { 
                heardIzzyScream: false, 
                enteredCloset: false, 
                foundPortal: false, 
                enteredForest: false, 
                metBekah: false, 
                foundForestKey: false,
                forestKeyRevealed: false,
                openedForestGate: false,
                enteredGraveyard: false,
                foundGraveyardKey: false,
                openedVillageGate: false,
                enteredVillage: false,
                foundVillageKey: false,
                openedUpperVillageGate: false,
                enteredUpperVillage: false,
                foundCastleKey: false,
                openedCastleWallsGate: false,
                enteredCastleWalls: false,
                defeatedIan: false,
                enteredCastle: false,
                defeatedRylee: false,
                rescuedIzzy: false
            },
            combat: { 
                active: false, 
                enemy: null, 
                turn: 'player', 
                playerDefending: false, 
                messageQueue: [], 
                activePartyMember: 0

        function spawnEnemies() {
            const map = maps[gameState.currentArea];
            gameState.visibleEnemies = [];
            
            if (!map.enemies || map.enemies.length === 0) return;
            
            const numEnemies = 2 + Math.floor(Math.random() * 2);
            
            for (let i = 0; i < numEnemies; i++) {
                const enemyType = map.enemies[Math.floor(Math.random() * map.enemies.length)];
                let x, y;
                let attempts = 0;
                
                do {
                    x = Math.floor(Math.random() * (map.width - 6)) + 3;
                    y = Math.floor(Math.random() * (map.height - 6)) + 3;
                    attempts++;
                } while (map.collisionMap[y][x] !== 0 && attempts < 50);
                
                if (map.collisionMap[y][x] === 0) {
                    gameState.visibleEnemies.push({
                        id: i,
                        type: enemyType,
                        x: x,
                        y: y,
                        direction: 'down',
                        moveTimer: 0,
                        moveInterval: 60 + Math.floor(Math.random() * 120)
                    });
                }
            }
        }
        
        function updateVisibleEnemies() {
            const map = maps[gameState.currentArea];
            
            gameState.visibleEnemies.forEach(enemy => {
                enemy.moveTimer++;
                
                if (enemy.moveTimer >= enemy.moveInterval) {
                    enemy.moveTimer = 0;
                    enemy.moveInterval = 60 + Math.floor(Math.random() * 120);
                    
                    const directions = ['up', 'down', 'left', 'right'];
                    const direction = directions[Math.floor(Math.random() * directions.length)];
                    
                    let newX = enemy.x;
                    let newY = enemy.y;
                    
                    switch(direction) {
                        case 'up': newY--; break;
                        case 'down': newY++; break;
                        case 'left': newX--; break;
                        case 'right': newX++; break;
                    }
                    
                    if (newX > 0 && newX < map.width - 1 && newY > 0 && newY < map.height - 1 && map.collisionMap[newY][newX] === 0) {
                        enemy.x = newX;
                        enemy.y = newY;
                        enemy.direction = direction;
                    }
                }
            });
        }
        
        function checkEnemyCollision() {
            const map = maps[gameState.currentArea];
            const playerTileX = Math.floor(gameState.player.x / map.tileSize);
            const playerTileY = Math.floor(gameState.player.y / map.tileSize);
            
            gameState.visibleEnemies = gameState.visibleEnemies.filter(enemy => {
                const distance = Math.abs(enemy.x - playerTileX) + Math.abs(enemy.y - playerTileY);
                
                if (distance <= 1) {
                    startCombat(enemy.type);
                    return false;
                }
                return true;
            });
        }
        
        function drawVisibleEnemies(ctx) {
            const map = maps[gameState.currentArea];
            const tileSize = map.tileSize;
            
            gameState.visibleEnemies.forEach(enemy => {
                const x = enemy.x * tileSize;
                const y = enemy.y * tileSize;
                const enemyData = enemies[enemy.type];
                
                ctx.fillStyle = enemyData.color;
                ctx.fillRect(x, y, tileSize, tileSize);
                
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(x + 5, y + 5, 5, 5);
                ctx.fillRect(x + 12, y + 5, 5, 5);
                
                ctx.strokeStyle = '#000000';
                ctx.lineWidth = 1;
                ctx.strokeRect(x, y, tileSize, tileSize);
            });
        }

            }

            };

                const parsed = JSON.parse(saveData);
                gameState = { ...gameState, ...parsed };

                gameState.flags = parsed.flags || gameState.flags;
                gameState.party = parsed.party || gameState.party;

        function addItem(itemId, quantity = 1) {
            const existingItem = gameState.inventory.find(item => item.id === itemId);
            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                gameState.inventory.push({ id: itemId, quantity: quantity });
            }
        }
        
        function removeItem(itemId, quantity = 1) {
            const itemIndex = gameState.inventory.findIndex(item => item.id === itemId);
            if (itemIndex !== -1) {
                gameState.inventory[itemIndex].quantity -= quantity;
                if (gameState.inventory[itemIndex].quantity <= 0) {
                    gameState.inventory.splice(itemIndex, 1);
                }
            }
        }
        
        function hasItem(itemId) {
            return gameState.inventory.some(item => item.id === itemId);
        }
        
        function getItemQuantity(itemId) {
            const item = gameState.inventory.find(item => item.id === itemId);
            return item ? item.quantity : 0;
        }
        
        function useItem(itemId, targetPartyMember = null) {
            const itemData = items[itemId];
            const target = targetPartyMember !== null ? targetPartyMember : gameState.combat.activePartyMember;
            const partyMember = gameState.party[target];
            
            if (!itemData || !itemData.usable) return false;
            
            if (itemData.healAmount) {
                partyMember.hp = Math.min(partyMember.maxHp, partyMember.hp + itemData.healAmount);
                removeItem(itemId);
                updateHUD();
                return true;
            }
            
            if (itemData.ppRestore) {
                partyMember.pp = Math.min(partyMember.maxPp, partyMember.pp + itemData.ppRestore);
                removeItem(itemId);
                updateHUD();
                return true;
            }
            
            return false;
        }
        
        function equipWeapon(itemId) {
            const itemData = items[itemId];
            if (!itemData || itemData.type !== 'weapon') return;
            gameState.equippedWeapon = itemId;
            gameState.party[0].attack = 5 + itemData.attackBonus;
            updateHUD();
        }

                    member.pp = member.maxPp;

        function drawCombatEnemy() {

            const enemy = gameState.combat.enemy;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            switch(enemy.sprite) {
                case 'ian':
                    ctx.fillStyle = '#8B0000';
                    ctx.fillRect(20, 20, 60, 70);
                    ctx.fillStyle = '#A00000';
                    ctx.fillRect(25, 15, 50, 15);
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(30, 10, 40, 10);
                    ctx.fillStyle = '#000000';
                    ctx.fillRect(40, 35, 8, 8);
                    ctx.fillRect(55, 35, 8, 8);
                    break;
                case 'rylee':
                    ctx.fillStyle = '#FF00FF';
                    ctx.fillRect(25, 20, 50, 60);
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(30, 15, 40, 15);
                    ctx.fillStyle = '#FFD700';
                    ctx.fillRect(35, 10, 30, 10);
                    ctx.fillStyle = '#FF0000';
                    ctx.fillRect(40, 35, 8, 8);
                    ctx.fillRect(55, 35, 8, 8);
                    break;
                case 'laundry':
                    ctx.fillStyle = '#808080';
                    ctx.fillRect(30, 50, 40, 30);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(25, 45, 15, 15);
                    ctx.fillRect(60, 45, 15, 15);
                    break;
                default:

        function playerAttack() {
            if (gameState.combat.turn !== 'player') return;
            
            const partyMember = gameState.party[gameState.combat.activePartyMember];
            const enemy = gameState.combat.enemy;
            
            let damage = Math.max(1, partyMember.attack - enemy.defense + Math.floor(Math.random() * 3));
            
            if (gameState.combat.playerDefending) {
                damage = Math.floor(damage * 0.5);
                gameState.combat.playerDefending = false;
            }
            
            enemy.hp -= damage;
            showCombatMessage(`${partyMember.name} attacks! ${damage} damage!`);
            
            if (enemy.hp <= 0) {
                endCombat(true);
            } else {
                gameState.combat.turn = 'enemy';
                setTimeout(enemyTurn, 1500);
            }
        }
        
        function useCoffeeBreak() {
            if (gameState.combat.turn !== 'player') return;
            
            const partyMember = gameState.party[gameState.combat.activePartyMember];
            const ability = psychicAbilities.coffeeBreak;
            
            if (partyMember.pp < ability.cost) {
                showCombatMessage('Not enough PP!');

            }
            
            const enemy = gameState.combat.enemy;

            updateCombatPartyDisplay();

            showCombatMessage(`${partyMember.name} uses ${ability.name}! ${damage} damage!`);
            
            if (enemy.hp <= 0) {
                endCombat(true);
            } else {
                gameState.combat.turn = 'enemy';
                setTimeout(enemyTurn, 1500);
            }
        }

        function useRamenHeal() {
            if (gameState.combat.turn !== 'player') return;
            
            const partyMember = gameState.party[gameState.combat.activePartyMember];
            const ability = psychicAbilities.ramenHeal;
            
            if (partyMember.pp < ability.cost) {

            partyMember.pp -= ability.cost;
            partyMember.hp = Math.min(partyMember.maxHp, partyMember.hp + ability.healAmount);
            updateCombatPartyDisplay();
            hidePSIMenu();
            
            showCombatMessage(`${partyMember.name} heals ${ability.healAmount} HP!`);
            
            gameState.combat.turn = 'enemy';

        function playerDefend() {
            if (gameState.combat.turn !== 'player') return;
            
            gameState.combat.playerDefending = true;
            showCombatMessage(`${gameState.party[gameState.combat.activePartyMember].name} defends!`);
            gameState.combat.turn = 'enemy';
            setTimeout(enemyTurn, 1000);
        }
        
        function playerRun() {
            if (gameState.combat.turn !== 'player') return;
            
            const escapeChance = gameState.combat.enemy.isBoss ? 0 : 0.7;
            if (Math.random() < escapeChance) {
                endCombat(false);
                showCombatMessage('You escaped!');
            } else {
                showCombatMessage(gameState.combat.enemy.isBoss ? 'Cannot escape from a boss!' : 'Couldn\'t escape!');
                gameState.combat.turn = 'enemy';
                setTimeout(enemyTurn, 1000);
            }
        }
        
        function enemyTurn() {
            const enemy = gameState.combat.enemy;
            
            const alivePartyMembers = gameState.party.filter(member => member.hp > 0);
            if (alivePartyMembers.length === 0) {
                endCombat(false);
                return;
            }
            
            const target = alivePartyMembers[Math.floor(Math.random() * alivePartyMembers.length)];
            const attack = enemy.attacks[Math.floor(Math.random() * enemy.attacks.length)];
            let damage = Math.max(1, Math.floor(enemy.attack * attack.power - target.defense));
            
            if (gameState.combat.playerDefending) {
                damage = Math.floor(damage * 0.5);
                gameState.combat.playerDefending = false;
            }
            
            target.hp -= damage;
            updateCombatPartyDisplay();
            updateHUD();
            soundSystem.playSound('damage');
            
            showCombatMessage(`${enemy.name} uses ${attack.name}! ${damage} damage!`);
            
            const allDefeated = gameState.party.every(member => member.hp <= 0);
            
            if (allDefeated) {
                endCombat(false);
                setTimeout(() => {
                    gameState.party.forEach(member => {
                        member.hp = member.maxHp;
                        member.pp = member.maxPp;
                    });
                    gameState.currentArea = 'room303';
                    gameState.player.x = 400;
                    gameState.player.y = 300;
                    spawnEnemies();
                    updateHUD();
                }, 3000);
            } else {
                gameState.combat.turn = 'player';
            }
        }
        
        function endCombat(victory) {
            gameState.combat.active = false;
            document.getElementById('combatScreen').classList.remove('active');
            
            if (victory) {
                const enemy = gameState.combat.enemy;
                
                gameState.party.forEach(member => {
                    if (member.hp > 0) {
                        member.exp += enemy.exp;
                        member.money = (member.money || 0) + enemy.money;
                        
                        const expNeeded = member.level * 10;
                        if (member.exp >= expNeeded) {
                            member.level++;
                            member.exp -= expNeeded;
                            member.maxHp += 5;
                            member.hp = member.maxHp;
                            member.maxPp += 3;
                            member.pp = member.maxPp;
                            member.attack += 2;
                            member.defense += 1;
                            member.speed += 1;
                            
                            soundSystem.playSound('levelup');
                            showCombatMessage(`${member.name} reached level ${member.level}!`);
                        }
                    }
                });
                
                if (enemy.isBoss && enemy.name.includes('IAN')) {
                    gameState.flags.defeatedIan = true;
                    showCombatMessage('IAN has been defeated! The castle gate is open!');
                }
                
                if (enemy.isBoss && enemy.name.includes('RYLEE')) {
                    gameState.flags.defeatedRylee = true;
                    showCombatMessage('RYLEE has been defeated! Izzy is free!');
                }
                
                soundSystem.playSound('victory');
                updateHUD();
            }
        }
        
        function updatePlayer() {
            const map = maps[gameState.currentArea];
            const player = gameState.player;
            
            let dx = 0;
            let dy = 0;
            
            if (gameState.keys.up) { dy = -player.speed; player.direction = 'up'; }
            if (gameState.keys.down) { dy = player.speed; player.direction = 'down'; }
            if (gameState.keys.left) { dx = -player.speed; player.direction = 'left'; }
            if (gameState.keys.right) { dx = player.speed; player.direction = 'right'; }
            
            player.moving = dx !== 0 || dy !== 0;
            
            if (dx !== 0 && canMove(player.x + dx, player.y, map)) player.x += dx;
            if (dy !== 0 && canMove(player.x, player.y + dy, map)) player.y += dy;
            
            checkAreaTransition();
        }
        
        function canMove(x, y, map) {
            const tileX = Math.floor(x / map.tileSize);
            const tileY = Math.floor(y / map.tileSize);
            
            if (tileX < 0 || tileX >= map.width || tileY < 0 || tileY >= map.height) return false;
            
            return map.collisionMap[tileY][tileX] === 0;
        }
        
        function checkAreaTransition() {
            const map = maps[gameState.currentArea];
            const player = gameState.player;
            
            map.exits.forEach(exit => {
                const exitTileX = exit.x * map.tileSize;
                const exitTileY = exit.y * map.tileSize;
                
                if (Math.abs(player.x - exitTileX) < map.tileSize / 2 &&
                    Math.abs(player.y - exitTileY) < map.tileSize / 2) {
                    
                    if (exit.targetArea === 'graveyard' && !gameState.flags.openedForestGate) {
                        if (!hasItem('forestKey')) {
                            showDialogue('The gate is locked. You need the Forest Key...');
                            gameState.inDialogue = true;
                            return;
                        } else {
                            gameState.flags.openedForestGate = true;
                        }
                    }
                    
                    if (exit.targetArea === 'village' && !gameState.flags.openedVillageGate) {
                        if (!hasItem('graveyardKey')) {
                            showDialogue('The village gate is locked. You need the Graveyard Key...');
                            gameState.inDialogue = true;
                            return;
                        } else {
                            gameState.flags.openedVillageGate = true;
                        }
                    }
                    
                    if (exit.targetArea === 'upperVillage' && !gameState.flags.openedUpperVillageGate) {
                        if (!hasItem('villageKey')) {
                            showDialogue('The Upper Village gate is locked. You need the Village Key...');
                            gameState.inDialogue = true;
                            return;
                        } else {
                            gameState.flags.openedUpperVillageGate = true;
                        }
                    }
                    
                    if (exit.targetArea === 'castleWalls' && !gameState.flags.openedCastleWallsGate) {
                        if (!hasItem('castleKey')) {
                            showDialogue('The Castle Walls gate is locked. You need the Castle Key...');
                            gameState.inDialogue = true;
                            return;
                        } else {
                            gameState.flags.openedCastleWallsGate = true;
                        }
                    }
                    
                    if (exit.targetArea === 'castle' && !gameState.flags.defeatedIan) {
                        showDialogue('IAN blocks the castle gate! You must defeat him first!');
                        gameState.inDialogue = true;
                        return;
                    }
                    
                    if (exit.transitionText) {
                        transitionWithDialogue(exit);
                    } else {
                        transitionArea(exit.targetArea, exit.targetX, exit.targetY);
                    }
                }
            });
        }
        
        function transitionWithDialogue(exit) {
            gameState.inDialogue = true;
            gameState.dialogueQueue = [
                exit.transitionText,
                null
            ];
            showDialogue(gameState.dialogueQueue.shift());
            gameState.pendingExit = exit;
        }
        
        function transitionArea(areaId, targetX, targetY) {

        function checkInteractions() {
            const map = maps[gameState.currentArea];
            const player = gameState.player;
            const interactRange = 40;
            
            let nearInteraction = false;
            
            map.npcs.forEach(npc => {
                const npcX = npc.x * map.tileSize;
                const npcY = npc.y * map.tileSize;
                
                if (Math.abs(player.x - npcX) < interactRange &&
                    Math.abs(player.y - npcY) < interactRange) {
                    nearInteraction = true;
                    if (gameState.keys.interact) interactWithNPC(npc);
                }
            });
            
            map.objects.forEach(obj => {
                if (obj.hidden) return;
                
                const objX = obj.x * map.tileSize;
                const objY = obj.y * map.tileSize;
                
                if (Math.abs(player.x - objX) < interactRange &&
                    Math.abs(player.y - objY) < interactRange) {
                    nearInteraction = true;
                    if (gameState.keys.interact) interactWithObject(obj);
                }
            });
            
            const prompt = document.getElementById('interactionPrompt');
            if (nearInteraction && !gameState.inDialogue) {
                prompt.classList.add('active');
            } else {
                prompt.classList.remove('active');
            }
        }

            const ctx = canvas.getContext('2d');
            const map = maps[gameState.currentArea];
            
            ctx.fillStyle = map.backgroundColor;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            for (let y = 0; y < map.height; y++) {
                for (let x = 0; x < map.width; x++) {
                    if (map.collisionMap[y][x] === 0) {
                        drawFloorTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize, map.floorColor);
                    }
                }
            }
            
            for (let y = 0; y < map.height; y++) {
                for (let x = 0; x < map.width; x++) {
                    if (map.collisionMap[y][x] === 1) {
                        if (gameState.currentArea === 'darkForest') {
                            drawTreeTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                        } else if (gameState.currentArea === 'graveyard') {
                            drawTombstoneTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                        } else if (gameState.currentArea === 'village' || gameState.currentArea === 'upperVillage') {
                            drawBuildingTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                        } else if (gameState.currentArea === 'castleWalls') {
                            drawCastleWallTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                        } else if (gameState.currentArea === 'castle') {
                            drawCastleTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize);
                        } else {
                            drawWallTile(ctx, x * map.tileSize, y * map.tileSize, map.tileSize, map.wallColor);
                        }
                    }
                }
            }
            
            map.objects.forEach(obj => {
                if (!obj.hidden) drawObject(ctx, obj, map.tileSize);
            });
            
            drawVisibleEnemies(ctx);
            map.npcs.forEach(npc => drawNPC(ctx, npc, map.tileSize));
            drawPlayer(ctx);
        }
        
        function drawFloorTile(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(x + 2, y + 2, size - 4, size - 4);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.1)';
            ctx.fillRect(x + 4, y + 4, size - 8, size - 8);
        }
        
        function drawWallTile(ctx, x, y, size, color) {
            ctx.fillStyle = color;
            ctx.fillRect(x, y, size, size);
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.3)';
            ctx.lineWidth = 1;
            ctx.strokeRect(x, y, size, size);
        }
        
        function drawTreeTile(ctx, x, y, size) {
            ctx.fillStyle = '#0a2a0a';
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#1a4a1a';
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/2, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillStyle = '#0a3a0a';
            ctx.beginPath();
            ctx.arc(x + size/2, y + size/2, size/3, 0, Math.PI * 2);
            ctx.fill();
        }
        
        function drawTombstoneTile(ctx, x, y, size) {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#808080';
            ctx.fillRect(x + 5, y + 3, size - 10, size - 6);
        }
        
        function drawBuildingTile(ctx, x, y, size) {
            ctx.fillStyle = '#4a3a2a';
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#5a4a3a';
            ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
        }
        
        function drawCastleWallTile(ctx, x, y, size) {
            ctx.fillStyle = '#3a3a4a';
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#4a4a5a';
            ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
        }
        
        function drawCastleTile(ctx, x, y, size) {
            ctx.fillStyle = '#2a0a2a';
            ctx.fillRect(x, y, size, size);
            ctx.fillStyle = '#3a1a3a';
            ctx.fillRect(x + 3, y + 3, size - 6, size - 6);
        }
        
        function drawObject(ctx, obj, tileSize) {
            const x = obj.x * tileSize;
            const y = obj.y * tileSize;
            
            switch(obj.type) {
                case 'bed':
                    ctx.fillStyle = '#4169E1';
                    ctx.fillRect(x, y, tileSize * 3, tileSize * 2);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(x + 5, y + 5, tileSize * 2, tileSize);
                    break;
                case 'desk':
                    ctx.fillStyle = '#8B4513';
                    ctx.fillRect(x, y, tileSize * 2, tileSize);
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(x, y + tileSize, tileSize * 2, tileSize/2);
                    break;
                case 'bookshelf':
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(x, y, tileSize, tileSize * 3);
                    for (let i = 0; i < 3; i++) {
                        ctx.fillStyle = ['#FF0000', '#00FF00', '#0000FF'][i];
                        ctx.fillRect(x + 2, y + i * tileSize + 2, tileSize - 4, tileSize - 4);
                    }
                    break;
                case 'clothes':
                    ctx.fillStyle = '#FF69B4';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    break;
                case 'boxes':
                    ctx.fillStyle = '#8B7355';
                    ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
                    break;
                case 'portal':
                    const time = Date.now() / 1000;
                    const pulse = Math.sin(time * 3) * 0.3 + 0.7;
                    ctx.fillStyle = `rgba(255, 0, 255, ${pulse})`;
                    ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
                    break;
                case 'key':
                    ctx.fillStyle = '#FFD700';
                    ctx.beginPath();
                    ctx.arc(x + tileSize/2, y + tileSize/3, tileSize/4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillRect(x + tileSize/2, y + tileSize/3, tileSize/3, tileSize/6);
                    break;
                case 'gate':
                    ctx.fillStyle = '#654321';
                    ctx.fillRect(x, y, tileSize * 3, tileSize * 2);
                    break;
                case 'note':
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillRect(x, y, tileSize, tileSize);
                    break;
            }
        }
        
        function drawNPC(ctx, npc, tileSize) {
            const x = npc.x * tileSize;
            const y = npc.y * tileSize;
            
            if (npc.sprite === 'ian') {
                ctx.fillStyle = '#8B0000';
                ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
                ctx.fillStyle = '#A00000';
                ctx.fillRect(x + 5, y - 5, tileSize * 2 - 10, 10);
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(x + 8, y - 10, tileSize * 2 - 16, 8);
                ctx.fillStyle = '#000000';
                ctx.fillRect(x + 15, y + 15, 5, 5);
                ctx.fillRect(x + 30, y + 15, 5, 5);
            } else if (npc.sprite === 'rylee') {
                ctx.fillStyle = '#FF00FF';
                ctx.fillRect(x, y, tileSize * 2, tileSize * 2);
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(x + 5, y - 5, tileSize * 2 - 10, 10);
                ctx.fillStyle = '#FFD700';
                ctx.fillRect(x + 8, y - 10, tileSize * 2 - 16, 8);
                ctx.fillStyle = '#FF0000';
                ctx.fillRect(x + 15, y + 15, 5, 5);
                ctx.fillRect(x + 30, y + 15, 5, 5);
            } else if (npc.sprite === 'bekah') {
                ctx.fillStyle = '#FF69B4';
                ctx.fillRect(x, y, tileSize, tileSize * 0.8);
                ctx.fillStyle = '#FFC0CB';
                ctx.fillRect(x + 3, y - 3, tileSize - 6, tileSize - 6);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x + 3, y - 6, tileSize - 6, 5);
            } else if (npc.sprite === 'ghost') {
                ctx.fillStyle = '#E0E0E0';
                ctx.beginPath();
                ctx.arc(x + tileSize/2, y + tileSize/2, tileSize/2, 0, Math.PI * 2);
                ctx.fill();
            } else if (npc.sprite === 'merchant') {
                ctx.fillStyle = '#2F4F4F';
                ctx.fillRect(x, y, tileSize, tileSize);
            } else if (npc.sprite === 'healer') {
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, tileSize, tileSize);
            } else if (npc.sprite === 'elder') {
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillRect(x, y, tileSize, tileSize/3);
            } else {
                ctx.fillStyle = '#FFC0CB';
                ctx.fillRect(x, y, tileSize, tileSize);
                ctx.fillStyle = '#8B4513';
                ctx.fillRect(x, y, tileSize, tileSize/3);
            }
            
            ctx.fillStyle = '#000000';
            ctx.fillRect(x + 5, y + 8, 3, 3);
            ctx.fillRect(x + 12, y + 8, 3, 3);
        }
        
        function drawPlayer(ctx) {
            const player = gameState.player;
            const tileSize = maps[gameState.currentArea].tileSize;
            const partyLeader = gameState.party[0];
            
            ctx.fillStyle = partyLeader.shirtColor;
            ctx.fillRect(player.x, player.y, tileSize, tileSize);
            ctx.fillStyle = partyLeader.skinTone;
            ctx.fillRect(player.x + 3, player.y - 5, tileSize - 6, tileSize - 6);
            ctx.fillStyle = partyLeader.hairColor;
            ctx.fillRect(player.x + 3, player.y - 8, tileSize - 6, 5);
            ctx.fillStyle = '#000000';
            if (player.direction === 'down') {
                ctx.fillRect(player.x + 5, player.y + 3, 3, 3);
                ctx.fillRect(player.x + 12, player.y + 3, 3, 3);
            } else {
                ctx.fillRect(player.x + 5, player.y + 2, 3, 3);
                ctx.fillRect(player.x + 12, player.y + 2, 3, 3);
            }
            ctx.fillStyle = partyLeader.pantsColor;
            ctx.fillRect(player.x + 3, player.y + tileSize - 5, 5, 5);
            ctx.fillRect(player.x + 12, player.y + tileSize - 5, 5, 5);
        }
        
        function updateHUD() {
            const partyLeader = gameState.party[0];
            document.getElementById('hudName').textContent = partyLeader.name;
            document.getElementById('hudLevel').textContent = partyLeader.level;
            document.getElementById('hudHP').textContent = `${partyLeader.hp}/${partyLeader.maxHp}`;
            document.getElementById('hudPP').textContent = `${partyLeader.pp}/${partyLeader.maxPp}`;
            document.getElementById('hudEXP').textContent = partyLeader.exp;
            document.getElementById('hudMoney').textContent = partyLeader.money || 0;
            document.getElementById('hudLocation').textContent = getLocationName(gameState.currentArea);
        }
        
        function getLocationName(areaId) {
            const locations = {
                'room303': 'Room 303',
                'closet': 'The Closet',
                'darkForest': 'Dark Wonderland Forest',
                'graveyard': 'The Graveyard',
                'village': 'The Village',
                'upperVillage': 'Upper Village',
                'castleWalls': 'Castle Walls',
                'castle': 'The Castle'
            };
            return locations[areaId] || 'Unknown';
        }
        
        function showDialogue(text) {
            gameState.inDialogue = true;
            document.getElementById('dialogueText').textContent = text;
            document.getElementById('dialogueBox').classList.add('active');
        }
        
        function closeDialogue() {
            gameState.inDialogue = false;
            document.getElementById('dialogueBox').classList.remove('active');
            
            if (gameState.dialogueQueue.length > 0) {
                const nextDialogue = gameState.dialogueQueue.shift();
                if (nextDialogue) {
                    setTimeout(() => showDialogue(nextDialogue), 500);
                } else if (gameState.pendingBoss) {
                    const boss = gameState.pendingBoss;
                    gameState.pendingBoss = null;
                    startCombat(boss);
                }
            } else if (gameState.pendingExit) {
                const exit = gameState.pendingExit;
                gameState.pendingExit = null;
                transitionArea(exit.targetArea, exit.targetX, exit.targetY);
            } else if (gameState.pendingBoss) {
                const boss = gameState.pendingBoss;
                gameState.pendingBoss = null;
                startCombat(boss);
            }
        }
        
        function startOpeningScene() {
            const char = gameState.party[0];
            
            gameState.dialogueQueue = [
                `${char.name}, you're in your dorm room at John Neumaier Hall.`,
                "It's a quiet evening... or so you thought.",
                "Suddenly, you hear a violent crash from the closet.",
                "IZZY SCREAMS!",
                "Something is terribly wrong...",
                "You need to investigate the closet on the right side of the room!"
            ];
            
            showDialogue(gameState.dialogueQueue.shift());
        }
        
        function toggleMenu() {
            const menu = document.getElementById('gameMenu');
            menu.classList.toggle('active');
            gameState.paused = menu.classList.contains('active');
        }
        
        function showStatus() {
            const partyLeader = gameState.party[0];
            gameState.dialogueQueue = [
                `${partyLeader.name} - Level ${partyLeader.level}`,
                `HP: ${partyLeader.hp}/${partyLeader.maxHp}`,
                `PP: ${partyLeader.pp}/${partyLeader.maxPp}`,
                `Attack: ${partyLeader.attack}`,
                `Defense: ${partyLeader.defense}`,
                `Speed: ${partyLeader.speed}`,
                `Weapon: ${gameState.equippedWeapon ? items[gameState.equippedWeapon].name : 'None'}`
            ];
            showDialogue(gameState.dialogueQueue.shift());
            document.getElementById('gameMenu').classList.remove('active');
        }
        
        function saveGame() {
            localStorage.setItem('johnNeumaierSave', JSON.stringify(gameState));
            soundSystem.playSound('victory');
            showCombatMessage('Game saved!');
            document.getElementById('gameMenu').classList.remove('active');
        }
        
        function loadGame() {
            const saveData = localStorage.getItem('johnNeumaierSave');
            if (saveData) {
                const parsed = JSON.parse(saveData);
                gameState = { ...gameState, ...parsed };
                gameState.player = parsed.player || gameState.player;
                gameState.flags = parsed.flags || gameState.flags;
                gameState.party = parsed.party || gameState.party;
                gameState.inventory = parsed.inventory || gameState.inventory;
                gameState.currentArea = parsed.currentArea || 'room303';
                spawnEnemies();
                updateHUD();
                soundSystem.playSound('victory');
                showCombatMessage('Game loaded!');
            } else {
                showCombatMessage('No save file found!');
            }
            document.getElementById('gameMenu').classList.remove('active');
        }
        
        function returnToTitle() {
            if (confirm('Return to title screen? Your progress will be saved.')) {
                saveGame();
                window.location.href = 'index.html';
            }
        }
        
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    gameState.keys.up = true;
                    e.preventDefault();
                    break;
                case 'arrowdown':
                case 's':
                    gameState.keys.down = true;
                    e.preventDefault();
                    break;
                case 'arrowleft':
                case 'a':
                    gameState.keys.left = true;
                    e.preventDefault();
                    break;
                case 'arrowright':
                case 'd':
                    gameState.keys.right = true;
                    e.preventDefault();
                    break;
            }
            
            if (e.key.toLowerCase() === 'e') {
                gameState.keys.interact = true;
            }
            
            if (e.key === ' ' && gameState.inDialogue) {
                e.preventDefault();
                if (gameState.dialogueQueue.length > 0) {
                    showDialogue(gameState.dialogueQueue.shift());
                } else {
                    closeDialogue();
                }
            }
            
            if (e.key === 'Escape' && !gameState.inDialogue && !gameState.combat.active) {
                if (document.getElementById('inventoryScreen').classList.contains('active')) {
                    closeInventory();
                } else if (document.getElementById('shopScreen').classList.contains('active')) {
                    closeShop();
                } else if (document.getElementById('phoneScreen').classList.contains('active')) {
                    closePhone();
                } else {
                    toggleMenu();
                }
            }
        });
        
        document.addEventListener('keyup', (e) => {
            switch(e.key.toLowerCase()) {
                case 'arrowup':
                case 'w':
                    gameState.keys.up = false;
                    break;
                case 'arrowdown':
                case 's':
                    gameState.keys.down = false;
                    break;
                case 'arrowleft':
                case 'a':
                    gameState.keys.left = false;
                    break;
                case 'arrowright':
                case 'd':
                    gameState.keys.right = false;
                    break;
                case 'e':
                    gameState.keys.interact = false;
                    break;
            }
        });
        
        initGame();
    </script>
</body>
